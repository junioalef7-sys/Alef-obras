name: Apply light readability fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply readability fix
        shell: bash
        env:
          CSS_B64: "   oZXJlKGlucHV0LHRleHRhcmVhKTo6cGxhY2Vob2xkZXJ7Y29sb3I6IzQ3NTU2OSFpbXBvcnRhbnQ7b3BhY2l0eToxIWltcG9ydGFudDstd2Via2l0LXRleHQtZmlsbC1jb2xvcjojNDc1NTY5IWltcG9ydGFudH0KYm9keS5lZExpZ2h0IDp3aGVyZShidXR0b24sLmJ0bixhLmJ0bikgOnd       oZXJlKC5mbVZhbHVlLC5maW5hbmNlUm93IGIsLmZpbmFuY2VDYXRlZ29yeVRvcCBiLC5lZEVxTWV0cmljIGIsLmVkRXFQZXJpb2RDYXJkIGIsLmhpc3RvcnlNZXRyaWMgYiwuaGlzdG9yeUlkZW50aXR5IGIsLmZvbGhhRnVuY2lvbmFyaW9HcmlkIGIsLm9icmFNb2RlbEtwaXMgYiw uZWRIb21lS3BpVmFsdWUsLmVkSG9tZVdvcmtOYW1lKXtjb2xvcjojMGYxNzJhIWltcG9ydGFudDtvcGFjaXR5OjEhaW1wb3J0YW50O2ZvbnQtd2VpZ2h0OjgwMCFpbXBvcnRhbnQ7LXdlYmtpdC10ZXh0LWZpbGwtY29sb3I6IzBmMTcyYSFpbXBvcnRhbnR9Cjwvc3R5bGU+"
        run: |
          python3 - <<'PY'
          import os, base64, re
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = base64.b64decode(os.environ['CSS_B64']).decode('utf-8')
          s = re.sub(r'\n?<style id="edifiq-light-readability-final-v5">.*?</style>\n?', '\n', s, flags=re.S)
          s = s.replace('</body>', css + '\n</body>', 1) if '</body>' in s else s + '\n' + css
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: reforcar legibilidade do modo claro"
          git push
