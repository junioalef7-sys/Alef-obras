name: Apply light mode readability v5

on:
  push:
    paths:
      - '.github/workflows/apply-light-readability-v5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply final light mode readability layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css = r'''
<style id="edifiq-light-readability-final-v5">
/* EDIFIQ — camada final de legibilidade do modo claro. Somente aparência. */
body.edLight{
  --text:#0f172a!important;
  --muted:#334155!important;
  --line:#cbd5e1!important;
  color:#0f172a!important;
  -webkit-font-smoothing:antialiased;
}

/* Regra global: nenhum texto auxiliar deve ficar lavado/apagado no modo claro. */
body.edLight main :where(p,span,small,label,legend,li,dt,dd,th,td,em),
body.edLight .modal :where(p,span,small,label,legend,li,dt,dd,th,td,em),
body.edLight .edifiqDrawer :where(p,span,small,label,b,strong),
body.edLight :where(.sub,.muted,.hint,.helper,.caption,.meta,.description,.descricao,.subtitle,.note){
  color:#334155!important;
  opacity:1!important;
  -webkit-text-fill-color:currentColor!important;
  text-shadow:none!important;
}
body.edLight main :where(h1,h2,h3,h4,h5,h6,b,strong),
body.edLight .modal :where(h1,h2,h3,h4,h5,h6,b,strong){
  color:#0f172a!important;
  opacity:1!important;
  -webkit-text-fill-color:currentColor!important;
  text-shadow:none!important;
}
body.edLight :where(input,select,textarea,option){
  color:#111827!important;
  opacity:1!important;
  -webkit-text-fill-color:#111827!important;
}
body.edLight :where(input,textarea)::placeholder{
  color:#475569!important;
  opacity:1!important;
  -webkit-text-fill-color:#475569!important;
}

/* Botões e links mantêm o contraste correto mesmo quando possuem spans/b/ícones internos. */
body.edLight :where(button,.btn,a.btn) :where(span,small,b,strong,em){
  color:inherit!important;
  -webkit-text-fill-color:currentColor!important;
  opacity:1!important;
}
body.edLight :where(.btn.primary,button.primary,.homeProMainBtn,.edHomePrimary,.edKpiPrimary){
  color:#fff!important;
}
body.edLight :where(.btn.primary,button.primary,.homeProMainBtn,.edHomePrimary,.edKpiPrimary) *{color:#fff!important;-webkit-text-fill-color:#fff!important}
body.edLight :where(.btn.gold,button.gold){color:#111827!important}
body.edLight :where(.btn.danger,button.danger,.danger){color:#fff!important}
body.edLight :where(.green){color:#08783e!important}
body.edLight :where(.red){color:#b42332!important}
body.edLight :where(.blue){color:#1d4ed8!important}
body.edLight :where(.gold){color:#1d4ed8!important}

/* VISÃO GERAL — textos, legendas e descrições com contraste alto. */
body.edLight #resumoGeral .rgHead h1,
body.edLight #resumoGeral :where(.rgHealthTitle h2,.rgSectionTitle h2,.rgChartCard h2,.rgRankTop h3){
  color:#0f172a!important;
  opacity:1!important;
  font-weight:900!important;
  -webkit-text-fill-color:#0f172a!important;
}
body.edLight #resumoGeral :where(
  .rgHead .sub,
  .rgStatusCard small,
  .rgHealthTitle p,
  .rgHealthRows,
  .rgHealthRows span,
  .rgMoneyCard small,
  .rgMoneyCard p,
  .rgSectionTitle p,
  .rgCostTop small,
  .rgCostTop p,
  .rgChartCard>p,
  .rgBarCol span,
  .rgBarCol small,
  .rgChartAxis,
  .rgRankTop small,
  .rgRankLine,
  .rgPct
){
  color:#334155!important;
  opacity:1!important;
  font-weight:600!important;
  -webkit-text-fill-color:#334155!important;
  text-shadow:none!important;
}
body.edLight #resumoGeral :where(
  .rgStatusCard strong,
  .rgMoneyCard strong,
  .rgCostTop strong,
  .rgTotalCost,
  .rgTotalCost b,
  .rgRankLine b
){
  color:#0f172a!important;
  opacity:1!important;
  font-weight:900!important;
  -webkit-text-fill-color:#0f172a!important;
}
body.edLight #resumoGeral .rgMoneyCard.rgProfit strong{color:#08783e!important;-webkit-text-fill-color:#08783e!important}
body.edLight #resumoGeral .rgStatusCard strong.blue{color:#1d4ed8!important;-webkit-text-fill-color:#1d4ed8!important}
body.edLight #resumoGeral .rgStatusCard strong.green{color:#08783e!important;-webkit-text-fill-color:#08783e!important}
body.edLight #resumoGeral .rgStatusCard strong.gray{color:#475569!important;-webkit-text-fill-color:#475569!important}
body.edLight #resumoGeral :where(.rgFilters input,.rgFilters select){
  background:#fff!important;
  color:#111827!important;
  border-color:#b8c5d6!important;
  -webkit-text-fill-color:#111827!important;
}

/* CHECKLIST — reforço especial para títulos, etapas, percentuais, valores e textos gerados dinamicamente. */
body.edLight #checklist .pageTitle h1{color:#0f172a!important;-webkit-text-fill-color:#0f172a!important;font-weight:900!important}
body.edLight #checklist .pageTitle .sub{color:#334155!important;-webkit-text-fill-color:#334155!important;opacity:1!important;font-weight:600!important}
body.edLight #checklist :where(.toolbar,select,input,textarea){color:#111827!important;-webkit-text-fill-color:#111827!important}
body.edLight #checkList :where(p,span,small,label,em,li,td,th){
  color:#334155!important;
  opacity:1!important;
  -webkit-text-fill-color:#334155!important;
  text-shadow:none!important;
}
body.edLight #checkList :where(b,strong,h2,h3,h4,h5,h6){
  color:#0f172a!important;
  opacity:1!important;
  font-weight:800!important;
  -webkit-text-fill-color:#0f172a!important;
  text-shadow:none!important;
}
body.edLight #checkList :where(.card,.listItem,.item,.row){border-color:#d6dee9!important}
body.edLight #checkList :where(button,.btn) :where(span,small,b,strong,em){color:inherit!important;-webkit-text-fill-color:currentColor!important}
body.edLight #checkList .green{color:#08783e!important;-webkit-text-fill-color:#08783e!important}
body.edLight #checkList .red{color:#b42332!important;-webkit-text-fill-color:#b42332!important}
body.edLight #checkList .blue{color:#1d4ed8!important;-webkit-text-fill-color:#1d4ed8!important}
body.edLight #checkList .gold{color:#1d4ed8!important;-webkit-text-fill-color:#1d4ed8!important}

/* Demais áreas: rótulos e textos secundários sempre legíveis, sem alterar layout. */
body.edLight :where(
  .financeModernCard,.financeModernPanel,.edEquipeCard,.folhaEquipeCard,.folhaFuncionarioCard,
  .obraModeloCard,.obraModeloPanel,.obraInfoCard,.obraSummaryWrap,.obraSummaryBlock,
  .historyCard,.historyDataGrid,.homeWelcome,.homeProKpi,.homeTool,.homeAction,
  .edHomeKpi,.edHomeWorkCard,.analysisCard,.dashMini,.pay-summary
) :where(p,span,small,label,em){
  opacity:1!important;
  text-shadow:none!important;
}
body.edLight :where(.fmLabel,.financeRow span,.financeCategoryTop span,.edEqMetric small,.edEqPeriodCard small,.historyMetric small,.historyIdentity small,.folhaFuncionarioGrid small,.obraModelKpis small,.edHomeKpi small,.edHomeWorkMeta,.edHomeWorkSub){
  color:#334155!important;
  opacity:1!important;
  -webkit-text-fill-color:#334155!important;
}
body.edLight :where(.fmValue,.financeRow b,.financeCategoryTop b,.edEqMetric b,.edEqPeriodCard b,.historyMetric b,.historyIdentity b,.folhaFuncionarioGrid b,.obraModelKpis b,.edHomeKpiValue,.edHomeWorkName){
  color:#0f172a!important;
  opacity:1!important;
  font-weight:800!important;
  -webkit-text-fill-color:#0f172a!important;
}
</style>
'''

          # Remove uma eventual versão v5 anterior para não duplicar a camada.
          text = re.sub(r'\n?<style id="edifiq-light-readability-final-v5">.*?</style>\n?', '\n', text, flags=re.S)

          if '</body>' in text:
              text = text.replace('</body>', css + '\n</body>', 1)
          else:
              text += '\n' + css

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patched index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: deixar todos os textos nítidos no modo claro"
            git push
          fi
