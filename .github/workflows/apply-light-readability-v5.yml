name: Apply light readability fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply readability fix
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = Path('.github/light-readability-v5.css').read_text(encoding='utf-8')
          s = re.sub(r'\n?<style id="edifiq-light-readability-final-v5">.*?</style>\n?', '\n', s, flags=re.S)
          s = s.replace('</body>', css + '\n</body>', 1) if '</body>' in s else s + '\n' + css
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: reforcar legibilidade do modo claro"
          git push
