name: Publicar EDIFIQ auditado
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: edific-pages-audit-safe
  cancel-in-progress: true
jobs:
  validate:
    name: Validar e preparar versão pública
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Proteger login contra regressão
        run: node tests/login-smoke.cjs
      - name: Auditar núcleo do aplicativo
        run: |
          python3 scripts/check-release.py
          node tests/core65.cjs
          node tests/audit75.cjs
      - name: Validar scripts externos
        run: |
          for f in billing-fix57.js account-delete-fix61.js trial-fix62.js billing-hotfix63.js access-limit63.js core-fix65.js ui-fix67.js login-ui68.js orcamentos-link79.js orcamentos-fix81.js navigation-fix82.js photo-purge83.js action-fix85.js edifiq-sw.js; do node --check "$f"; done
      - name: Validar navegação e ações críticas
        run: |
          grep -q "MAIN_PAGES=new Set(\['dashboard','financeiro','funcionarios','obras'\])" navigation-fix82.js
          for x in openFin85 openObra85 openFunc85 openDia85 openVale85 openPay85; do grep -q "$x" action-fix85.js; done
          grep -q "touchend" action-fix85.js
          grep -q "window.print" action-fix85.js
          grep -q "go('financeiro')" index.html
          grep -q "go('funcionarios')" index.html
          grep -q "goMenu('obras')" index.html
          grep -q 'onclick="openFin()"' index.html
          grep -q 'onclick="openObra()"' index.html
          grep -q 'onclick="openFunc()"' index.html
          grep -q 'onclick="openDia()"' index.html
          for x in finM obraM funcM diaM adiantM; do grep -q "id=\"$x\"" index.html; done
      - name: Validar módulo de Orçamentos
        run: |
          grep -q "menuOrcamentos79" orcamentos-link79.js
          grep -q "edifiq_orcamento_salvar" orcamentos.html
          grep -q "edifiq_orcamento_converter_em_obra" orcamentos.html
          grep -q "build(r)" orcamentos-fix81.js
          grep -q "Assinatura do prestador de serviço" orcamentos-fix81.js
          grep -q "files:\[pack.file\]" orcamentos-fix81.js
      - name: Validar exclusão imediata de conta
        run: |
          grep -q "edifiq-excluir-conta-imediato" account-delete-fix61.js
          grep -q "EXCLUIR MINHA CONTA" account-delete-fix61.js
          grep -q "Excluir conta agora" account-delete-fix61.js
      - name: Validar exclusão manual de fotos
        run: |
          grep -q "edifiq-purge-minhas-fotos" photo-purge83.js
          grep -q "EXCLUIR FOTOS" photo-purge83.js
          grep -q "Excluir todas as fotos antigas" photo-purge83.js
          ! grep -q "setTimeout(run83" photo-purge83.js
      - name: Preparar versão pública auditada
        run: |
          python3 scripts/prepare-pages-v85.py
          grep -q './orcamentos-link79.js?v=79' .pages/index.html
          grep -q './navigation-fix82.js?v=82' .pages/index.html
          grep -q './photo-purge83.js?v=83' .pages/index.html
          grep -q './action-fix85.js?v=853' .pages/index.html
          grep -q "caches.delete" .pages/edifiq-sw.js
          grep -q "cache:'no-store'" .pages/edifiq-sw.js
          grep -q '"start_url": "./?pwa=853"' .pages/manifest.webmanifest
          grep -q 'ORCAMENTOS_V80_TIMEOUT_SAFE' .pages/orcamentos.html
          grep -q './orcamentos-fix81.js?v=81' .pages/orcamentos.html
          grep -q 'Orçamentos — EDIFIQ' .pages/orcamentos.html
          grep -q '"short_name": "EDIFIQ"' .pages/manifest.webmanifest
          test -f .pages/action-fix85.js
          test -f .pages/orcamentos.html
          test -f .pages/navigation-fix82.js
          test -f .pages/photo-purge83.js
          ! grep -q 'black-translucent' .pages/index.html
          ! grep -q 'BILLING_FIX' .pages/edifiq-sw.js
          ! grep -q 'injectFix' .pages/edifiq-sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
  deploy:
    name: Publicar versão auditada
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
