name: Rodape OBRIX fixo sem alterar visual ou funcoes
on:
  push:
    branches: [test/obrix-rodape-fixo-preservacao-20261113]
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Testes de sincronizacao aprovados em Obras
        run: |
          node --test tests/obras-sem-repintura-sincronizacao.cjs
          OBRIX_TEST_ROOT=obrix-android-inicial node --test tests/obras-sem-repintura-sincronizacao.cjs
      - name: Instalar Playwright iPhone WebKit e Android Desktop Chromium
        run: |
          npm install --prefix /tmp/obrix-test-deps playwright@1.62.1 --no-save
          /tmp/obrix-test-deps/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verificar rodape fixo durante rolagem e botoes intactos
        env:
          NODE_PATH: /tmp/obrix-test-deps/node_modules
        run: node tests/rodape-fixo-preservacao.cjs
