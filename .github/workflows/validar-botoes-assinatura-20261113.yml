name: OBRIX buttons fast and subscription stable
on:
  push:
    branches: [test/obrix-botoes-assinatura-estaveis-20261113]
permissions:
  contents: read
jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Regressao Obras e navegacao
        run: |
          node --check obrix-ui-stability.js
          node --check obrix-android-inicial/obrix-ui-stability.js
          node --check obrix-assinaturas-main.js
          node --check obrix-android-inicial/obrix-assinaturas-main.js
          node --test tests/obras-sem-repintura-sincronizacao.cjs
          OBRIX_TEST_ROOT=obrix-android-inicial node --test tests/obras-sem-repintura-sincronizacao.cjs
      - name: Instalar navegadores
        run: |
          npm install --prefix /tmp/obrix-test-deps playwright@1.62.1 --no-save
          /tmp/obrix-test-deps/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Validar abertura e planos com dados simulados
        env:
          NODE_PATH: /tmp/obrix-test-deps/node_modules
        run: node tests/botoes-assinatura-sem-piscadas.cjs
