name: Validar estabilidade continua
on:
  push:
    branches: [fix/desempenho-continuo-20261112]
permissions:
  contents: read
jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Testar concorrencia, pintura e reconexao
        run: |
          node --test tests/stability.cjs
          OBRIX_TEST_ROOT=obrix-android-inicial node --test tests/stability.cjs
      - name: Instalar navegadores de teste
        run: |
          npm install --prefix /tmp/obrix-test-deps playwright@1.62.1 --no-save
          /tmp/obrix-test-deps/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Testar WebKit iPhone e Chromium Android e desktop
        env:
          NODE_PATH: /tmp/obrix-test-deps/node_modules
        run: node tests/stability-browser.cjs
