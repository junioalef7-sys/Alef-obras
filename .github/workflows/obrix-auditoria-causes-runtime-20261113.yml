name: OBRIX auditoria inicializacao unica e diagnóstico versionado (somente teste)
on:
  push:
    branches: [test/obrix-auditoria-causes-runtime-20261113]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Auditoria duplicidade e identificação de build
        run: |
          node --check obrix-startup-router.js
          node --check obrix-android-inicial/obrix-startup-router.js
          node --check obrix-auditoria-preview-20261113.js
          node --check obrix-android-inicial/obrix-auditoria-preview-20261113.js
          node tests/obrix-startup-duplicate-loader-audit.cjs
      - name: Sintaxe, cache e sincronizacao
        run: |
          node --test tests/obrix-sw-fast-versioned.cjs
          node --test tests/obras-sem-repintura-sincronizacao.cjs
          OBRIX_TEST_ROOT=obrix-android-inicial node --test tests/obras-sem-repintura-sincronizacao.cjs
      - name: Browsers para diagnostico de contraste e UI
        run: |
          npm install --prefix /tmp/obrix-test-deps playwright@1.62.1 --no-save
          /tmp/obrix-test-deps/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Validar Configuracoes e Obras em ambos temas
        env:
          NODE_PATH: /tmp/obrix-test-deps/node_modules
        run: |
          node tests/obrix-config-cartoes-sem-vermelho.cjs
          node tests/obrix-obras-progresso-sem-oscilacao.cjs

      - name: Servir a mesma arvore de arquivos da previa sem a pagina de protecao Vercel
        run: |
          (nohup python3 -m http.server 8765 --bind 127.0.0.1 </dev/null >/tmp/obrix-real-page.log 2>&1 &)
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/obrix.html > /dev/null
      - name: Abrir a pagina implantada sem login e medir CSS REAL dos botoes
        env:
          NODE_PATH: /tmp/obrix-test-deps/node_modules
        run: node tests/obrix-e2e-real-preview-config.cjs
      - name: Anexar captura de evidencia (se produzida)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: obrix-real-page-audit
          path: test-results/obrix-preview-e2e/
          if-no-files-found: ignore
