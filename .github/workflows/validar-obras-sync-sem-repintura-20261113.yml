name: Validar Obras sem repinturas por sincronizacao
on:
  push:
    branches: [test/obrix-obras-sync-sem-repintura-20261113]
permissions:
  contents: read
jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validar sintaxe e comparacao de obras
        run: |
          node --check obrix-core-main.js
          node --check obrix-android-inicial/obrix-core-main.js
          node --check obrix-obras-offline.js
          node --check obrix-android-inicial/obrix-obras-offline.js
          node --test tests/obras-sem-repintura-sincronizacao.cjs
          OBRIX_TEST_ROOT=obrix-android-inicial node --test tests/obras-sem-repintura-sincronizacao.cjs
          node --test tests/progress-without-flicker.cjs
          OBRIX_TEST_ROOT=obrix-android-inicial node --test tests/progress-without-flicker.cjs
      - name: Instalar browsers de teste
        run: |
          npm install --prefix /tmp/obrix-test-deps playwright@1.62.1 --no-save
          /tmp/obrix-test-deps/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Testar iPhone Android e computador por 65 segundos
        env:
          NODE_PATH: /tmp/obrix-test-deps/node_modules
        run: node tests/progress-without-flicker-browser.cjs
