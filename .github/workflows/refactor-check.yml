name: Validar reformulação EDIFIQ
on:
  push:
    branches: [refactor-edific-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe
        run: |
          node --check src/core/auth-controller.js
          node --check src/adapters/supabase-readonly.js
          node --check src/adapters/supabase-obras-write.js
          node --check src/adapters/supabase-team-write.js
          node --check src/adapters/supabase-team-adjustments.js
          node --check src/core/team-finance-summary.js
          node --check src/app/equipe-editor.js
          node --check src/app/equipe-ajustes-ui.js
      - name: Testes da reformulação
        run: |
          node tests/refactor-auth.cjs
          node tests/refactor-readonly-supabase.cjs
          node tests/refactor-obras-write.cjs
          node tests/refactor-team-write.cjs
          node tests/refactor-team-finance-summary.cjs
