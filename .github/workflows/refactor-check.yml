name: Validar reformulação EDIFIQ
on:
  push:
    branches: [refactor-edific-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe segura
        run: |
          node --check src/core/auth-controller.js
          node --check src/core/money-core.js
          node --check src/core/team-finance-core.js
          node --check src/core/team-finance-summary.js
          node --check src/core/backup-core.js
          node --check src/core/billing-core.js
          node --check src/core/sync-queue.js
          node --check src/core/account-deletion-core.js
          node --check src/core/integration-controller.js
          node --check src/adapters/supabase-readonly.js
          node --check src/adapters/supabase-obras-write.js
          node --check src/adapters/supabase-team-write.js
          node --check src/app/equipe-editor.js
          node --check src/app/equipe-summary-view.js
          node --check src/app/financeiro-summary-view.js
          node --check src/app/homologacao-obras-autoload.js
      - name: Testes da reformulação
        run: |
          node tests/refactor-auth.cjs
          node tests/refactor-readonly-supabase.cjs
          node tests/refactor-obras-write.cjs
          node tests/refactor-team-write.cjs
          node tests/refactor-team-finance-summary.cjs
          node tests/refactor-team-finance.cjs
          node tests/refactor-backup.cjs
          node tests/refactor-billing.cjs
          node tests/refactor-sync.cjs
          node tests/refactor-account-deletion.cjs
          node tests/refactor-integration.cjs
      - name: Montar Preview
        run: python3 scripts/prepare-pages-v85.py
      - name: Garantir Preview protegido
        run: |
          test -f .pages/index.html
          grep -q 'supabase-obras-write.js' .pages/index.html
          grep -q 'supabase-team-write.js' .pages/index.html
          grep -q 'team-finance-summary.js' .pages/index.html
          grep -q 'equipe-summary-view.js' .pages/index.html
          grep -q 'financeiro-summary-view.js' .pages/index.html
          grep -q 'homologacao-obras-autoload.js' .pages/index.html
          ! grep -q 'homologacao-shell.js' .pages/index.html
          ! grep -q 'supabase-team-settlement.js' .pages/index.html
          ! grep -q 'supabase-team-adjustments.js' .pages/index.html
          ! grep -q 'equipe-ajustes-ui.js' .pages/index.html
          ! grep -q 'team-payroll-v2.js' .pages/index.html
          ! grep -q 'team-settlement-plan.js' .pages/index.html
