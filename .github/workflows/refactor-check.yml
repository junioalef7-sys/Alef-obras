name: Validar reformulação Edific

on:
  push:
    branches: [refactor-edific-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe do núcleo novo
        run: |
          node --check src/core/auth-controller.js
          node --check src/core/sync-queue.js
          node --check src/core/backup-core.js
      - name: Testar autenticação e sessão
        run: node tests/refactor-auth.cjs
      - name: Testar fila idempotente de sincronização
        run: node tests/refactor-sync-queue.cjs
      - name: Testar Backup e Importação integral
        run: node tests/refactor-backup.cjs
