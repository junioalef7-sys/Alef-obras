name: Validar reformulação EDIFIQ

on:
  push:
    branches: [refactor-edific-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe do núcleo novo
        run: |
          node --check src/core/auth-controller.js