name: Validar reformulação EDIFIQ

on:
  push:
    branches: [refactor-edific-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe do núcleo novo
        run: |
          node --check src/core/auth-controller.js
          node --check src/core/sync-queue.js
          node --check src/core/backup-core.js
          node --check src/core/money-core.js
          node --check src/core/team-finance-core.js
          node --check src/core/billing-core.js
          node --check src/core/account-deletion-core.js
          node --check src/core/integration-controller.js
          node --check src/adapters/supabase-readonly.js
          node --check src/app/homologacao-shell.js
      - name: Testar autenticação e sessão
        run: node tests/refactor-auth.cjs
      - name: Testar fila idempotente de sincronização
        run: node tests/refactor-sync-queue.cjs
      - name: Testar Backup e Importação integral
        run: node tests/refactor-backup.cjs
      - name: Testar Obras Equipe e Financeiro
        run: node tests/refactor-team-finance.cjs
      - name: Testar trial cobrança e liberação
        run: node tests/refactor-billing.cjs
      - name: Testar exclusão segura de conta
        run: node tests/refactor-account-deletion.cjs
      - name: Testar integração completa
        run: node tests/refactor-integration.cjs
      - name: Testar Supabase somente leitura
        run: node tests/refactor-readonly-supabase.cjs
      - name: Validar interface funcional de homologação
        run: |
          test -f homologacao-refactor.html
          test -f src/app/homologacao-shell.js
          test -f src/adapters/supabase-readonly.js
          grep -q '<title>EDIFIQ • Homologação</title>' homologacao-refactor.html
          grep -q 'Entrar no ambiente de teste' homologacao-refactor.html
          grep -q 'data-screen="obras"' homologacao-refactor.html
          grep -q 'data-screen="equipe"' homologacao-refactor.html
          grep -q 'data-screen="financeiro"' homologacao-refactor.html
          grep -q 'Marca oficial: EDIFIQ' homologacao-refactor.html
          grep -q "mode:'readonly'" src/adapters/supabase-readonly.js
          ! grep -Eq '\.(insert|update|delete|upsert)\(' src/adapters/supabase-readonly.js
          grep -q 'simulateBackup' src/app/homologacao-shell.js
          grep -q 'simulateSync' src/app/homologacao-shell.js
      - name: Montar pacote de homologação
        run: |
          rm -rf homologacao-build
          mkdir -p homologacao-build/src/core homologacao-build/src/app homologacao-build/src/adapters
          cp homologacao-refactor.html homologacao-build/index.html
          cp src/core/*.js homologacao-build/src/core/
          cp src/app/*.js homologacao-build/src/app/
          cp src/adapters/*.js homologacao-build/src/adapters/
          test -f homologacao-build/index.html
          test -f homologacao-build/src/core/integration-controller.js
          test -f homologacao-build/src/adapters/supabase-readonly.js
          test -f homologacao-build/src/app/homologacao-shell.js
      - name: Salvar pacote de homologação
        uses: actions/upload-artifact@v4
        with:
          name: edifiq-refactor-homologacao
          path: homologacao-build
          if-no-files-found: error
