name: OBRIX gate latencia e contraste Obras
on:
  push:
    branches: [test/obrix-abertura-rapida-status-branco-20261113]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Sintaxe e sincronizacao
        run: |
          node --check obrix-pos-login-loader.js
          node --check obrix-android-inicial/obrix-pos-login-loader.js
          node --check obrix-ui-stability.js
          node --check obrix-android-inicial/obrix-ui-stability.js
          node --check obrix-checklist-progress-core.js
          node --check obrix-android-inicial/obrix-checklist-progress-core.js
          node --test tests/obras-sem-repintura-sincronizacao.cjs
          OBRIX_TEST_ROOT=obrix-android-inicial node --test tests/obras-sem-repintura-sincronizacao.cjs
      - name: Instalar Chromium e WebKit
        run: |
          npm install --prefix /tmp/obrix-test-deps playwright@1.62.1 --no-save
          /tmp/obrix-test-deps/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Validar abertura sem espera e sem oscilacoes de cor e progresso
        env:
          NODE_PATH: /tmp/obrix-test-deps/node_modules
        run: node tests/obrix-abertura-rapida-contraste.cjs
