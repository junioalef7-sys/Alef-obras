name: OBRIX exclusão de conta - Storage seguro
on:
  push:
    branches:
      - test/obrix-diarias-config-diario-erros-20261114
    paths:
      - 'supabase/functions/obrix-delete-account/**'
      - 'tests/obrix-delete-account-storage.cjs'
      - '.github/workflows/obrix-account-storage-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020e8
        with:
          node-version: '22'
      - name: Testar limpeza física, paginação e isolamento entre empresas
        run: node --test tests/obrix-delete-account-storage.cjs
