name: OBRIX gate de preservacao visual e funcionalidades
on:
  push:
    branches: [test/obrix-garantia-preservacao-20261113]
permissions:
  contents: read
jobs:
  preservar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Regressao de Obras e rodape
        run: |
          node --test tests/obras-sem-repintura-sincronizacao.cjs
          OBRIX_TEST_ROOT=obrix-android-inicial node --test tests/obras-sem-repintura-sincronizacao.cjs
      - name: Instalar navegadores de teste
        run: |
          npm install --prefix /tmp/obrix-test-deps playwright@1.62.1 --no-save
          /tmp/obrix-test-deps/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verificar DOM verdadeiro rodape fixo temas e navegacao
        env:
          NODE_PATH: /tmp/obrix-test-deps/node_modules
        run: node tests/obrix-preservacao-real-dom.cjs
