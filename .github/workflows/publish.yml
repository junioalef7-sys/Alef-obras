name: EDIFIQ validação manual legada

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    name: Fluxo legado desativado para publicação
    runs-on: ubuntu-latest
    steps:
      - name: Informar fluxo oficial
        run: |
          echo "Este workflow não publica mais o aplicativo."
          echo "A publicação oficial é feita exclusivamente por .github/workflows/publish-login-safe.yml."
          echo "Isso evita duas versões diferentes disputando o GitHub Pages e elimina regressões de cache/interface."
