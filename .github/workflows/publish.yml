name: Publicar EDIFIQ validado

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edific-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validar versão e fluxos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Impedir perda das correções aprovadas
        run: python3 scripts/check-release.py
      - name: Preparar arquivos públicos do aplicativo
        run: |
          mkdir -p .pages
          cp index.html .pages/index.html
          for f in edifiq-sw.js manifest.webmanifest edifiq-icon-192.png edific-icon.svg privacidade.html exclusao-conta.html; do
            test -f "$f" || { echo "::error::Arquivo público obrigatório ausente: $f"; exit 1; }
            cp "$f" ".pages/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path('.pages/index.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace('<meta content="EDIFIQ" name="apple-mobile-web-app-title"/>','<meta content="Edific" name="apple-mobile-web-app-title"/>',1)
          html = html.replace('<meta name="application-name" content="EDIFIQ"/>','<meta name="application-name" content="Edific"/>',1)
          html = html.replace('var APP_NAME="EDIFIQ", SHORT_NAME="EDIFIQ", installEvent=null;','var APP_NAME="Edific", SHORT_NAME="Edific", installEvent=null;',1)
          html = html.replace('Instalar o EDIFIQ','Instalar o Edific').replace('instalar o EDIFIQ','instalar o Edific')
          html = re.sub(r'(<link[^>]+rel="apple-touch-icon"[^>]+href=")[^"]+("[^>]*>)', r'\1./edifiq-icon-192.png\2', html, count=1, flags=re.I)

          menu_marker = '<button class="edifiqDataRow" onclick="openConfiguracoes()"><span>⚙</span><b>Configurações</b><span class="edifiqChevron">›</span></button>'
          menu_entry = '<button class="edifiqDataRow" id="menuPlanosAssinaturas" type="button" onclick="return edifiqAbrirPlanosMenu49(event)"><span>💳</span><b>Planos e assinaturas</b><span class="edifiqChevron">›</span></button>'
          html = re.sub(r'<button class="edifiqDataRow" id="menuPlanosAssinaturas"[\s\S]*?</button>', menu_entry, html, count=1)
          if 'id="menuPlanosAssinaturas"' not in html:
              if menu_marker not in html:
                  raise SystemExit('Botão Configurações não encontrado para inserir Planos e assinaturas.')
              html = html.replace(menu_marker, menu_marker + '\n  ' + menu_entry, 1)

          head_pos = html.lower().rfind('</head>')
          if head_pos < 0:
              raise SystemExit('Fechamento </head> não encontrado.')
          if 'id="edifiqBillingMenuOnly"' not in html:
              html = html[:head_pos] + '<style id="edifiqBillingMenuOnly">#edSubConfig10,#edSubscriptionConfigCard,#edBillingConfig11{display:none!important}</style>\n' + html[head_pos:]

          html = re.sub(r'<style id="edifiqCheckoutMethods48">[\s\S]*?<script id="edifiqCheckoutMethods48Script">[\s\S]*?</script>\s*', '', html, count=1, flags=re.I)
          checkout_patch = r'''
          <style id="edifiqCheckoutMethods49">
          #edPaymentMethod47{background:rgba(2,6,23,.72)!important;backdrop-filter:blur(4px)}
          #edPaymentMethod47 .modalBox{background:#0f172a!important;color:#f8fafc!important;border:1px solid #334155!important;box-shadow:0 24px 70px rgba(0,0,0,.45)!important}
          #edPaymentMethod47 .modalHead{border-color:#334155!important}#edPaymentMethod47 .modalHead h2{color:#f8fafc!important}#edPaymentMethod47 .sub{color:#cbd5e1!important;opacity:1!important}#edPaymentMethod47 .x{background:#1e293b!important;color:#f8fafc!important;border-color:#334155!important}
          .edPayMethods47{display:grid;gap:10px;margin-top:14px}.edPayMethod47{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid #334155;background:#111827;color:#f8fafc;border-radius:14px;padding:14px 16px;font:inherit;cursor:pointer}.edPayMethod47 strong{display:block;color:#f8fafc!important}.edPayMethod47 small{display:block;color:#cbd5e1!important;opacity:1!important;margin-top:2px}.edPayMethod47 span:first-child{font-size:24px;width:32px;text-align:center}.edPayMethod47:disabled{opacity:.55;cursor:wait}
          body.edLight #edPaymentMethod47{background:rgba(15,23,42,.28)!important}body.edLight #edPaymentMethod47 .modalBox{background:#fff!important;color:#111827!important;border-color:#d8dee9!important;box-shadow:0 24px 70px rgba(15,23,42,.18)!important}body.edLight #edPaymentMethod47 .modalHead{border-color:#e5e7eb!important}body.edLight #edPaymentMethod47 .modalHead h2{color:#111827!important}body.edLight #edPaymentMethod47 .sub{color:#667085!important}body.edLight #edPaymentMethod47 .x{background:#eef2f6!important;color:#111827!important;border-color:#d8dee9!important}body.edLight .edPayMethod47{background:#fff!important;color:#111827!important;border-color:#d8dee9!important}body.edLight .edPayMethod47 strong{color:#111827!important}body.edLight .edPayMethod47 small{color:#667085!important}
          </style>
          <script id="edifiqCheckoutMethods49Script">
          (function(){
            function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
            function closePay(){document.getElementById('edPaymentMethod47')?.remove()}
            function hideConfigBilling(){
              ['edSubConfig10','edSubscriptionConfigCard','edBillingConfig11'].forEach(id=>{const el=document.getElementById(id);if(el){el.style.setProperty('display','none','important');el.hidden=true}});
              document.querySelectorAll('.modal').forEach(m=>{const t=(m.textContent||'').toLowerCase();if(t.includes('planos e pagamento')){const p=m.querySelector('.sub');if(p&&/assinatura recorrente/i.test(p.textContent||''))p.textContent='Pagamento seguro processado pelo Mercado Pago.'}})
            }
            async function start(plano,forma){
              if(window.__edifiqBillingBusy)return;window.__edifiqBillingBusy=true;
              const buttons=[...document.querySelectorAll('#edPaymentMethod47 button')];buttons.forEach(b=>b.disabled=true);
              try{
                if((typeof sb==='undefined'||!sb)&&typeof ensureSupabaseClient==='function')await ensureSupabaseClient();
                if(typeof sb==='undefined'||!sb)throw new Error('Sem conexão com o servidor.');
                if(typeof user==='undefined'||!user?.id)throw new Error('Sua sessão expirou. Entre novamente no aplicativo.');
                const {data,error}=await sb.functions.invoke('edifiq-assinatura-checkout',{body:{plano,forma,return_url:location.href.split('#')[0]}});
                if(error){let msg=error.message||'Não foi possível iniciar o pagamento.';try{if(error.context&&typeof error.context.clone==='function'){const j=await error.context.clone().json();msg=j?.error||j?.detail||msg}}catch(_){ }throw new Error(msg)}
                if(data?.error)throw new Error(data.error);if(!data?.checkout_url)throw new Error('O servidor não retornou o endereço de pagamento.');
                try{localStorage.setItem('edifiq_billing_return_v1',JSON.stringify({at:new Date().toISOString(),plano,forma,checkout_type:data?.checkout_type||'checkout_pro'}))}catch(_){ }
                if(typeof toast==='function')toast(forma==='pix'?'Abrindo pagamento por Pix...':forma==='boleto'?'Abrindo pagamento por boleto...':'Abrindo pagamento por cartão...');
                location.assign(String(data.checkout_url));
              }catch(e){console.error('EDIFIQ checkout 49',e);if(typeof toast==='function')toast(String(e?.message||'Não foi possível iniciar o pagamento.'));buttons.forEach(b=>b.disabled=false);window.__edifiqBillingBusy=false}
            }
            window.edifiqEscolherPagamento47=function(plano){
              plano=String(plano||'').toLowerCase();if(!['mensal','anual'].includes(plano)){if(typeof toast==='function')toast('Plano inválido.');return}
              closePay();const m=document.createElement('div');m.id='edPaymentMethod47';m.className='modal open';
              m.innerHTML=`<div class="modalBox" style="max-width:520px"><div class="modalHead"><div><h2>Forma de pagamento</h2><p class="sub">Escolha como pagar o plano ${esc(plano==='anual'?'Anual':'Mensal')}.</p></div><button class="x" type="button" onclick="document.getElementById('edPaymentMethod47')?.remove()">×</button></div><div class="edPayMethods47"><button class="edPayMethod47" type="button" onclick="edifiqPagar47('${esc(plano)}','cartao')"><span>💳</span><span><strong>Cartão de crédito</strong><small>Pagamento do período atual; renove no próximo vencimento.</small></span></button><button class="edPayMethod47" type="button" onclick="edifiqPagar47('${esc(plano)}','pix')"><span>⚡</span><span><strong>Pix</strong><small>Pagamento do período atual; renove no próximo vencimento.</small></span></button><button class="edPayMethod47" type="button" onclick="edifiqPagar47('${esc(plano)}','boleto')"><span>🧾</span><span><strong>Boleto</strong><small>Pagamento do período atual; liberação após confirmação.</small></span></button></div></div>`;
              document.body.appendChild(m)
            };
            window.edifiqPagar47=start;window.assinarPlanoEdifiq11=function(codigo){window.edifiqEscolherPagamento47(codigo)};
            window.edifiqAbrirPlanosMenu49=function(ev){try{ev?.preventDefault?.();ev?.stopPropagation?.()}catch(_){ }if(typeof openPlanosEdifiq11==='function')openPlanosEdifiq11();else if(typeof toast==='function')toast('Não foi possível abrir Planos e assinaturas.');return false};
            const init=()=>hideConfigBilling();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();new MutationObserver(hideConfigBilling).observe(document.documentElement,{childList:true,subtree:true})
          })();
          </script>
          '''
          body_pos = html.lower().rfind('</body>')
          if body_pos < 0:
              raise SystemExit('Fechamento </body> não encontrado.')
          html = html[:body_pos] + checkout_patch + '\n' + html[body_pos:]
          page.write_text(html,encoding='utf-8')
          PY
          python3 scripts/check-release.py --html .pages/index.html
          touch .pages/.nojekyll
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          data = Path('.pages/index.html').read_bytes()
          public_files = ['index.html','edifiq-sw.js','manifest.webmanifest','edifiq-icon-192.png','edific-icon.svg','privacidade.html','exclusao-conta.html']
          hashes = {name: hashlib.sha256(Path('.pages',name).read_bytes()).hexdigest() for name in public_files}
          Path('.pages/release.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA'],'sha256': hashlib.sha256(data).hexdigest(),'validated': True,'public_files': hashes,'pwa_label': 'Edific','cache': 'edifiq-shell-v49-checkout-pro'}, ensure_ascii=False))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    name: Publicar versão estável
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirmar publicação protegida e versão atual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$mode" != workflow ]; then
            echo '::error::Ative Settings > Pages > Source > GitHub Actions. A publicação direta da branch ignora a validação.'
            exit 1
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo '::error::Existe uma alteração mais recente. Esta execução antiga não será publicada.'
            exit 1
          fi
      - name: Publicar após todas as verificações
        id: deployment
        uses: actions/deploy-pages@v4
