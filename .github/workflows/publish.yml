name: Publicar EDIFIQ validado

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edific-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validar versão e fluxos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Impedir perda das correções aprovadas
        run: |
          python3 scripts/check-release.py
          node tests/checkout52.cjs
      - name: Preparar arquivos públicos do aplicativo
        run: |
          mkdir -p .pages
          cp index.html .pages/index.html
          for f in edifiq-sw.js manifest.webmanifest edifiq-icon-192.png edifiq-menu-logo.jpg edific-icon.svg privacidade.html exclusao-conta.html; do
            test -f "$f" || { echo "::error::Arquivo público obrigatório ausente: $f"; exit 1; }
            cp "$f" ".pages/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path('.pages/index.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace('<meta content="EDIFIQ" name="apple-mobile-web-app-title"/>','<meta content="Edific" name="apple-mobile-web-app-title"/>',1)
          html = html.replace('<meta name="application-name" content="EDIFIQ"/>','<meta name="application-name" content="Edific"/>',1)
          html = html.replace('var APP_NAME="EDIFIQ", SHORT_NAME="EDIFIQ", installEvent=null;','var APP_NAME="Edific", SHORT_NAME="Edific", installEvent=null;',1)
          html = html.replace('Instalar o EDIFIQ','Instalar o Edific').replace('instalar o EDIFIQ','instalar o Edific')
          html = re.sub(r'(<link[^>]+rel="apple-touch-icon"[^>]+href=")[^"]+("[^>]*>)', r'\1./edifiq-icon-192.png\2', html, count=1, flags=re.I)

          menu_marker = '<button class="edifiqDataRow" onclick="openConfiguracoes()"><span>⚙</span><b>Configurações</b><span class="edifiqChevron">›</span></button>'
          menu_entry = '<button class="edifiqDataRow" id="menuPlanosAssinaturas" type="button" onclick="return edifiqAbrirPlanosMenu51(event)"><span>💳</span><b>Planos e assinaturas</b><span class="edifiqChevron">›</span></button>'
          html = re.sub(r'<button class="edifiqDataRow" id="menuPlanosAssinaturas"[\s\S]*?</button>', menu_entry, html, count=1)
          if 'id="menuPlanosAssinaturas"' not in html:
              if menu_marker not in html:
                  raise SystemExit('Botão Configurações não encontrado para inserir Planos e assinaturas.')
              html = html.replace(menu_marker, menu_marker + '\n  ' + menu_entry, 1)

          head_pos = html.lower().rfind('</head>')
          if head_pos < 0:
              raise SystemExit('Fechamento </head> não encontrado.')
          if 'id="edifiqBillingMenuOnly"' not in html:
              html = html[:head_pos] + '<style id="edifiqBillingMenuOnly">#edSubConfig10,#edSubscriptionConfigCard,#edBillingConfig11{display:none!important}</style>\n' + html[head_pos:]

          for n in ('47','48','49','50','51','54'):
              html = re.sub(r'<style id="edifiqCheckoutMethods'+n+r'">[\s\S]*?</style>\s*', '', html, flags=re.I)
              html = re.sub(r'<script id="edifiqCheckoutMethods'+n+r'Script">[\s\S]*?</script>\s*', '', html, flags=re.I)
          html = re.sub(r'<script id="edifiqCheckoutDirect50Script">[\s\S]*?</script>\s*', '', html, flags=re.I)
          html = re.sub(r'<script id="edifiqCheckoutDirect51Script">[\s\S]*?</script>\s*', '', html, flags=re.I)

          checkout_patch = r'''
          <script id="edifiqCheckoutDirect51Script">
          (function(){
            function resetBilling(){
              window.__edifiqBillingBusy=false;
              document.getElementById('edPaymentMethod47')?.remove();
              document.querySelectorAll('[data-ed-billing-plan]').forEach(b=>{b.disabled=false;if(b.dataset.checkoutLabel){b.textContent=b.dataset.checkoutLabel;delete b.dataset.checkoutLabel}});
            }
            function hideConfigBilling(){
              ['edSubConfig10','edSubscriptionConfigCard','edBillingConfig11'].forEach(id=>{const el=document.getElementById(id);if(el){el.style.setProperty('display','none','important');el.hidden=true}});
            }
            async function start(plano){
              plano=String(plano||'').toLowerCase();
              if(!['mensal','anual'].includes(plano)){if(typeof toast==='function')toast('Plano inválido.');return false}
              if(window.__edifiqBillingBusy)return false;
              window.__edifiqBillingBusy=true;
              document.querySelectorAll('[data-ed-billing-plan]').forEach(b=>{b.dataset.checkoutLabel=b.textContent;b.disabled=true;b.textContent='Preparando pagamento…'});
              try{
                if((typeof sb==='undefined'||!sb)&&typeof ensureSupabaseClient==='function')await ensureSupabaseClient();
                if(typeof sb==='undefined'||!sb)throw new Error('Sem conexão com o servidor.');
                if(typeof user==='undefined'||!user?.id)throw new Error('Sua sessão expirou. Entre novamente no aplicativo.');
                if(typeof toast==='function')toast('Abrindo pagamento seguro no Mercado Pago...');
                const {data,error}=await sb.functions.invoke('edifiq-assinatura-checkout',{body:{plano,forma:'mercado_pago',return_url:location.href.split('#')[0]}});
                if(error){
                  let msg=error.message||'Não foi possível iniciar o pagamento.';
                  try{if(error.context&&typeof error.context.clone==='function'){const j=await error.context.clone().json();msg=j?.error||j?.detail||msg}}catch(_){ }
                  throw new Error(msg)
                }
                if(data?.error)throw new Error(data.error);
                if(!data?.checkout_url)throw new Error('O servidor não retornou o endereço de pagamento.');
                try{localStorage.setItem('edifiq_billing_return_v1',JSON.stringify({at:new Date().toISOString(),plano,forma:'mercado_pago',checkout_type:data?.checkout_type||'checkout_pro'}))}catch(_){ }
                const checkout=new URL(String(data.checkout_url));
                if(checkout.protocol!=='https:'||!(checkout.hostname==='mercadopago.com.br'||checkout.hostname.endsWith('.mercadopago.com.br')))throw new Error('Endereço de pagamento inválido. Tente novamente.');
                window.location.assign(checkout.href);
                return false;
              }catch(e){
                console.error('EDIFIQ checkout direto 51',e);
                resetBilling();
                if(typeof toast==='function')toast(String(e?.message||'Não foi possível iniciar o pagamento.'));
                return false;
              }
            }
            window.assinarPlanoEdifiq11=start;
            window.edifiqPagar47=function(plano){return start(plano)};
            window.edifiqEscolherPagamento47=function(plano){return start(plano)};
            window.edifiqAbrirPlanosMenu51=function(ev){try{ev?.preventDefault?.();ev?.stopPropagation?.()}catch(_){ }if(window.__edifiqBillingBusy)return false;resetBilling();if(typeof openPlanosEdifiq11==='function')openPlanosEdifiq11();else if(typeof toast==='function')toast('Não foi possível abrir Planos e assinaturas.');return false};
            window.addEventListener('pageshow',ev=>{if(ev.persisted)resetBilling()});
            const init=()=>{resetBilling();hideConfigBilling()};
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
            new MutationObserver(hideConfigBilling).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          '''

          trial_patch = r'''
          <style id="edifiqTrialLimited54Style">
          #auth .authCommercialHint{display:none!important}
          #edSubscriptionGate{display:none!important}
          #edTrialLimited54{position:fixed;left:12px;right:12px;bottom:82px;z-index:2147482500;max-width:640px;margin:auto;padding:12px 14px;border-radius:16px;background:#111827;color:#f8fafc;border:1px solid #334155;box-shadow:0 16px 40px rgba(0,0,0,.35)}
          #edTrialLimited54 strong{display:block;font-size:15px;margin-bottom:3px}#edTrialLimited54 small{display:block;color:#cbd5e1;line-height:1.35}
          #edTrialLimited54 .ed54Actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}#edTrialLimited54 button{border:1px solid #475569;background:#1e293b;color:#fff;border-radius:10px;padding:9px 11px;font-weight:700}#edTrialLimited54 button.ed54Gold{background:#d8a937;color:#111827;border-color:#d8a937}
          body.edLight #edTrialLimited54{background:#fff;color:#111827;border-color:#d8dee9;box-shadow:0 16px 40px rgba(15,23,42,.16)}body.edLight #edTrialLimited54 small{color:#667085}body.edLight #edTrialLimited54 button{background:#f3f4f6;color:#111827;border-color:#d8dee9}
          </style>
          <script id="edifiqTrialLimited54Script">
          (function(){
            const ALLOWED_PAGES=new Set(['dashboard','inicio','home','obras','funcionarios','equipe']);
            let originalGo=null,goPatched=false;
            function access(s){
              if(!s)return true;
              const st=String(s.status||'').toLowerCase(),now=Date.now();
              if(st==='cortesia')return true;
              if(st==='ativa')return !s.periodo_fim||new Date(s.periodo_fim).getTime()>now;
              if(st==='trial')return !!s.trial_fim&&new Date(s.trial_fim).getTime()>now;
              return false;
            }
            function limited(){const s=window.__edifiqSubscription;return !!(s&&access(s)===false)}
            function removeLoginTrial(){document.querySelectorAll('#auth .authCommercialHint').forEach(el=>{el.textContent='';el.style.setProperty('display','none','important')})}
            function showBlocked(){if(typeof toast==='function')toast('Disponível após a assinatura. No modo limitado ficam liberados somente 1 obra e 1 funcionário.');}
            function patchGo(){
              if(goPatched||typeof window.go!=='function')return;
              originalGo=window.go;
              window.go=function(page){const p=String(page||'').toLowerCase();if(limited()&&!ALLOWED_PAGES.has(p)){showBlocked();return false}return originalGo.apply(this,arguments)};
              goPatched=true;
            }
            function banner(){
              let b=document.getElementById('edTrialLimited54');
              if(!limited()){b?.remove();return}
              if(!b){b=document.createElement('div');b.id='edTrialLimited54';document.body.appendChild(b)}
              b.innerHTML='<strong>Teste grátis encerrado • modo limitado</strong><small>Você pode manter/cadastrar somente 1 obra e 1 funcionário. Financeiro, relatórios, diárias, vales, bônus e os demais recursos ficam bloqueados até a assinatura.</small><div class="ed54Actions"><button type="button" onclick="go(\'obras\')">Obra</button><button type="button" onclick="go(\'funcionarios\')">Funcionário</button><button class="ed54Gold" type="button" onclick="openPlanosEdifiq11&&openPlanosEdifiq11()">Planos e assinaturas</button></div>';
            }
            function blockMenu(){
              document.querySelectorAll('#menuPasta button').forEach(btn=>{
                if(!limited()){btn.disabled=false;return}
                const label=String(btn.querySelector('b')?.textContent||btn.textContent||'').trim().toLowerCase();
                const ok=/planos|assinaturas|obra|equipe|funcion|início|inicio|sair/.test(label);
                btn.disabled=!ok;btn.style.opacity=ok?'':'0.42';
              });
            }
            function blockPageActions(){
              if(!limited())return;
              document.querySelectorAll('#obras button,#funcionarios button,#equipe button').forEach(btn=>{
                const oc=String(btn.getAttribute('onclick')||'');
                const tx=String(btn.textContent||'').trim().toLowerCase();
                const allow=/openObra\s*\(|openFunc\s*\(|closeM\s*\(|go\s*\(\s*[\"\'](?:obras|funcionarios|dashboard)[\"\']/.test(oc)||/editar|cadastrar obra|nova obra|cadastrar funcionário|cadastrar funcionario|fechar|voltar/.test(tx);
                if(!allow&&btn.id!=='menuPlanosAssinaturas'){btn.disabled=true;btn.title='Disponível após assinatura';btn.style.opacity='0.45'}
              });
            }
            async function refresh(){
              try{
                if(typeof user==='undefined'||!user?.id||typeof sb==='undefined'||!sb)return;
                let {data,error}=await sb.rpc('edifiq_assinatura_atual');
                if(!error&&!data){const r=await sb.rpc('edifiq_iniciar_trial');if(!r.error)data=r.data}
                if(data)window.__edifiqSubscription=data;
              }catch(_){ }
              apply();
            }
            function apply(){removeLoginTrial();patchGo();const gate=document.getElementById('edSubscriptionGate');if(gate)gate.style.setProperty('display','none','important');banner();blockMenu();blockPageActions()}
            document.addEventListener('click',function(ev){
              if(!limited())return;
              const btn=ev.target?.closest?.('#menuPasta button');if(!btn)return;
              const label=String(btn.querySelector('b')?.textContent||btn.textContent||'').trim().toLowerCase();
              if(!/planos|assinaturas|obra|equipe|funcion|início|inicio|sair/.test(label)){ev.preventDefault();ev.stopImmediatePropagation();showBlocked()}
            },true);
            const init=()=>{apply();refresh();setInterval(apply,1200);setInterval(refresh,60000)};
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
            window.addEventListener('pageshow',()=>{setTimeout(refresh,100)});
          })();
          </script>
          '''

          body_pos = html.lower().rfind('</body>')
          if body_pos < 0:
              raise SystemExit('Fechamento </body> não encontrado.')
          html = html[:body_pos] + checkout_patch + '\n' + trial_patch + '\n' + html[body_pos:]
          page.write_text(html,encoding='utf-8')
          PY
          python3 scripts/check-release.py --html .pages/index.html
          touch .pages/.nojekyll
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          data = Path('.pages/index.html').read_bytes()
          public_files = ['index.html','edifiq-sw.js','manifest.webmanifest','edifiq-icon-192.png','edifiq-menu-logo.jpg','edific-icon.svg','privacidade.html','exclusao-conta.html']
          hashes = {name: hashlib.sha256(Path('.pages',name).read_bytes()).hexdigest() for name in public_files}
          Path('.pages/release.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA'],'sha256': hashlib.sha256(data).hexdigest(),'validated': True,'public_files': hashes,'pwa_label': 'Edific','cache': 'edifiq-shell-v54-trial-limitado'}, ensure_ascii=False))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    name: Publicar versão estável
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirmar publicação protegida e versão atual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$mode" != workflow ]; then
            echo '::error::Ative Settings > Pages > Source > GitHub Actions. A publicação direta da branch ignora a validação.'
            exit 1
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo '::error::Existe uma alteração mais recente. Esta execução antiga não será publicada.'
            exit 1
          fi
      - name: Publicar após todas as verificações
        id: deployment
        uses: actions/deploy-pages@v4
