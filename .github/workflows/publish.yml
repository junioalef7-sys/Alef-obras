name: Publicar EDIFIQ validado

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edific-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validar versão e fluxos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Impedir perda das correções aprovadas
        run: python3 scripts/check-release.py
      - name: Preparar arquivos públicos do aplicativo
        run: |
          mkdir -p .pages
          cp index.html .pages/index.html
          for f in edifiq-sw.js manifest.webmanifest edifiq-icon-192.png edific-icon.svg privacidade.html exclusao-conta.html; do
            test -f "$f" || { echo "::error::Arquivo público obrigatório ausente: $f"; exit 1; }
            cp "$f" ".pages/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path('.pages/index.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace('<meta content="EDIFIQ" name="apple-mobile-web-app-title"/>','<meta content="Edific" name="apple-mobile-web-app-title"/>',1)
          html = html.replace('<meta name="application-name" content="EDIFIQ"/>','<meta name="application-name" content="Edific"/>',1)
          html = html.replace('var APP_NAME="EDIFIQ", SHORT_NAME="EDIFIQ", installEvent=null;','var APP_NAME="Edific", SHORT_NAME="Edific", installEvent=null;',1)
          html = html.replace('Instalar o EDIFIQ','Instalar o Edific').replace('instalar o EDIFIQ','instalar o Edific')
          html = re.sub(r'(<link[^>]+rel="apple-touch-icon"[^>]+href=")[^"]+("[^>]*>)', r'\1./edifiq-icon-192.png\2', html, count=1, flags=re.I)

          menu_marker = '<button class="edifiqDataRow" onclick="openConfiguracoes()"><span>⚙</span><b>Configurações</b><span class="edifiqChevron">›</span></button>'
          menu_entry = '<button class="edifiqDataRow" id="menuPlanosAssinaturas" onclick="closeDrawer();openPlanosEdifiq11&&openPlanosEdifiq11()"><span>💳</span><b>Planos e assinaturas</b><span class="edifiqChevron">›</span></button>'
          if menu_entry not in html:
              if menu_marker not in html:
                  raise SystemExit('Botão Configurações não encontrado para inserir Planos e assinaturas.')
              html = html.replace(menu_marker, menu_marker + '\n  ' + menu_entry, 1)

          if 'id="edifiqBillingMenuOnly"' not in html:
              head_pos = html.lower().rfind('</head>')
              if head_pos < 0:
                  raise SystemExit('Fechamento </head> não encontrado.')
              html = html[:head_pos] + '<style id="edifiqBillingMenuOnly">#edSubConfig10,#edSubscriptionConfigCard,#edBillingConfig11{display:none!important}</style>\n' + html[head_pos:]

          checkout_patch = r'''
          <style id="edifiqCheckoutMethods47">
          .edPayMethods47{display:grid;gap:10px;margin-top:14px}.edPayMethod47{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line,#d0d5dd);background:var(--card,#fff);color:inherit;border-radius:14px;padding:14px 16px;font:inherit;cursor:pointer}.edPayMethod47 strong{display:block}.edPayMethod47 small{display:block;opacity:.72;margin-top:2px}.edPayMethod47 span:first-child{font-size:24px;width:32px;text-align:center}.edPayMethod47:disabled{opacity:.55;cursor:wait}body.edLight .edPayMethod47{background:#fff;color:#111827}
          </style>
          <script id="edifiqCheckoutMethods47Script">
          (function(){
            function ed47Esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
            function ed47Close(){const m=document.getElementById('edPaymentMethod47');if(m)m.remove()}
            async function ed47Start(plano,forma){
              if(window.__edifiqBillingBusy)return;
              window.__edifiqBillingBusy=true;
              const buttons=[...document.querySelectorAll('#edPaymentMethod47 button')];buttons.forEach(b=>b.disabled=true);
              try{
                if(!window.sb&&typeof ensureSupabaseClient==='function')await ensureSupabaseClient();
                if(!window.sb)throw new Error('Sem conexão com o servidor.');
                try{await sb.from('edifiq_assinaturas').update({plano_preferido:plano}).eq('empresa_user_id',user.id)}catch(_){ }
                const {data,error}=await sb.functions.invoke('edifiq-assinatura-checkout',{body:{plano,forma,return_url:location.href.split('#')[0]}});
                if(error){let msg=error.message||'Não foi possível iniciar o pagamento.';try{if(error.context&&typeof error.context.clone==='function'){const j=await error.context.clone().json();msg=j?.error||j?.detail||msg}}catch(_){ }throw new Error(msg)}
                if(data?.error)throw new Error(data.error);
                if(!data?.checkout_url)throw new Error('O servidor não retornou o endereço de pagamento.');
                try{localStorage.setItem('edifiq_billing_return_v1',JSON.stringify({at:new Date().toISOString(),plano,forma}))}catch(_){ }
                if(typeof toast==='function')toast(forma==='pix'?'Abrindo pagamento por Pix...':forma==='boleto'?'Abrindo pagamento por boleto...':'Abrindo pagamento por cartão...');
                location.assign(String(data.checkout_url));
              }catch(e){console.error('EDIFIQ checkout 47',e);if(typeof toast==='function')toast(String(e?.message||'Não foi possível iniciar o pagamento.'));buttons.forEach(b=>b.disabled=false);window.__edifiqBillingBusy=false}
            }
            window.edifiqEscolherPagamento47=function(plano){
              plano=String(plano||'').toLowerCase();if(!['mensal','anual'].includes(plano)){if(typeof toast==='function')toast('Plano inválido.');return}
              ed47Close();const m=document.createElement('div');m.id='edPaymentMethod47';m.className='modal open';
              m.innerHTML=`<div class="modalBox" style="max-width:520px"><div class="modalHead"><div><h2>Forma de pagamento</h2><p class="sub">Escolha como pagar o plano ${ed47Esc(plano==='anual'?'Anual':'Mensal')}.</p></div><button class="x" type="button" onclick="document.getElementById('edPaymentMethod47')?.remove()">×</button></div><div class="edPayMethods47"><button class="edPayMethod47" type="button" onclick="edifiqPagar47('${ed47Esc(plano)}','cartao')"><span>💳</span><span><strong>Cartão de crédito</strong><small>Assinatura com renovação automática.</small></span></button><button class="edPayMethod47" type="button" onclick="edifiqPagar47('${ed47Esc(plano)}','pix')"><span>⚡</span><span><strong>Pix</strong><small>Pagamento do período atual; renove no próximo vencimento.</small></span></button><button class="edPayMethod47" type="button" onclick="edifiqPagar47('${ed47Esc(plano)}','boleto')"><span>🧾</span><span><strong>Boleto</strong><small>Pagamento do período atual; liberação após confirmação.</small></span></button></div></div>`;
              document.body.appendChild(m);
            };
            window.edifiqPagar47=ed47Start;
            window.assinarPlanoEdifiq11=function(codigo){window.edifiqEscolherPagamento47(codigo)};
          })();
          </script>
          '''
          if 'id="edifiqCheckoutMethods47Script"' not in html:
              body_pos = html.lower().rfind('</body>')
              if body_pos < 0:
                  raise SystemExit('Fechamento </body> não encontrado.')
              html = html[:body_pos] + checkout_patch + '\n' + html[body_pos:]

          page.write_text(html,encoding='utf-8')
          PY
          python3 scripts/check-release.py --html .pages/index.html
          touch .pages/.nojekyll
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          data = Path('.pages/index.html').read_bytes()
          public_files = ['index.html','edifiq-sw.js','manifest.webmanifest','edifiq-icon-192.png','edific-icon.svg','privacidade.html','exclusao-conta.html']
          hashes = {name: hashlib.sha256(Path('.pages',name).read_bytes()).hexdigest() for name in public_files}
          Path('.pages/release.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA'],'sha256': hashlib.sha256(data).hexdigest(),'validated': True,'public_files': hashes,'pwa_label': 'Edific','cache': 'edifiq-shell-v47-checkout-metodos'}, ensure_ascii=False))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    name: Publicar versão estável
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirmar publicação protegida e versão atual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$mode" != workflow ]; then
            echo '::error::Ative Settings > Pages > Source > GitHub Actions. A publicação direta da branch ignora a validação.'
            exit 1
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo '::error::Existe uma alteração mais recente. Esta execução antiga não será publicada.'
            exit 1
          fi
      - name: Publicar após todas as verificações
        id: deployment
        uses: actions/deploy-pages@v4
