name: Publicar EDIFIQ validado

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edific-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validar versão e fluxos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Impedir perda das correções aprovadas
        run: python3 scripts/check-release.py
      - name: Preparar arquivos públicos do aplicativo
        run: |
          mkdir -p .pages
          cp index.html .pages/index.html
          for f in edifiq-sw.js manifest.webmanifest edifiq-icon-192.png edific-icon.svg privacidade.html exclusao-conta.html; do
            test -f "$f" || { echo "::error::Arquivo público obrigatório ausente: $f"; exit 1; }
            cp "$f" ".pages/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path('.pages/index.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace('<meta content="EDIFIQ" name="apple-mobile-web-app-title"/>','<meta content="Edific" name="apple-mobile-web-app-title"/>',1)
          html = html.replace('<meta name="application-name" content="EDIFIQ"/>','<meta name="application-name" content="Edific"/>',1)
          html = html.replace('var APP_NAME="EDIFIQ", SHORT_NAME="EDIFIQ", installEvent=null;','var APP_NAME="Edific", SHORT_NAME="Edific", installEvent=null;',1)
          html = html.replace('Instalar o EDIFIQ','Instalar o Edific').replace('instalar o EDIFIQ','instalar o Edific')
          html = re.sub(r'(<link[^>]+rel="apple-touch-icon"[^>]+href=")[^"]+("[^>]*>)', r'\1./edifiq-icon-192.png\2', html, count=1, flags=re.I)
          page.write_text(html,encoding='utf-8')
          PY
          touch .pages/.nojekyll
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          data = Path('.pages/index.html').read_bytes()
          public_files = [
              'index.html','edifiq-sw.js','manifest.webmanifest',
              'edifiq-icon-192.png','edific-icon.svg',
              'privacidade.html','exclusao-conta.html'
          ]
          hashes = {name: hashlib.sha256(Path('.pages',name).read_bytes()).hexdigest() for name in public_files}
          Path('.pages/release.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'sha256': hashlib.sha256(data).hexdigest(),
              'validated': True,
              'public_files': hashes,
              'pwa_label': 'Edific',
              'cache': 'edifiq-shell-v45-perfil'
          }, ensure_ascii=False))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    name: Publicar versão estável
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirmar publicação protegida e versão atual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$mode" != workflow ]; then
            echo '::error::Ative Settings > Pages > Source > GitHub Actions. A publicação direta da branch ignora a validação.'
            exit 1
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo '::error::Existe uma alteração mais recente. Esta execução antiga não será publicada.'
            exit 1
          fi
      - name: Publicar após todas as verificações
        id: deployment
        uses: actions/deploy-pages@v4
