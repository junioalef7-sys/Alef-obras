name: Apply light mode contrast fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply contrast fix
        shell: bash
        env:
          CSS_B64: ""
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, base64
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'edifiq-light-contrast-final-v4'
          if marker not in text:
              css = base64.b64decode(os.environ['CSS_B64']).decode('utf-8')
              pos = text.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('closing body tag not found')
              p.write_text(text[:pos] + css + '\n' + text[pos:], encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: aumentar contraste do modo claro em todo o app"
          git push
