name: OBRIX sincronizacao de registros consecutivos
on:
  push:
    branches:
      - test/obrix-sync-segundo-registro-20261114
    paths:
      - 'obrix-sync-geral-leve-20261108.js'
      - 'obrix.html'
      - 'obrix-android-inicial/obrix.html'
      - 'tests/obrix-sync-registros-consecutivos.cjs'
      - '.github/workflows/obrix-sync-registros-consecutivos.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020e8
        with:
          node-version: '22'
      - name: Testar codigo e varios registros consecutivos
        run: |
          node --check obrix-sync-geral-leve-20261108.js
          node --test tests/obrix-sync-registros-consecutivos.cjs
