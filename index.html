<script>
/* =========================================================
   EDIFIQ — CHECKLIST COM PROGRESSO POR SERVIÇO
   VERSÃO ESTÁVEL
   ========================================================= */

let checklistEditId = "";
let checklistEditTarefa = "";


/* =========================================================
   LOCALIZA CHECKLIST
   ========================================================= */

function checklistForOba(obraId){

  if(
    typeof D === "undefined" ||
    !D ||
    !Array.isArray(D.checklist)
  ){
    return [];
  }

  return D.checklist
    .filter(x =>
      String(x.obra_id) === String(obraId)
    )
    .sort((a,b) =>
      Number(a.ordem ?? 999999) -
      Number(b.ordem ?? 999999)
    );
}


function checklistForObra(obraId){
  return checklistForOba(obraId);
}


/* =========================================================
   PERCENTUAL
   ========================================================= */

function checklistPercent(item){

  if(!item) return 0;

  if(
    item.concluida === true ||
    item.concluida === "true" ||
    item.concluida === 1 ||
    item.concluida === "1"
  ){
    return 100;
  }

  let p = Number(item.progresso);

  if(!Number.isFinite(p)){
    p = 0;
  }

  return Math.max(
    0,
    Math.min(100, Math.round(p))
  );
}


/* =========================================================
   PROGRESSO GERAL DA OBRA
   ========================================================= */

function progressForObra(o){

  if(!o) return 0;

  const lista =
    checklistForObra(o.id);

  if(!lista.length){

    const antigo =
      Number(o.progresso);

    return Number.isFinite(antigo)
      ? Math.max(
          0,
          Math.min(
            100,
            Math.round(antigo)
          )
        )
      : 0;
  }

  const soma =
    lista.reduce(
      (total,item) =>
        total + checklistPercent(item),
      0
    );

  return Math.round(
    soma / lista.length
  );
}


/* =========================================================
   CRIA CHECKLIST PADRÃO
   ========================================================= */

async function ensureChecklist(obraId){

  if(!obraId) return;

  if(
    typeof D === "undefined" ||
    !D
  ){
    return;
  }

  if(!Array.isArray(D.checklist)){
    D.checklist = [];
  }

  const existente =
    checklistForObra(obraId);

  if(existente.length){
    return;
  }

  const padrao = [
    "Gabarito",
    "Locação",
    "Alvenaria",
    "Chapisco",
    "Reboco",
    "Pintura",
    "Limpeza",
    "Final da obra"
  ];

  for(
    let i = 0;
    i < padrao.length;
    i++
  ){

    try{

      let novo = null;

      if(
        typeof insertRow === "function"
      ){

        novo =
          await insertRow(
            "checklist",
            {
              obra_id: obraId,
              tarefa: padrao[i],
              concluida: false,
              progresso: 0,
              ordem: i
            }
          );

      }

      /*
       * Mesmo se o banco não retornar o registro,
       * cria uma cópia local para o aplicativo
       * continuar funcionando.
       */

      if(!novo){

        novo = {
          id:
            "local-check-" +
            Date.now() +
            "-" +
            i,

          obra_id: obraId,

          tarefa: padrao[i],

          concluida: false,

          progresso: 0,

          ordem: i
        };

      }

      const existeLocal =
        D.checklist.some(
          x =>
            String(x.id) ===
            String(novo.id)
        );

      if(!existeLocal){

        D.checklist.push(novo);

      }

    }catch(e){

      console.warn(
        "Falha ao criar etapa:",
        padrao[i],
        e
      );

      /*
       * Fallback local
       */

      D.checklist.push({
        id:
          "local-check-" +
          Date.now() +
          "-" +
          i,

        obra_id: obraId,

        tarefa: padrao[i],

        concluida: false,

        progresso: 0,

        ordem: i
      });

    }

  }

  /*
   * Tenta salvar localmente
   */

  try{

    if(
      typeof saveLocal === "function"
    ){

      saveLocal("checklist");

    }

  }catch(e){

    console.warn(
      "Erro no salvamento local:",
      e
    );

  }

}


/* =========================================================
   COMPATIBILIDADE
   ========================================================= */

async function criarChecklistPadraoDaObra(obraId){

  return ensureChecklist(obraId);

}


/* =========================================================
   ABRIR CHECKLIST
   ========================================================= */

async function openChecklist(obraId){

  const o =
    typeof obra === "function"
      ? obra(obraId)
      : null;

  if(!o){

    if(typeof toast === "function"){
      toast("Obra não encontrada.");
    }

    return;
  }

  checklistEditId = "";
  checklistEditTarefa = "";

  /*
   * Abre o modal
   */

  if(typeof openM === "function"){

    openM("checkM");

  }

  /*
   * Cria o campo hidden se o modal
   * ainda não possuir.
   */

  let campoObra =
    $("checkObra");

  if(!campoObra){

    const modal =
      $("checkListModal");

    if(modal){

      const hidden =
        document.createElement("input");

      hidden.type = "hidden";

      hidden.id = "checkObra";

      hidden.value = obraId;

      modal.prepend(hidden);

      campoObra = hidden;

    }

  }

  if(campoObra){

    campoObra.value = obraId;

  }

  /*
   * Cria checklist padrão.
   */

  if(
    !checklistForObra(obraId).length
  ){

    const modal =
      $("checkListModal");

    if(modal){

      modal.innerHTML = `
        <input
          type="hidden"
          id="checkObra"
          value="${esc(String(obraId))}"
        >

        <div class="empty">
          Criando checklist da obra...
        </div>
      `;

    }

    await ensureChecklist(obraId);

  }

  renderChecklistModal(obraId);

}


/* =========================================================
   RENDERIZA
   ========================================================= */

function renderChecklistModal(obraId){

  const o =
    typeof obra === "function"
      ? obra(obraId)
      : null;

  if(!o) return;

  const lista =
    checklistForObra(obraId);

  const progressoGeral =
    progressForObra(o);

  /*
   * Atualiza progresso local
   */

  o.progresso =
    progressoGeral;


  let html = `

    <input
      type="hidden"
      id="checkObra"
      value="${esc(String(obraId))}"
    >

    <div class="card">

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
      ">

        <div>

          <strong>
            Progresso geral da obra
          </strong>

          <div
            class="muted small"
            style="margin-top:4px"
          >
            Calculado automaticamente pelas
            etapas da obra.
          </div>

        </div>

        <strong
          class="goldText"
          style="font-size:22px"
        >
          ${progressoGeral}%
        </strong>

      </div>


      <div
        class="progress"
        style="
          margin-top:12px;
          height:14px;
        "
      >

        <i
          style="
            width:${progressoGeral}%;
          "
        ></i>

      </div>

    </div>


    <div class="card">

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:12px;
      ">

        <strong>
          Etapas da obra
        </strong>

        <span class="badge">
          ${lista.length}
          ${lista.length === 1
            ? "etapa"
            : "etapas"}
        </span>

      </div>

  `;


  if(!lista.length){

    html += `
      <div class="empty">
        Nenhuma etapa cadastrada.
      </div>
    `;

  }else{

    html += lista.map(item=>{

      const p =
        checklistPercent(item);

      const concluida =
        p >= 100;

      return `

        <div
          class="checkItemBox"
          data-check-id="${esc(String(item.id))}"
        >

          <div style="
            display:flex;
            align-items:center;
            gap:9px;
          ">

            <input
              type="checkbox"
              ${concluida ? "checked" : ""}
              onchange="
                toggleCheck('${String(item.id)}')
              "
              style="
                width:20px;
                height:20px;
                flex:0 0 auto;
              "
            >

            <div style="
              flex:1;
              min-width:0;
            ">

              <div
                style="
                  font-weight:700;
                  font-size:14px;
                  ${
                    concluida
                    ? "text-decoration:line-through;color:#69717d;"
                    : ""
                  }
                "
              >
                ${esc(item.tarefa || "Sem nome")}
              </div>

              <div
                class="muted small"
                style="margin-top:3px"
              >
                Progresso deste serviço:
              </div>

            </div>

            <strong
              id="pct-${esc(String(item.id))}"
              class="goldText"
              style="
                min-width:48px;
                text-align:right;
                font-size:16px;
              "
            >
              ${p}%
            </strong>

          </div>


          <div
            class="checkItemProgress"
            style="
              margin-top:9px;
              margin-left:29px;
            "
          >

            <i
              id="bar-${esc(String(item.id))}"
              style="width:${p}%"
            ></i>

          </div>


          <div style="
            margin:9px 0 0 29px;
          ">

            <input
              type="range"
              min="0"
              max="100"
              step="1"
              value="${p}"
              class="range"
              oninput="
                previewCheckProgress(
                  this,
                  '${String(item.id)}'
                )
              "
              onchange="
                updateCheckProgress(
                  '${String(item.id)}',
                  this.value
                )
              "
            >

          </div>


          <div style="
            margin:8px 0 0 29px;
            display:flex;
            flex-wrap:wrap;
            gap:6px;
          ">

            <button
              type="button"
              class="btn sm"
              onclick="
                updateCheckProgress(
                  '${String(item.id)}',
                  0
                )
              "
            >
              0%
            </button>

            <button
              type="button"
              class="btn sm"
              onclick="
                updateCheckProgress(
                  '${String(item.id)}',
                  25
                )
              "
            >
              25%
            </button>

            <button
              type="button"
              class="btn sm"
              onclick="
                updateCheckProgress(
                  '${String(item.id)}',
                  50
                )
              "
            >
              50%
            </button>

            <button
              type="button"
              class="btn sm"
              onclick="
                updateCheckProgress(
                  '${String(item.id)}',
                  75
                )
              "
            >
              75%
            </button>

            <button
              type="button"
              class="btn sm green"
              onclick="
                updateCheckProgress(
                  '${String(item.id)}',
                  100
                )
              "
            >
              100%
            </button>

          </div>


          <div style="
            margin:9px 0 0 29px;
            display:flex;
            gap:7px;
          ">

            <button
              type="button"
              class="btn sm"
              onclick="
                editCheck('${String(item.id)}')
              "
            >
              Editar
            </button>

            <button
              type="button"
              class="btn sm red"
              onclick="
                deleteCheck('${String(item.id)}')
              "
            >
              Excluir
            </button>

          </div>

        </div>

      `;

    }).join("");

  }


  html += `

    </div>


    <div class="card">

      <h3>
        ${
          checklistEditId
            ? "Editar etapa"
            : "Adicionar nova etapa"
        }
      </h3>

      <div class="field">

        <label>
          Nome do serviço / etapa
        </label>

        <input
          id="checkTarefa"
          placeholder="Ex.: Instalação elétrica"
          value="${esc(checklistEditTarefa || "")}"
        >

      </div>

      <div style="
        display:flex;
        gap:8px;
        flex-wrap:wrap;
      ">

        <button
          type="button"
          class="btn gold"
          onclick="saveCheck()"
        >
          ${
            checklistEditId
              ? "SALVAR ALTERAÇÃO"
              : "+ ADICIONAR ITEM"
          }
        </button>

        <button
          type="button"
          class="btn"
          onclick="
            checklistEditId='';
            checklistEditTarefa='';
            renderChecklistModal('${String(obraId)}');
          "
        >
          Limpar
        </button>

      </div>

    </div>

  `;


  const modal =
    $("checkListModal");

  if(modal){

    modal.innerHTML =
      html;

  }

}


/* =========================================================
   PREVIEW
   ========================================================= */

function previewCheckProgress(el,id){

  if(!el) return;

  let valor =
    Number(el.value);

  if(!Number.isFinite(valor)){
    valor = 0;
  }

  valor =
    Math.max(
      0,
      Math.min(
        100,
        Math.round(valor)
      )
    );

  const pct =
    document.getElementById(
      "pct-" + id
    );

  const bar =
    document.getElementById(
      "bar-" + id
    );

  if(pct){
    pct.textContent =
      valor + "%";
  }

  if(bar){
    bar.style.width =
      valor + "%";
  }

}


/* =========================================================
   SALVAR PROGRESSO
   ========================================================= */

async function updateCheckProgress(id,value){

  if(
    typeof D === "undefined" ||
    !D ||
    !Array.isArray(D.checklist)
  ){
    return;
  }

  const item =
    D.checklist.find(
      x =>
        String(x.id) ===
        String(id)
    );

  if(!item){

    if(typeof toast === "function"){
      toast(
        "Serviço do checklist não encontrado."
      );
    }

    return;
  }


  let percentual =
    Number(value);

  if(!Number.isFinite(percentual)){
    percentual = 0;
  }

  percentual =
    Math.max(
      0,
      Math.min(
        100,
        Math.round(percentual)
      )
    );


  const concluida =
    percentual >= 100;


  /*
   * ======================================================
   * PRIMEIRO ATUALIZA LOCALMENTE
   * ======================================================
   *
   * Isso evita que erro do Supabase trave o botão.
   */

  item.progresso =
    percentual;

  item.concluida =
    concluida;


  const o =
    typeof obra === "function"
      ? obra(item.obra_id)
      : null;


  if(o){

    const geral =
      progressForObra(o);

    o.progresso =
      geral;

  }


  /*
   * SALVA LOCAL
   */

  try{

    if(
      typeof saveLocal === "function"
    ){

      saveLocal("checklist");

      if(o){
        saveLocal("obras");
      }

    }

  }catch(e){

    console.warn(
      "Erro salvando local:",
      e
    );

  }


  /*
   * ATUALIZA A TELA IMEDIATAMENTE
   */

  renderChecklistModal(
    item.obra_id
  );


  if(
    typeof renderObras === "function"
  ){

    try{
      renderObras();
    }catch(e){
      console.warn(e);
    }

  }


  if(
    typeof renderDashboard === "function"
  ){

    try{
      renderDashboard();
    }catch(e){
      console.warn(e);
    }

  }


  /*
   * ======================================================
   * DEPOIS TENTA SINCRONIZAR SUPABASE
   * ======================================================
   */

  try{

    if(
      typeof updateRow === "function" &&
      String(id).indexOf("local-check-") !== 0
    ){

      await updateRow(
        "checklist",
        id,
        {
          progresso: percentual,
          concluida: concluida
        }
      );

    }


    if(o){

      if(
        typeof updateRow === "function" &&
        String(o.id).indexOf("local-") !== 0
      ){

        await updateRow(
          "obras",
          o.id,
          {
            progresso: o.progresso
          }
        );

      }

    }

  }catch(e){

    console.warn(
      "Sincronização pendente:",
      e
    );

    /*
     * Não mostra erro bloqueante.
     * O dado já foi salvo localmente.
     */

  }

}


/* =========================================================
   TOGGLE
   ========================================================= */

async function toggleCheck(id){

  if(
    typeof D === "undefined" ||
    !D ||
    !Array.isArray(D.checklist)
  ){
    return;
  }

  const item =
    D.checklist.find(
      x =>
        String(x.id) ===
        String(id)
    );

  if(!item) return;

  const atual =
    checklistPercent(item);

  const novo =
    atual >= 100
      ? 0
      : 100;

  await updateCheckProgress(
    id,
    novo
  );

}


/* =========================================================
   ADICIONAR / EDITAR
   ========================================================= */

async function saveCheck(){

  const campoObra =
    $("checkObra");

  const obraId =
    campoObra
      ? campoObra.value
      : "";


  const campoTarefa =
    $("checkTarefa");

  const tarefa =
    campoTarefa
      ? campoTarefa.value.trim()
      : checklistEditTarefa.trim();


  if(!obraId){

    if(typeof toast === "function"){
      toast("Obra não encontrada.");
    }

    return;
  }


  if(!tarefa){

    if(typeof toast === "function"){
      toast("Digite o nome do serviço.");
    }

    if(campoTarefa){
      campoTarefa.focus();
    }

    return;
  }


  try{

    /*
     * ====================================================
     * EDITAR
     * ====================================================
     */

    if(checklistEditId){

      const item =
        D.checklist.find(
          x =>
            String(x.id) ===
            String(checklistEditId)
        );


      if(item){

        /*
         * Atualiza local primeiro
         */

        item.tarefa =
          tarefa;

        try{

          if(
            typeof saveLocal === "function"
          ){

            saveLocal("checklist");

          }

        }catch(e){
          console.warn(e);
        }


        /*
         * Tenta banco
         */

        try{

          if(
            typeof updateRow === "function" &&
            String(item.id).indexOf("local-check-") !== 0
          ){

            await updateRow(
              "checklist",
              item.id,
              {
                tarefa: tarefa
              }
            );

          }

        }catch(e){

          console.warn(
            "Sincronização da edição pendente:",
            e
          );

        }

      }


      if(typeof toast === "function"){
        toast(
          "Item do checklist alterado."
        );
      }


    }else{

      /*
       * ==================================================
       * NOVO ITEM
       * ==================================================
       */

      const lista =
        checklistForObra(
          obraId
        );

      const ordem =
        lista.length;


      let novo = null;


      /*
       * Tenta inserir no banco
       */

      try{

        if(
          typeof insertRow === "function"
        ){

          novo =
            await insertRow(
              "checklist",
              {
                obra_id: obraId,
                tarefa: tarefa,
                concluida: false,
                progresso: 0,
                ordem: ordem
              }
            );

        }

      }catch(e){

        console.warn(
          "Banco indisponível. Salvando local:",
          e
        );

      }


      /*
       * Fallback local
       */

      if(!novo){

        novo = {

          id:
            "local-check-" +
            Date.now(),

          obra_id:
            obraId,

          tarefa:
            tarefa,

          concluida:
            false,

          progresso:
            0,

          ordem:
            ordem

        };

      }


      const existe =
        D.checklist.some(
          x =>
            String(x.id) ===
            String(novo.id)
        );


      if(!existe){

        D.checklist.push(
          novo
        );

      }


      try{

        if(
          typeof saveLocal === "function"
        ){

          saveLocal("checklist");

        }

      }catch(e){

        console.warn(e);

      }


      if(typeof toast === "function"){
        toast(
          "Novo item adicionado ao checklist."
        );
      }

    }


    checklistEditId = "";
    checklistEditTarefa = "";


    renderChecklistModal(
      obraId
    );


    if(
      typeof renderObras === "function"
    ){

      try{
        renderObras();
      }catch(e){
        console.warn(e);
      }

    }


    if(
      typeof renderDashboard === "function"
    ){

      try{
        renderDashboard();
      }catch(e){
        console.warn(e);
      }

    }


  }catch(e){

    console.error(
      "Erro no checklist:",
      e
    );

    if(typeof toast === "function"){

      toast(
        "Erro ao salvar item: " +
        (
          e?.message ||
          e
        )
      );

    }

  }

}


/* =========================================================
   EDITAR
   ========================================================= */

function editCheck(id){

  if(
    typeof D === "undefined" ||
    !D ||
    !Array.isArray(D.checklist)
  ){
    return;
  }

  const item =
    D.checklist.find(
      x =>
        String(x.id) ===
        String(id)
    );

  if(!item) return;


  checklistEditId =
    item.id;

  checklistEditTarefa =
    item.tarefa || "";


  renderChecklistModal(
    item.obra_id
  );


  setTimeout(()=>{

    const campo =
      $("checkTarefa");

    if(campo){

      campo.focus();

      campo.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    }

  },50);

}


/* =========================================================
   EXCLUIR
   ========================================================= */

async function deleteCheck(id){

  if(
    typeof D === "undefined" ||
    !D ||
    !Array.isArray(D.checklist)
  ){
    return;
  }

  const item =
    D.checklist.find(
      x =>
        String(x.id) ===
        String(id)
    );

  if(!item) return;


  if(
    !confirm(
      "Excluir este serviço do checklist?"
    )
  ){

    return;

  }


  const obraId =
    item.obra_id;


  /*
   * Remove local primeiro
   */

  D.checklist =
    D.checklist.filter(
      x =>
        String(x.id) !==
        String(id)
    );


  /*
   * Salva local
   */

  try{

    if(
      typeof saveLocal === "function"
    ){

      saveLocal("checklist");

    }

  }catch(e){

    console.warn(e);

  }


  /*
   * Recalcula obra
   */

  const o =
    typeof obra === "function"
      ? obra(obraId)
      : null;


  if(o){

    /*
     * Se ainda existem etapas,
     * calcula a média.
     *
     * Se todas forem excluídas,
     * o progresso volta para 0.
     */

    const restantes =
      checklistForObra(
        obraId
      );

    const geral =
      restantes.length
        ? progressForObra(o)
        : 0;

    o.progresso =
      geral;


    try{

      if(
        typeof saveLocal === "function"
      ){

        saveLocal("obras");

      }

    }catch(e){

      console.warn(e);

    }


    /*
     * Sincronização
     */

    try{

      if(
        typeof removeRow === "function" &&
        String(id).indexOf("local-check-") !== 0
      ){

        await removeRow(
          "checklist",
          id
        );

      }

      if(
        typeof updateRow === "function" &&
        String(o.id).indexOf("local-") !== 0
      ){

        await updateRow(
          "obras",
          o.id,
          {
            progresso: geral
          }
        );

      }

    }catch(e){

      console.warn(
        "Sincronização da exclusão pendente:",
        e
      );

    }

  }


  if(typeof toast === "function"){
    toast("Item excluído.");
  }


  renderChecklistModal(
    obraId
  );


  if(
    typeof renderObras === "function"
  ){

    try{
      renderObras();
    }catch(e){
      console.warn(e);
    }

  }


  if(
    typeof renderDashboard === "function"
  ){

    try{
      renderDashboard();
    }catch(e){
      console.warn(e);
    }

  }

}

/* =========================================================
   DISPONIBILIZA FUNÇÕES
   ========================================================= */

Object.assign(
  window,
  {

    openChecklist,
    renderChecklistModal,
    previewCheckProgress,
    updateCheckProgress,
    toggleCheck,
    saveCheck,
    editCheck,
    deleteCheck,
    ensureChecklist,

  }
);
