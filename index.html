const PHOTO_DB="EDIFIQ_FOTOS_DB";
const PHOTO_STORE="fotos";
const PHOTO_DB_VERSION=1;

function openPhotoDB(){

return new Promise((resolve,reject)=>{

const request=indexedDB.open(
PHOTO_DB,
PHOTO_DB_VERSION
);

request.onupgradeneeded=e=>{

const db=e.target.result;

if(!db.objectStoreNames.contains(PHOTO_STORE)){

const store=db.createObjectStore(
PHOTO_STORE,
{keyPath:"id"}
);

store.createIndex(
"obra_id",
"obra_id",
{unique:false}
);

store.createIndex(
"data",
"data",
{unique:false}
);

}

};

request.onsuccess=()=>{
resolve(request.result);
};

request.onerror=()=>{
reject(request.error);
};

});

}

async function savePhotoDB(foto){

const db=await openPhotoDB();

return new Promise((resolve,reject)=>{

const tx=db.transaction(
PHOTO_STORE,
"readwrite"
);

tx.objectStore(PHOTO_STORE)
.put(foto);

tx.oncomplete=()=>{
db.close();
resolve(foto);
};

tx.onerror=()=>{
db.close();
reject(tx.error);
};

});

}

async function getAllPhotosDB(){

const db=await openPhotoDB();

return new Promise((resolve,reject)=>{

const tx=db.transaction(
PHOTO_STORE,
"readonly"
);

const request=
tx.objectStore(PHOTO_STORE).getAll();

request.onsuccess=()=>{

const data=request.result||[];

data.sort((a,b)=>
String(b.created_at||"")
.localeCompare(
String(a.created_at||"")
)
);

db.close();

resolve(data);

};

request.onerror=()=>{

db.close();

reject(request.error);

};

});

}

function normalize(v){

return String(v||"")
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.trim();

}

function gastoCategoria(g){

if(g?.categoria){

const c=normalize(
g.categoria
);

if(c.includes("material"))
return "Material";

if(c.includes("mao"))
return "Mão de obra";

if(c.includes("terceir"))
return "Serviço terceirizado";

if(c.includes("adiant"))
return "Adiantamento";

if(c.includes("outro"))
return "Outros";

}

const desc=normalize(
g?.descricao
);

if(
desc.includes("[material]")||
desc.includes("material")
){
return "Material";
}

if(
desc.includes("[mao de obra]")||
desc.includes("pagamento de equipe")||
desc.includes("pagamento de diaria")||
desc.includes("pagamento de diária")
){
return "Mão de obra";
}

if(
desc.includes("[servico terceirizado]")||
desc.includes("servico terceirizado")
){
return "Serviço terceirizado";
}

if(
desc.includes("[adiantamento]")||
desc.includes("adiantamento")
){
return "Adiantamento";
}

return "Outros";

}

function categoriaFinanceira(g){

const c=gastoCategoria(g);

return c==="Adiantamento"
?"Mão de obra"
:c;

}

function diariaValor(d){

return Number(
d.qtd ??
d.quantidade ??
1
)*Number(
d.valor_diaria||0
);

}

function getPendingDiarias(funcId){

return D.diarias.filter(d=>
String(d.funcionario_id)===
String(funcId)&&
String(
d.status||"pendente"
).toLowerCase()!=="pago"
);

}

function getPendingTotal(funcId){

return getPendingDiarias(funcId)
.reduce(
(a,d)=>a+diariaValor(d),
0
);

}

function getEmployeeAdvances(funcId){

const f=D.funcionarios.find(
x=>String(x.id)===
String(funcId)
);

if(!f)return[];

const nome=normalize(f.nome);

const applied=getAdvanceApplied();

return D.gastos
.filter(g=>{

if(
gastoCategoria(g)!=="Adiantamento"
){
return false;
}

const fornecedor=
normalize(g.fornecedor);

const descricao=
normalize(g.descricao);

return fornecedor===nome||
descricao.includes(nome);

})
.map(g=>{

const valor=Number(g.valor||0);

const usado=
Number(applied[g.id]||0);

const disponivel=
Math.max(
0,
valor-usado
);

return{
...g,
valorOriginal:valor,
aplicado:usado,
disponivel
};

})
.filter(g=>g.disponivel>0)
.sort((a,b)=>
String(a.data||"")
.localeCompare(
String(b.data||"")
)
);

}

function calcFuncionarioPagamento(funcId){

const pending=
getPendingTotal(funcId);

const advances=
getEmployeeAdvances(funcId);

let restante=pending;
let abatido=0;

const allocations=[];

for(const adv of advances){

if(restante<=0)break;

const usar=Math.min(
restante,
Number(adv.disponivel||0)
);

if(usar>0){

allocations.push({
id:adv.id,
valor:usar
});

abatido+=usar;
restante-=usar;

}

}

return{
pending,
advance:abatido,
net:Math.max(0,restante),
allocations,
advances
};

}

funcId,
allocations

getAdvanceApplied();

data[a.id]=
Number(data[a.id]||0)+
Number(a.valor||0);

});

saveAdvanceApplied(data);

}

async function insertRow(
table,
row
){

if(!user){

toast(
"Faça login primeiro."
);

return null;

}

const payload={
...row,
user_id:user.id
};

const attempts=[
payload
];

if(table==="gastos"){

attempts.push(
Object.fromEntries(
Object.entries(payload)
.filter(
([k])=>k!=="categoria"
)
)
);

}

if(table==="pagamentos"){

attempts.push(
Object.fromEntries(
Object.entries(payload)
.filter(
([k])=>k!=="forma_pagamento"
)
)
);

}

if(table==="funcionarios"){

attempts.push(
Object.fromEntries(
Object.entries(payload)
.filter(
([k])=>k!=="registrar_diaria"
)
)
);

}

for(const tentativa of attempts){

try{

const{data,error}=
await sb
.from(table)
.insert(tentativa)
.select()
.single();

if(!error&&data){

D[table].unshift(data);

saveLocalData();

renderAll();

return data;

}

console.warn(
"Supabase recusou",
table,
error?.message
);

}catch(e){

console.warn(
"Erro Supabase",
table,
e
);

}

}

const localRow={
...row,
id:
"local_"+Date.now()+"_"+
Math.random()
.toString(36)
.slice(2),
user_id:user.id,
created_at:
new Date().toISOString()
};

D[table].unshift(localRow);

saveLocalData();

renderAll();

toast(
"Salvo neste aparelho. O servidor recusou a gravação."
);

return localRow;

}

async function updateRow(
table,
id,
row
){

if(String(id).startsWith("local_")){

const i=D[table].findIndex(
x=>String(x.id)===
String(id)
);

if(i>=0){

D[table][i]={
...D[table][i],
...row
};

saveLocalData();

renderAll();

toast("Atualizado.");

return D[table][i];

}

return null;

}

try{

const{data,error}=
await sb
.from(table)
.update(row)
.eq("id",id)
.select()
.single();

if(!error&&data){

const i=D[table].findIndex(
x=>String(x.id)===
String(id)
);

if(i>=0)
D[table][i]=data;

saveLocalData();

renderAll();

return data;

}

console.warn(
"Erro atualização",
error?.message
);

}catch(e){

console.warn(e);

}

toast(
"Não foi possível atualizar no servidor."
);

return null;

}

async function removeRow(
table,
id
){

if(!confirm(
"Deseja realmente excluir?"
))

if(String(id).startsWith("local_")){

D[table]=D[table].filter(
x=>String(x.id)!==
String(id)

}

toast(

}catch(e){

}

}

itens.filter(x=>

x.concluido===true||
x.status==="concluido"

);

function obraFinanceData(obraId){

const obra=D.obras.find(
o=>String(o.id)===
String(obraId)
);

const contrato=
Number(obra?.valor||0);

const receita=
D.pagamentos
.filter(x=>
String(x.obra_id)===
String(obraId)
)
.reduce(
(a,x)=>a+Number(x.valor||0),
0
);

const gastos=
D.gastos.filter(
x=>String(x.obra_id)===
String(obraId)
);

const material=
gastos
.filter(
x=>categoriaFinanceira(x)==="Material"
)
.reduce(
(a,x)=>a+Number(x.valor||0),
0
);

const mao=
gastos
.filter(
x=>categoriaFinanceira(x)==="Mão de obra"
)
.reduce(
(a,x)=>a+Number(x.valor||0),
0
);

const terceirizado=
gastos
.filter(
x=>categoriaFinanceira(x)==="Serviço terceirizado"
)
.reduce(
(a,x)=>a+Number(x.valor||0),
0
);

const outros=
gastos
.filter(
x=>categoriaFinanceira(x)==="Outros"
)
.reduce(
(a,x)=>a+Number(x.valor||0),
0
);

const despesas=
material+
mao+
terceirizado+
outros;

const resultado=
receita-despesas;

const saldoContrato=
contrato-despesas;

return{
contrato,
receita,
material,
mao,
terceirizado,
outros,
despesas,
resultado,
saldoContrato
};

}

function percentContrato(
valor,
contrato
){

if(!contrato)return 0;

return(
Number(valor||0)/
Number(contrato)*100
);

}

function pctText(
valor,
contrato
){

if(!contrato)return"—";

return percentContrato(
valor,
contrato
).toFixed(1)+"%";

}

function aplicarTipoDiaria(){

const tipo=$("dTipo")?.value;

if(!$("dQtd"))return;

if(
tipo==="manha"||
tipo==="tarde"
){

$("dQtd").value=.5;

$("diaValorInfo").textContent=
tipo==="manha"
?"Meia diária da manhã: será considerado 50% do valor da diária."
:"Meia diária da tarde: será considerado 50% do valor da diária.";

}else{

$("dQtd").value=1;

$("diaValorInfo").textContent=
"Diária completa: será considerado 100% do valor informado.";

}

}

function atualizarTipoDiaria(){
aplicarTipoDiaria();
}

$("dObs").value.trim();

tipo==="manha"

observacao=

:textoTipo;

funcionario_id,
obra_id,
data:
$("dData").value,
qtd,
valor_diaria:
valorBase,
status:
$("dStatus").value,
observacao

const result=
await insertRow(
"diarias",
row

if(result){

closeM("diaM");

`Diária registrada: ${money(valorReal)}`

function renderPayroll(){

const box=$("diaList");

if(!box)return;

const period=
$("payPeriod")?.value||
"semana";

const now=new Date();

let inicio=null;

if(period==="dia"){

inicio=new Date(
now.getFullYear(),
now.getMonth(),
now.getDate()
);

}

if(period==="semana"){

const day=now.getDay();

inicio=new Date(
now.getFullYear(),
now.getMonth(),
now.getDate()-
(day===0?6:day-1)
);

}

if(period==="quinzena"){

inicio=new Date(
now.getFullYear(),
now.getMonth(),
now.getDate()-14
);

}

if(period==="mes"){

inicio=new Date(
now.getFullYear(),
now.getMonth(),
1
);

}

const items=
D.diarias.filter(d=>{

if(!inicio)return true;

const dt=new Date(
`${d.data}T00:00:00`
);

return dt>=inicio;

});

const total=
items.reduce(
(a,d)=>a+diariaValor(d),
0
);

$("payTotal").textContent=
money(total);

$("payCount").textContent=
items.length;

if(!items.length){

box.innerHTML=
`<div class="empty">
Nenhuma diária no período.

box.innerHTML=
items.map(d=>{

const f=
D.funcionarios.find(
x=>String(x.id)===
String(d.funcionario_id)
);

D.obras.find(
x=>String(x.id)===
String(d.obra_id)
);

diariaValor(d);

return`

<div class="row">

f?.nome||
"Funcionário"

function updatePagTotal(){

let diarias=0;

).forEach(ch=>{

if(!ch.checked)return;

const id=ch.dataset.id;

calcFuncionarioPagamento(id);

total+=resumo.net;

diarias+=resumo.pending;

adiant+=resumo.advance;

});

$("pagTotal").textContent=
money(total);

$("pagDiariasTotal").textContent=
money(diarias);

$("pagAdiantTotal").textContent=
money(adiant);

money(total);

);

if(!f)return;

const obra=

document.querySelector(

);

check.checked=true;

async function savePagamentoEquipe(e){

e.preventDefault();

const obra_id=
$("pagObra").value;

if(!obra_id){

toast(
"Selecione a obra."
);

return;

}

const checks=[
...document.querySelectorAll(
".pag-check"
)
].filter(x=>x.checked);

if(!checks.length){

toast(
"Selecione pelo menos um funcionário."
);

return;

}

const data=$("pagData").value;

const descricao=
$("pagDescricao").value.trim()||
"Pagamento de equipe";

const obs=
$("pagObs").value.trim();

let total=0;
let diariasTotal=0;
let adiantTotal=0;
let quantidade=0;

const processados=[];

for(const check of checks){

const id=check.dataset.id;

const f=
D.funcionarios.find(
x=>String(x.id)===
String(id)
);

if(!f)continue;

const resumo=
calcFuncionarioPagamento(id);

const pendingItems=
getPendingDiarias(id);

if(resumo.pending<=0)
continue;

processados.push({
id,
f,
resumo,
pendingItems
});

total+=resumo.net;
diariasTotal+=
resumo.pending;
adiantTotal+=
resumo.advance;

quantidade++;

}

if(!processados.length){

toast(
"Nenhum funcionário selecionado possui diária pendente."
);

return;

}

for(const item of processados){

const nome=item.f.nome;

const resumo=item.resumo;

if(resumo.net>0){

const observacao=
`Diárias pendentes: ${money(
resumo.pending
)}. `+
`Adiantamento abatido: ${money(
resumo.advance
)}. `+
`Valor líquido: ${money(
resumo.net
)}.`+
(obs?` ${obs}`:"");

await insertRow(
"gastos",
{
obra_id,
data,
descricao:
`[Mão de obra] ${descricao} - ${nome}`,
valor:
resumo.net,
fornecedor:
nome,
observacao
}
);

}

}

for(const item of processados){

for(
const diaria of
item.pendingItems
){

await updateRow(
"diarias",
diaria.id,
{
status:"pago"
}
);

}

aplicarAdiantamentos(
item.id,
item.resumo.allocations
);

}

closeM("pagEquipeM");

toast(
`${quantidade} funcionário(s) processado(s). `+
`Diárias: ${money(
diariasTotal
)} · `+
`Adiantamentos: ${money(
adiantTotal
)} · `+
`Pagamento: ${money(
total
)}`
);

await loadCloud();

renderAll();

}

async function saveFoto(e){

e.preventDefault();

const obra_id=
$("fotoObra").value;

const files=
[...$("fotoFiles").files];

if(!obra_id){

toast(
"Selecione a obra."
);

return;

}

if(!files.length){

toast(
"Selecione pelo menos uma foto."
);

return;

}

const btn=
e.submitter||
document.querySelector(
"#fotoM button.primary"
);

if(btn){

btn.disabled=true;

btn.textContent=
"Salvando fotos...";
}

try{

const data=
$("fotoData").value;

const titulo=
$("fotoTitulo")
.value
.trim();

const observacao=
$("fotoObs")
.value
.trim();

let salvas=0;

for(const file of files){

if(!file.type.startsWith("image/")){

console.warn(
"Arquivo ignorado:",
file.name
);

continue;

}

const src=
await fileToDataURL(file);

const foto={

id:
"foto_"+Date.now()+"_"+
Math.random()
.toString(36)
.slice(2),

obra_id:String(obra_id),

data:data,

titulo:titulo,

observacao:observacao,

nome_arquivo:file.name,

tipo:file.type,

tamanho:file.size,

src:src,

created_at:
new Date().toISOString()

};

await savePhotoDB(foto);

salvas++;

}

if(!salvas){

throw new Error(
"Nenhuma imagem válida foi selecionada."
);

}

closeM("fotoM");

$("fotoFiles").value="";

await renderFotos();

toast(
salvas>1
?`${salvas} fotos salvas com sucesso.`
:"Foto salva com sucesso."
);

}catch(err){

console.error(
"Erro ao salvar fotos:",
err
);

toast(
"Não foi possível salvar as fotos. Tente novamente."
);

}finally{

if(btn){

btn.disabled=false;

btn.textContent=
"Salvar fotos";

}

}

}

async function renderFotos(){

const box=$("fotoList");

if(!box)return;

box.innerHTML=
`<div class="empty">
Carregando fotos...
</div>`;

try{

const fotos=
await getAllPhotosDB();

if(!fotos.length){

box.innerHTML=
`<div class="empty">
Nenhuma foto registrada.
</div>`;

return;

}

const grupos={};

fotos.forEach(f=>{

const key=String(
f.obra_id
);

if(!grupos[key])
grupos[key]=[];

grupos[key].push(f);

});

const ordemObras=[
...D.obras
];

const usados=new Set();

let html="";

for(const obra of ordemObras){

const lista=
grupos[String(obra.id)];

if(!lista?.length)
continue;

usados.add(
String(obra.id)
);

html+=renderGrupoFotos(
obra,
lista
);

}

for(const obraId of Object.keys(grupos)){

if(usados.has(obraId))
continue;

const lista=
grupos[obraId];

html+=renderGrupoFotos(
null,
lista
);

}

box.innerHTML=html;

}catch(err){

console.error(
"Erro carregando fotos:",
err
);

box.innerHTML=
`<div class="empty">
Não foi possível carregar as fotos.
</div>`;

}

}

function downloadFile(
content,
filename,
type
){

const blob=new Blob(
[content],
{type}
);

const url=
URL.createObjectURL(blob);

function exportExcel(){

if(!window.XLSX){

toast(
"Excel não carregado."
);

return;

}

const wb=
XLSX.utils.book_new();

Object.entries(D).forEach(
([nome,dados])=>{

const ws=
XLSX.utils.json_to_sheet(
dados||[]
);

XLSX.utils.book_append_sheet(
wb,
ws,
nome.substring(0,31)
);

}
);

XLSX.writeFile(
wb,
"EDIFIQ_relatorio.xlsx"
);

toast(
"Excel exportado."
);

}

async function importBackup(event){

const file=
event.target.files?.[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=async()=>{

try{

const backup=
JSON.parse(
reader.result
);

if(!backup.data){

toast(
"Backup inválido."
);

return;

}

if(!confirm(
"Importar este backup? Os registros serão adicionados ao sistema."
))
return;

for(
const table of[
"obras",
"funcionarios",
"diarias",
"gastos",
"pagamentos",
"checklist"
]){

const rows=
backup.data[table]||[];

for(
const row of rows
){

const copy={...row};

delete copy.id;
delete copy.created_at;
delete copy.updated_at;
delete copy.user_id;

await insertRow(
table,
copy
);

}

}

if(backup.funcionarioObras){

localStorage.setItem(
FUNC_OBRA_KEY,
JSON.stringify(
backup.funcionarioObras
)
);

}

if(backup.adiantamentosAplicados){

localStorage.setItem(
ADV_KEY,
JSON.stringify(
backup.adiantamentosAplicados
)
);

}

/*
 Importação das fotos para o IndexedDB.
*/

if(
Array.isArray(
backup.fotos
)
){

for(
const foto of backup.fotos
){

try{

await savePhotoDB({
...foto,
id:
foto.id||
"foto_"+Date.now()+"_"+
Math.random()
.toString(36)
.slice(2)
});

}catch(err){

console.warn(
"Erro importando foto",
err
);

}

}

}

await loadCloud();

renderAll();

toast(
"Backup importado."
);

}catch(e){

console.error(e);

toast(
"Arquivo de backup inválido."
);

}

};

reader.readAsText(file);

}
