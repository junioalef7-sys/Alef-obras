<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>EDIFIQ — Gestão de Obras</title>

<!-- SUPABASE COM FALLBACK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2'"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{--bg:#090b0e;--panel:#12161b;--panel2:#181d23;--gold:#d8ad45;--text:#f4f4f4;--muted:#9da5ae;--green:#36c98f;--red:#ef6670;--blue:#64a8ff;--line:#2a3038}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:#0b0d10ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;letter-spacing:2px}.logo span,.gold{color:var(--gold)}.sub,.label,small{font-size:12px;color:var(--muted)}
main{max-width:1050px;margin:auto;padding:18px 16px 105px}.page{display:none}.page.active{display:block}h1{margin:5px 0}.lead{color:var(--muted);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card,.item,.authbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}.stat{font-size:23px;font-weight:800;margin-top:6px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.action,.primary,.secondary,.danger,.mini{border-radius:12px;padding:12px 14px;font-weight:700}.action{background:var(--panel2);border:1px solid var(--line);color:var(--text);text-align:left}.primary{background:var(--gold);color:#15110a}.secondary{background:#20262d;color:var(--text);border:1px solid var(--line)}.danger{background:#32191c;color:#ff9ca3;border:1px solid #653038}.mini{padding:7px 9px;background:#20262d;color:#fff;border:1px solid var(--line);font-size:12px}
.form{display:grid;gap:10px}.form input,.form select,.form textarea,.toolbar input,.toolbar select{width:100%;background:#0e1216;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}.form textarea{min-height:85px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.wrap{flex-wrap:wrap}.badge{background:#242b33;border-radius:999px;padding:5px 9px;font-size:12px}.badge.on{color:#8ff0c5;background:#15382c}.badge.off{color:#ffb0b5;background:#3b1c20}
.progress{height:7px;background:#252b32;border-radius:9px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--gold)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b0d10f5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px env(safe-area-inset-right) calc(7px + env(safe-area-inset-bottom)) env(safe-area-inset-left);z-index:6}
.nav{background:none;color:var(--muted);padding:7px}.nav.active{color:var(--gold)}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:end}.modal.open{display:flex}.sheet{background:#11151a;border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-height:94vh;overflow:auto;padding:18px}.close{float:right;background:none;color:var(--muted);font-size:28px}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(440px,100%);padding:25px}.authlogo{text-align:center;font-size:30px;font-weight:900;letter-spacing:4px}.authlogo span{color:var(--gold)}
.connection{text-align:center;margin-top:12px;font-size:12px;color:var(--muted)}.connection.ok{color:var(--green)}.connection.error{color:var(--red)}
.toolbar{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted)}
.toast{position:fixed;right:15px;bottom:80px;z-index:50;background:#20262d;border:1px solid var(--line);padding:12px 15px;border-radius:12px;display:none;max-width:90vw}.toast.show{display:block}
.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photoGrid img{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.divider{height:1px;background:var(--line);margin:14px 0}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.search{margin:10px 0}.search input{width:100%;background:#0e1216;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{min-height:92px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px}.listActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.note{background:#171d23;border-left:3px solid var(--gold);padding:10px;border-radius:8px;color:#d7dce1;font-size:13px}
@media(max-width:700px){.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr}.photoGrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:450px){.grid,.grid3,.grid4,.two,.three{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.stat{font-size:20px}}
</style>
</head>
<body>

<div id="auth" class="auth">
<div class="authbox">
<div class="authlogo">EDIFI<span>Q</span></div>
<p class="sub" style="text-align:center">GESTÃO DE OBRAS</p>
<p id="connectionStatus" class="connection">Verificando conexão...</p>
<div class="form" style="margin-top:20px">
<input id="email" type="email" placeholder="E-mail" autocomplete="email">
<input id="password" type="password" placeholder="Senha" autocomplete="current-password">
<button class="primary" onclick="login()">Entrar</button>
<button class="secondary" onclick="signup()">Criar minha conta</button>
<button class="secondary" onclick="resetPassword()">Esqueci a senha</
