<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDIFIQ - Gestão de Obras</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
body { background: #121212; color: #fff; min-height: 100vh; padding: 20px; }
h1 { color: #d4af37; text-align: center; margin: 20px 0; }
.caixa { background: #1e1e1e; padding: 20px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; background: #2a2a2a; color: white; font-size: 16px; }
button { padding: 12px 20px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 5px; }
.btn-verde { background: #28a745; color: white; }
.btn-dourado { background: #d4af37; color: black; }
.btn-vermelho { background: #dc3545; color: white; }
.item { background: #2a2a2a; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #d4af37; }
.sucesso { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: #28a745; color: white; padding: 15px 25px; border-radius: 8px; font-weight: bold; display: none; z-index: 9999; }
.erro { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: #dc3545; color: white; padding: 15px 25px; border-radius: 8px; font-weight: bold; display: none; z-index: 9999; }
.tela-login { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
.escondido { display: none !important; }
</style>
</head>
<body>

<!-- MENSAGENS -->
<div class="sucesso" id="msgOk">✅ SALVO COM SUCESSO!</div>
<div class="erro" id="msgErro">❌ ERRO AO SALVAR!</div>

<!-- TELA DE LOGIN -->
<div class="tela-login" id="telaLogin">
  <div class="caixa" style="width: 90%; max-width: 350px;">
    <h1>EDIFIQ</h1>
    <input type="text" id="user" placeholder="Usuário">
    <input type="password" id="pass" placeholder="Senha">
    <button class="btn-dourado" style="width: 100%;" onclick="entrar()">ENTRAR</button>
    <p style="text-align:center; margin-top:15px; color:#888; font-size:14px;">admin / 1234</p>
  </div>
</div>

<!-- CONTEÚDO PRINCIPAL -->
<div id="app" class="escondido">
  <h1>🏗️ EDIFIQ</h1>
  <button class="btn-vermelho" style="position:fixed; top:15px; right:15px;" onclick="sair()">SAIR</button>

  <!-- ÁREA DE OBRAS -->
  <div class="caixa">
    <h2>Nova Obra</h2>
    <input type="text" id="nomeObra" placeholder="Nome da Obra">
    <input type="text" id="clienteObra" placeholder="Cliente">
    <input type="number" step="0.01" id="valorObra" placeholder="Valor R$">
    <button class="btn-verde" onclick="salvarObra()">💾 SALVAR OBRA</button>
  </div>

  <!-- LISTA DE OBRAS -->
  <div class="caixa">
    <h2>Obras Cadastradas</h2>
    <div id="listaObras"></div>
  </div>

  <!-- TESTE DE SALVAMENTO -->
  <div class="caixa">
    <h2>🔧 Teste de Salvamento</h2>
    <button class="btn-dourado" onclick="testar()">Clique para testar se salva</button>
    <p id="resultadoTeste" style="margin-top:10px; font-weight:bold;"></p>
  </div>
</div>

<script>
// ==========================================
// FUNÇÃO DE SALVAR — SIMPLES E DIRETA
// ==========================================
const CHAVE = "EDIFIQ_2026_FINAL";

// DADOS
let dados = { obras: [] };

// CARREGAR AO ABRIR
function carregar() {
  try {
    const temp = localStorage.getItem(CHAVE);
    if (temp) {
      dados = JSON.parse(temp);
      console.log("✅ Dados carregados:", dados);
    }
  } catch (e) {
    console.log("Erro ao carregar:", e);
    dados = { obras: [] };
  }
  atualizarLista();
}

// SALVAR — A FUNÇÃO PRINCIPAL
function salvar() {
  try {
    localStorage.setItem(CHAVE, JSON.stringify(dados));
    console.log("💾 SALVO:", dados);
    // MOSTRA MENSAGEM DE SUCESSO
    document.getElementById("msgOk").style.display = "block";
    setTimeout(() => { document.getElementById("msgOk").style.display = "none"; }, 2500);
    return true;
  } catch (e) {
    console.log("❌ ERRO AO SALVAR:", e);
    document.getElementById("msgErro").style.display = "block";
    setTimeout(() => { document.getElementById("msgErro").style.display = "none"; }, 3000);
    alert("ERRO: O navegador está bloqueando o salvamento!\n\nUse o Chrome normal, NÃO o modo anônimo.");
    return false;
  }
}

// TESTE DE SALVAMENTO
function testar() {
  const agora = new Date().toLocaleString("pt-BR");
  localStorage.setItem("TESTE_EDIFIQ", agora);
  const lido = localStorage.getItem("TESTE_EDIFIQ");
  
  if (lido) {
    document.getElementById("resultadoTeste").innerHTML = 
      "✅ SALVAMENTO FUNCIONA! ✅<br>Teste: " + lido;
    document.getElementById("resultadoTeste").style.color = "#28a745";
  } else {
    document.getElementById("resultadoTeste").innerHTML = 
      "❌ NÃO SALVA! ❌<br>Use navegador normal (não anônimo) e libere cookies.";
    document.getElementById("resultadoTeste").style.color = "#dc3545";
  }
}

// LOGIN
function entrar() {
  const u = document.getElementById("user").value;
  const s = document.getElementById("pass").value;
  if (u === "admin" && s === "1234") {
    document.getElementById("telaLogin").classList.add("escondido");
    document.getElementById("app").classList.remove("escondido");
    carregar();
  } else {
    alert("Usuário ou senha errados!");
  }
}

function sair() {
  if (confirm("Sair?")) {
    document.getElementById("telaLogin").classList.remove("escondido");
    document.getElementById("app").classList.add("escondido");
    document.getElementById("user").value = "";
    document.getElementById("pass").value = "";
  }
}

// SALVAR OBRA
function salvarObra() {
  const nome = document.getElementById("nomeObra").value.trim();
  const cliente = document.getElementById("clienteObra").value.trim();
  const valor = parseFloat(document.getElementById("valorObra").value);

  if (!nome) { alert("Digite o nome da obra!"); return; }
  if (!valor || valor <= 0) { alert("Digite o valor!"); return; }

  // ADICIONA
  dados.obras.push({
    id: Date.now(),
    nome: nome,
    cliente: cliente,
    valor: valor.toFixed(2),
    data: new Date().toLocaleDateString("pt-BR")
  });

  // SALVA NO NAVEGADOR
  salvar();
  
  // LIMPA CAMPOS
  document.getElementById("nomeObra").value = "";
  document.getElementById("clienteObra").value = "";
  document.getElementById("valorObra").value = "";

  atualizarLista();
}

// ATUALIZAR LISTA
function atualizarLista() {
  const lista = document.getElementById("listaObras");
  
  if (!dados.obras || dados.obras.length === 0) {
    lista.innerHTML = "<p style='color:#888;'>Nenhuma obra cadastrada.</p>";
    return;
  }

  lista.innerHTML = dados.obras.map((obra, indice) => `
    <div class="item">
      <h3>${obra.nome}</h3>
      <p>Cliente: ${obra.cliente || "Não informado"}</p>
      <p>Valor: R$ ${obra.valor}</p>
      <p>Data: ${obra.data}</p>
      <button class="btn-vermelho" onclick="excluirObra(${indice})">🗑️ Excluir</button>
    </div>
  `).join("");
}

// EXCLUIR OBRA
function excluirObra(indice) {
  if (!confirm("Excluir esta obra?")) return;
  dados.obras.splice(indice, 1);
  salvar();
  atualizarLista();
}
</script>

</body>
</html>
