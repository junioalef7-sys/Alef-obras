<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDIFIQ - Gestão de Obras</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
:root { --fundo: #0f1115; --card: #1a1d23; --dourado: #d4af37; --texto: #f0f0f0; --verde: #28a745; --vermelho: #dc3545; }
body { background: var(--fundo); color: var(--texto); min-height: 100vh; }

/* LOGIN */
.tela-login { position: fixed; top:0; left:0; width:100%; height:100%; background: #0f1115; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; }
.login-box { background: var(--card); padding:30px; border-radius:12px; border:2px solid var(--dourado); width:90%; max-width:350px; }
.login-box h1 { text-align:center; color:var(--dourado); margin-bottom:20px; font-size:28px; }
.login-box input { width:100%; padding:12px; margin:8px 0; border-radius:6px; border:1px solid #444; background:#0f1115; color:white; font-size:15px; }
.btn-login { width:100%; padding:12px; background:var(--dourado); color:black; border:none; border-radius:6px; font-weight:bold; font-size:16px; margin-top:10px; cursor:pointer; }
.erro { color:var(--vermelho); text-align:center; margin-top:10px; display:none; }

/* CABEÇALHO */
.header { background:var(--card); padding:15px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--dourado); }
.header h1 { color:var(--dourado); font-size:20px; }
.btn-sair { background:var(--vermelho); color:white; border:none; padding:8px 16px; border-radius:6px; font-weight:bold; cursor:pointer; }

/* CONTEÚDO */
main { padding:20px; padding-bottom:80px; display:none; }
.pagina { display:none; }
.pagina.ativa { display:block; }
h2 { font-size:22px; margin-bottom:20px; color:var(--dourado); }
.card { background:var(--card); padding:15px; border-radius:10px; margin-bottom:15px; border:1px solid #333; }
input { width:100%; padding:10px; margin:6px 0; border-radius:6px; border:1px solid #444; background:#0f1115; color:white; font-size:15px; }
.btn { padding:10px 15px; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:14px; margin:4px; }
.btn.dourado { background:var(--dourado); color:black; }
.btn.verde { background:var(--verde); color:white; }
.btn.vermelho { background:var(--vermelho); color:white; }
.lista { margin-top:15px; }
.item { background:#252830; padding:12px; border-radius:8px; margin-bottom:10px; border-left:3px solid var(--dourado); }
.sucesso { position:fixed; top:15px; left:50%; transform:translateX(-50%); background:var(--verde); color:white; padding:10px 20px; border-radius:6px; font-weight:bold; z-index:9999; display:none; }

/* MENU */
.menu-inferior { position:fixed; bottom:0; left:0; right:0; background:var(--card); display:grid; grid-template-columns:repeat(4,1fr); border-top:2px solid var(--dourado); }
.menu-btn { background:none; border:none; color:#888; padding:12px; display:flex; flex-direction:column; align-items:center; cursor:pointer; font-size:11px; }
.menu-btn.ativo { color:var(--dourado); }

/* MODAL */
.overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:999; padding:20px; }
.modal { background:var(--card); padding:20px; border-radius:10px; width:100%; max-width:350px; border:2px solid var(--dourado); }
.fechar { float:right; background:none; border:none; color:white; font-size:24px; cursor:pointer; margin-top:-5px; }
</style>
</head>
<body>

<!-- MENSAGEM DE SALVO -->
<div class="sucesso" id="msgSalvo">✅ SALVO COM SUCESSO!</div>

<!-- TELA DE LOGIN -->
<div class="tela-login" id="telaLogin">
  <div class="login-box">
    <h1>EDIFIQ</h1>
    <input type="text" id="usuario" placeholder="Usuário">
    <input type="password" id="senha" placeholder="Senha">
    <div class="erro" id="erroLogin">Usuário ou senha incorretos!</div>
    <button class="btn-login" onclick="entrar()">ENTRAR</button>
    <p style="text-align:center; margin-top:15px; font-size:12px; color:#888;">Usuário: admin | Senha: 1234</p>
  </div>
</div>

<!-- CABEÇALHO -->
<header class="header" id="cabecalho" style="display:none;">
  <h1>EDIFIQ</h1>
  <button class="btn-sair" onclick="sair()">SAIR</button>
</header>

<!-- CONTEÚDO -->
<main id="conteudo">
  <!-- OBRAS -->
  <div class="pagina ativa" id="pagObras">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>🏗️ Obras</h2>
      <button class="btn verde" onclick="abrirModalObra()">+ Nova Obra</button>
    </div>
    <div class="lista" id="listaObras"></div>
  </div>

  <!-- EQUIPE -->
  <div class="pagina" id="pagEquipe">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>👷 Equipe</h2>
      <button class="btn verde" onclick="abrirModalFunc()">+ Funcionário</button>
    </div>
    <div class="lista" id="listaFunc"></div>
  </div>

  <!-- FINANCEIRO -->
  <div class="pagina" id="pagFin">
    <h2>💰 Financeiro</h2>
    <button class="btn verde" onclick="abrirModalDesp()">+ Despesa</button>
    <div class="lista" id="listaDesp"></div>
  </div>

  <!-- DADOS -->
  <div class="pagina" id="pagDados">
    <h2>💾 Meus Dados</h2>
    <div class="card">
      <p style="margin-bottom:10px;">Seus dados são salvos automaticamente no navegador.</p>
      <button class="btn dourado" onclick="baixarBackup()">📥 Baixar Backup</button>
      <button class="btn vermelho" onclick="apagarTudo()">🗑️ Apagar Tudo</button>
    </div>
    <div class="card" style="margin-top:20px;">
      <h3 style="margin-bottom:10px;">🔧 Teste de Salvamento</h3>
      <p id="testeSalvamento">Clique abaixo para testar se o salvamento funciona:</p>
      <button class="btn dourado" onclick="testarSalvamento()">🧪 Testar Agora</button>
    </div>
  </div>
</main>

<!-- MENU INFERIOR -->
<nav class="menu-inferior" id="menuInferior" style="display:none;">
  <button class="menu-btn ativo" onclick="irPara('pagObras', this)">🏗️ Obras</button>
  <button class="menu-btn" onclick="irPara('pagEquipe', this)">👷 Equipe</button>
  <button class="menu-btn" onclick="irPara('pagFin', this)">💰 Finanças</button>
  <button class="menu-btn" onclick="irPara('pagDados', this)">💾 Dados</button>
</nav>

<!-- MODAL -->
<div class="overlay" id="modalOverlay" onclick="fecharModal()">
  <div class="modal" id="modalConteudo" onclick="event.stopPropagation()"></div>
</div>

<script>
// ==========================================
// SALVAMENTO — FUNÇÃO SIMPLES E DIRETA
// ==========================================
const CHAVE = "EDIFIQ_DADOS_SIMPLES";

// CARREGAR — RODA AO ABRIR
let dados = { obras: [], funcionarios: [], despesas: [] };

function carregarDados() {
  try {
    const salvos = localStorage.getItem(CHAVE);
    if (salvos) {
      dados = JSON.parse(salvos);
      console.log("✅ Dados carregados com sucesso!");
    } else {
      console.log("ℹ️ Nenhum dado salvo ainda — pronto para salvar.");
    }
  } catch (erro) {
    console.error("❌ Erro ao carregar:", erro);
    dados = { obras: [], funcionarios: [], despesas: [] };
  }
}

// SALVAR — A FUNÇÃO MAIS IMPORTANTE
function salvarDados() {
  try {
    localStorage.setItem(CHAVE, JSON.stringify(dados));
    console.log("💾 SALVO NO NAVEGADOR:", dados);
    // MOSTRA MENSAGEM DE SUCESSO
    const msg = document.getElementById("msgSalvo");
    msg.style.display = "block";
    setTimeout(() => { msg.style.display = "none"; }, 2000);
    atualizarTela();
    return true;
  } catch (erro) {
    console.error("❌ ERRO AO SALVAR:", erro);
    alert("❌ NÃO FOI POSSÍVEL SALVAR!\n\nVerifique se o navegador permite salvar dados.\n(Configurações > Privacidade > Permitir cookies)");
    return false;
  }
}

// TESTE DE SALVAMENTO — PARA CONFIRMAR QUE FUNCIONA
function testarSalvamento() {
  const teste = { data: new Date().toLocaleString("pt-BR") };
  localStorage.setItem("TESTE_EDIFIQ", JSON.stringify(teste));
  const lido = localStorage.getItem("TESTE_EDIFIQ");
  
  if (lido) {
    document.getElementById("testeSalvamento").innerHTML = 
      "✅ <strong>SALVAMENTO FUNCIONANDO PERFEITAMENTE!</strong><br>Teste feito em: " + teste.data;
  } else {
    document.getElementById("testeSalvamento").innerHTML = 
      "❌ <strong>SALVAMENTO NÃO FUNCIONA!</strong><br>Verifique as configurações do navegador.";
  }
}

// FORMATA DINHEIRO
function real(valor) {
  return Number(valor || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

// ==========================================
// LOGIN
// ==========================================
function entrar() {
  const user = document.getElementById("usuario").value;
  const senha = document.getElementById("senha").value;
  
  if (user === "admin" && senha === "1234") {
    document.getElementById("telaLogin").style.display = "none";
    document.getElementById("cabecalho").style.display = "flex";
    document.getElementById("conteudo").style.display = "block";
    document.getElementById("menuInferior").style.display = "grid";
    carregarDados(); // CARREGA OS DADOS LOGO AO ENTRAR
    atualizarTela();
  } else {
    document.getElementById("erroLogin").style.display = "block";
  }
}

function sair() {
  if (confirm("Sair do aplicativo?")) {
    document.getElementById("telaLogin").style.display = "flex";
    document.getElementById("cabecalho").style.display = "none";
    document.getElementById("conteudo").style.display = "none";
    document.getElementById("menuInferior").style.display = "none";
    document.getElementById("usuario").value = "";
    document.getElementById("senha").value = "";
    document.getElementById("erroLogin").style.display = "none";
  }
}

// ==========================================
// NAVEGAÇÃO
// ==========================================
function irPara(nome, botao) {
  document.querySelectorAll(".pagina").forEach(p => p.classList.remove("ativa"));
  document.getElementById(nome).classList.add("ativa");
  document.querySelectorAll(".menu-btn").forEach(b => b.classList.remove("ativo"));
  botao.classList.add("ativo");
  fecharModal();
}

// ==========================================
// MODAL
// ==========================================
function abrirModal(conteudo) {
  document.getElementById("modalConteudo").innerHTML = conteudo;
  document.getElementById("modalOverlay").style.display = "flex";
}

function fecharModal() {
  document.getElementById("modalOverlay").style.display = "none";
}

// ==========================================
// OBRAS — SALVAR
// ==========================================
function abrirModalObra() {
  abrirModal(`
    <button class="fechar" onclick="fecharModal()">✕</button>
    <h3>Nova Obra</h3>
    <input type="text" id="nomeObra" placeholder="Nome da obra">
    <input type="text" id="clienteObra" placeholder="Nome do cliente">
    <input type="number" step="0.01" id="valorObra" placeholder="Valor R$">
    <button class="btn verde" onclick="salvarObra()" style="width:100%; margin-top:10px;">💾 SALVAR OBRA</button>
  `);
}

function salvarObra() {
  const nome = document.getElementById("nomeObra").value.trim();
  const cliente = document.getElementById("clienteObra").value.trim();
  const valor = Number(document.getElementById("valorObra").value);

  if (!nome) { alert("Digite o nome da obra!"); return; }
  if (!valor || valor <= 0) { alert("Digite o valor!"); return; }

  // ADICIONA NO ARRAY
  dados.obras.push({
    id: Date.now(),
    nome: nome,
    cliente: cliente,
    valor: valor,
    data: new Date().toLocaleDateString("pt-BR")
  });

  // SALVA NO NAVEGADOR
  salvarDados();
  fecharModal();
}

function renderizarObras() {
  const lista = document.getElementById("listaObras");
  if (dados.obras.length === 0) {
    lista.innerHTML = `<div class="card">Nenhuma obra cadastrada.</div>`;
    return;
  }
  lista.innerHTML = dados.obras.map(o => `
    <div class="item">
      <strong>${o.nome}</strong><br>
      Cliente: ${o.cliente || "—"}<br>
      Valor: ${real(o.valor)}<br>
      <button class="btn vermelho" onclick="excluirObra(${o.id})" style="margin-top:8px;">Excluir</button>
    </div>
  `).join("");
}

function excluirObra(id) {
  if (!confirm("Excluir esta obra?")) return;
  dados.obras = dados.obras.filter(o => o.id !== id);
  salvarDados();
}

// ==========================================
// EQUIPE — SALVAR
// ==========================================
function abrirModalFunc() {
  abrirModal(`
    <button class="fechar" onclick="fecharModal()">✕</button>
    <h3>Novo Funcionário</h3>
    <input type="text" id="nomeFunc" placeholder="Nome completo">
    <input type="text" id="funcaoFunc" placeholder="Função">
    <input type="number" step="0.01" id="valorFunc" placeholder="Valor R$">
    <button class="btn verde" onclick="salvarFunc()" style="width:100%; margin-top:10px;">💾 SALVAR</button>
  `);
}

function salvarFunc() {
  const nome = document.getElementById("nomeFunc").value.trim();
  const funcao = document.getElementById("funcaoFunc").value.trim();
  const valor = Number(document.getElementById("valorFunc").value);

  if (!nome || !valor) { alert("Preencha nome e valor!"); return; }

  dados.funcionarios.push({
    id: Date.now(),
    nome: nome,
    funcao: funcao,
    valor: valor
  });

  salvarDados();
  fecharModal();
}

function renderizarFunc() {
  const lista = document.getElementById("listaFunc");
  if (dados.funcionarios.length === 0) {
    lista.innerHTML = `<div class="card">Nenhum funcionário cadastrado.</div>`;
    return;
  }
  lista.innerHTML = dados.funcionarios.map(f => `
    <div class="item">
      <strong>${f.nome}</strong><br>
      Função: ${f.funcao || "—"}<br>
      Valor: ${real(f.valor)}<br>
      <button class="btn vermelho" onclick="excluirFunc(${f.id})" style="margin-top:8px;">Excluir</button>
    </div>
  `).join("");
}

function excluirFunc(id) {
  if (!confirm("Excluir?")) return;
  dados.funcionarios = dados.funcionarios.filter(f => f.id !== id);
  salvarDados();
}

// ==========================================
// DESPESAS — SALVAR
// ==========================================
function abrirModalDesp() {
  abrirModal(`
    <button class="fechar" onclick="fecharModal()">✕</button>
    <h3>Nova Despesa</h3>
    <input type="text" id="descDesp" placeholder="Descrição">
    <input type="number" step="0.01" id="valorDesp" placeholder="Valor R$">
    <button class="btn verde" onclick="salvarDesp()" style="width:100%; margin-top:10px;">💾 SALVAR</button>
  `);
}

function salvarDesp() {
  const desc = document.getElementById("descDesp").value.trim();
  const valor = Number(document.getElementById("valorDesp").value);

  if (!desc || !valor) { alert("Preencha tudo!"); return; }

  dados.despesas.push({
    id: Date.now(),
    desc: desc,
    valor: valor,
    data: new Date().toLocaleDateString("pt-BR")
  });

  salvarDados();
  fecharModal();
}

function renderizarDesp() {
  const lista = document.getElementById("listaDesp");
  if (dados.despesas.length === 0) {
    lista.innerHTML = `<div class="card">Nenhuma despesa lançada.</div>`;
    return;
  }
  lista.innerHTML = dados.despesas.map(d => `
    <div class="item">
      <strong>${d.desc}</strong><br>
      Valor: ${real(d.valor)} • ${d.data}
    </div>
  `).join("");
}

// ==========================================
// BACKUP E APAGAR
// ==========================================
function baixarBackup() {
  const json = JSON.stringify(dados, null, 2);
  const blob = new Blob([json], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "edifiq-backup.json";
  a.click();
  alert("✅ Backup baixado!");
}

function apagarTudo() {
  if (!confirm("⚠️ APAGAR TUDO? Não tem volta!")) return;
  localStorage.removeItem(CHAVE);
  dados = { obras: [], funcionarios: [], despesas: [] };
  atualizarTela();
  alert("✅ Apagado!");
}

// ==========================================
// ATUALIZAR TELA
// ==========================================
function atualizarTela() {
  renderizarObras();
  renderizarFunc();
  renderizarDesp();
}
</script>

</body>
</html>
