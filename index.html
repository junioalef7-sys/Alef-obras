<script>
/* =========================================================
   EDIFIQ — CHECKLIST COM PROGRESSO POR SERVIÇO
   VERSÃO CORRIGIDA
   ========================================================= */

/* Estado interno do formulário */
let checklistEditId = "";
let checklistEditTarefa = "";


/* =========================================================
   LOCALIZA CHECKLIST DA OBRA
   ========================================================= */

function checklistForOba(obraId){

  if(!D || !Array.isArray(D.checklist)){
    return [];
  }

  return D.checklist
    .filter(x =>
      String(x.obra_id) === String(obraId)
    )
    .sort((a,b)=>{

      const da =
        Number(a.ordem ?? 999999);

      const db =
        Number(b.ordem ?? 999999);

      return da - db;

    });

}


/* Compatibilidade com o restante do sistema */
function checklistForObra(obraId){

  return checklistForOba(obraId);

}


/* =========================================================
   PERCENTUAL REAL DA ETAPA
   ========================================================= */

function checklistPercent(item){

  if(!item){
    return 0;
  }

  if(
    item.concluida === true ||
    item.concluida === "true" ||
    item.concluida === 1 ||
    item.concluida === "1"
  ){

    return 100;

  }

  let p =
    Number(item.progresso);

  if(!Number.isFinite(p)){
    p = 0;
  }

  return Math.max(
    0,
    Math.min(
      100,
      Math.round(p)
    )
  );

}


/* =========================================================
   PROGRESSO TOTAL DA OBRA
   ========================================================= */

function progressForObra(o){

  if(!o){
    return 0;
  }

  const lista =
    checklistForObra(o.id);

  /*
   * Se não houver checklist,
   * mantém o progresso já existente.
   */
  if(!lista.length){

    const antigo =
      Number(o.progresso);

    return Number.isFinite(antigo)
      ? Math.max(0,Math.min(100,Math.round(antigo)))
      : 0;

  }

  const soma =
    lista.reduce(
      (total,item)=>{
        return total +
          checklistPercent(item);
      },
      0
    );

  return Math.round(
    soma / lista.length
  );

}


/* =========================================================
   CRIA CHECKLIST PADRÃO
   ========================================================= */

async function ensureChecklist(obraId){

  if(!obraId){
    return;
  }

  const existente =
    checklistForObra(obraId);

  if(existente.length){
    return;
  }

  const padrao = [

    "Gabarito",
    "Locação",
    "Alvenaria",
    "Chapisco",
    "Reboco",
    "Pintura",
    "Limpeza",
    "Final da obra"

  ];

  for(
    let i = 0;
    i < padrao.length;
    i++
  ){

    try{

      const novo =
        await insertRow(
          "checklist",
          {
            obra_id: obraId,
            tarefa: padrao[i],
            concluida: false,
            progresso: 0,
            ordem: i
          }
        );

      if(novo){

        /*
         * Evita duplicação local
         */
        const existeLocal =
          D.checklist.some(
            x =>
              String(x.id) ===
              String(novo.id)
          );

        if(!existeLocal){

          D.checklist.push(novo);

        }

      }

    }catch(e){

      console.warn(
        "Erro criando checklist:",
        padrao[i],
        e
      );

    }

  }

}


/* =========================================================
   COMPATIBILIDADE
   ========================================================= */

async function criarChecklistPadraoDaObra(obraId){

  return ensureChecklist(obraId);

}


/* =========================================================
   ABRIR CHECKLIST
   ========================================================= */

async function openChecklist(obraId){

  const o =
    obra(obraId);

  if(!o){

    toast(
      "Obra não encontrada."
    );

    return;

  }

  /*
   * Guarda a obra selecionada
   */
  const campoObra =
    $("checkObra");

  if(campoObra){

    campoObra.value =
      obraId;

  }

  checklistEditId = "";
  checklistEditTarefa = "";

  /*
   * Também limpa campos antigos,
   * caso existam no HTML.
   */
  const campoId =
    $("checkId");

  const campoTarefa =
    $("checkTarefa");

  if(campoId){
    campoId.value = "";
  }

  if(campoTarefa){
    campoTarefa.value = "";
  }

  /*
   * Abre imediatamente.
   */
  openM("checkM");

  /*
   * Se não existir checklist,
   * cria os itens padrão.
   */
  if(!checklistForObra(obraId).length){

    const modal =
      $("checkListModal");

    if(modal){

      modal.innerHTML = `
        <div class="empty">
          Criando checklist da obra...
        </div>
      `;

    }

    await ensureChecklist(obraId);

  }

  renderChecklistModal(obraId);

}


/* =========================================================
   RENDERIZA CHECKLIST
   ========================================================= */

function renderChecklistModal(obraId){

  const o =
    obra(obraId);

  if(!o){
    return;
  }

  const lista =
    checklistForObra(obraId);

  const progressoGeral =
    progressForObra(o);

  /*
   * Sincroniza o progresso da obra
   * no objeto local.
   */
  o.progresso =
    progressoGeral;


  let html = `

    <div class="card">

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
      ">

        <div>

          <strong>
            Progresso geral da obra
          </strong>

          <div
            class="muted small"
            style="margin-top:4px"
          >
            Calculado automaticamente pelas
            etapas abaixo.
          </div>

        </div>

        <strong
          class="goldText"
          style="font-size:22px"
        >
          ${progressoGeral}%
        </strong>

      </div>


      <div
        class="progress"
        style="
          margin-top:12px;
          height:14px;
        "
      >

        <i
          style="
            width:${progressoGeral}%;
          "
        ></i>

      </div>

    </div>


    <div class="card">

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:12px;
      ">

        <strong>
          Etapas da obra
        </strong>

        <span class="badge">
          ${lista.length}
          ${lista.length === 1
            ? "etapa"
            : "etapas"}
        </span>

      </div>

  `;


  if(!lista.length){

    html += `

      <div class="empty">
        Nenhum item cadastrado.
      </div>

    `;

  }else{

    html += lista.map(item=>{

      const p =
        checklistPercent(item);

      const concluida =
        p >= 100;

      return `

        <div
          class="checkItemBox"
        >

          <div style="
            display:flex;
            align-items:center;
            gap:9px;
          ">

            <input
              type="checkbox"
              class="checkPercentCheckbox"
              ${concluida
                ? "checked"
                : ""}
              onchange="
                toggleCheck('${item.id}')
              "
              style="
                width:20px;
                height:20px;
                flex:0 0 auto;
              "
            >


            <div style="
              flex:1;
              min-width:0;
            ">

              <div
                style="
                  font-weight:700;
                  font-size:14px;
                  ${
                    concluida
                      ? "text-decoration:line-through;color:#69717d;"
                      : ""
                  }
                "
              >
                ${esc(item.tarefa || "Sem nome")}
              </div>

              <div
                class="muted small"
                style="margin-top:3px"
              >
                Progresso deste serviço:
              </div>

            </div>


            <strong
              id="pct-${item.id}"
              class="goldText"
              style="
                min-width:48px;
                text-align:right;
                font-size:16px;
              "
            >
              ${p}%
            </strong>

          </div>


          <!-- BARRA DO SERVIÇO -->

          <div
            class="checkItemProgress"
            style="
              margin-top:9px;
              margin-left:29px;
            "
          >

            <i
              id="bar-${item.id}"
              style="
                width:${p}%;
              "
            ></i>

          </div>


          <!-- SLIDER -->

          <div style="
            margin:9px 0 0 29px;
          ">

            <input
              type="range"
              min="0"
              max="100"
              step="1"
              value="${p}"
              class="range"
              oninput="
                previewCheckProgress(
                  this,
                  '${item.id}'
                )
              "
              onchange="
                updateCheckProgress(
                  '${item.id}',
                  this.value
                )
              "
            >

          </div>


          <!-- ATALHOS -->

          <div style="
            margin:8px 0 0 29px;
            display:flex;
            flex-wrap:wrap;
            gap:6px;
          ">

            <button
              type="button"
              class="btn sm"
              onclick="
                updateCheckProgress(
                  '${item.id}',
                  0
                )
              "
            >
              0%
            </button>

            <button
              type="button"
              class="btn sm"
              onclick="
                updateCheckProgress(
                  '${item.id}',
                  25
                )
              "
            >
              25%
            </button>

            <button
              type="button"
              class="btn sm"
              onclick="
                updateCheckProgress(
                  '${item.id}',
                  50
                )
              "
            >
              50%
            </button>

            <button
              type="button"
              class="btn sm"
              onclick="
                updateCheckProgress(
                  '${item.id}',
                  75
                )
              "
            >
              75%
            </button>

            <button
              type="button"
              class="btn sm green"
              onclick="
                updateCheckProgress(
                  '${item.id}',
                  100
                )
              "
            >
              100%
            </button>

          </div>


          <!-- EDITAR / EXCLUIR -->

          <div style="
            margin:9px 0 0 29px;
            display:flex;
            gap:7px;
          ">

            <button
              type="button"
              class="btn sm"
              onclick="
                editCheck('${item.id}')
              "
            >
              Editar
            </button>

            <button
              type="button"
              class="btn sm red"
              onclick="
                deleteCheck('${item.id}')
              "
            >
              Excluir
            </button>

          </div>

        </div>

      `;

    }).join("");

  }


  html += `

    </div>


    <!-- NOVA ETAPA -->

    <div class="card">

      <h3>
        ${
          checklistEditId
            ? "Editar etapa"
            : "Adicionar nova etapa"
        }
      </h3>


      <div class="field">

        <label>
          Nome do serviço / etapa
        </label>

        <input
          id="checkTarefa"
          placeholder="Ex.: Instalação elétrica"
          value="${esc(checklistEditTarefa || "")}"
        >

      </div>


      <div style="
        display:flex;
        gap:8px;
        flex-wrap:wrap;
      ">

        <button
          type="button"
          class="btn gold"
          onclick="saveCheck()"
        >
          ${
            checklistEditId
              ? "SALVAR ALTERAÇÃO"
              : "+ ADICIONAR ITEM"
          }
        </button>


        <button
          type="button"
          class="btn"
          onclick="
            checklistEditId='';
            checklistEditTarefa='';
            renderChecklistModal('${obraId}');
          "
        >
          Limpar
        </button>

      </div>

    </div>

  `;


  const modal =
    $("checkListModal");

  if(modal){

    modal.innerHTML =
      html;

  }

}


/* =========================================================
   PRÉ-VISUALIZAÇÃO
   ========================================================= */

function previewCheckProgress(el,id){

  if(!el){
    return;
  }

  const valor =
    Math.max(
      0,
      Math.min(
        100,
        Number(el.value) || 0
      )
    );


  const pct =
    document.getElementById(
      "pct-" + id
    );

  const bar =
    document.getElementById(
      "bar-" + id
    );


  if(pct){

    pct.textContent =
      valor + "%";

  }


  if(bar){

    bar.style.width =
      valor + "%";

  }

}


/* =========================================================
   SALVA PORCENTAGEM
   ========================================================= */

async function updateCheckProgress(id,value){

  const item =
    D.checklist.find(
      x =>
        String(x.id) ===
        String(id)
    );

  if(!item){

    toast(
      "Serviço do checklist não encontrado."
    );

    return;

  }


  let percentual =
    Number(value);

  if(!Number.isFinite(percentual)){

    percentual = 0;

  }


  percentual =
    Math.max(
      0,
      Math.min(
        100,
        Math.round(percentual)
      )
    );


  const concluida =
    percentual >= 100;


  try{

    /*
     * SALVA NO BANCO
     */

    await updateRow(
      "checklist",
      id,
      {
        progresso: percentual,
        concluida: concluida
      }
    );


    /*
     * ATUALIZA LOCALMENTE
     */

    item.progresso =
      percentual;

    item.concluida =
      concluida;


    /*
     * RECALCULA A OBRA
     */

    const o =
      obra(item.obra_id);

    if(o){

      const geral =
        progressForObra(o);

      o.progresso =
        geral;


      /*
       * Salva local
       */

      if(
        typeof localMode !== "undefined" &&
        localMode
      ){

        if(
          typeof saveLocal === "function"
        ){

          saveLocal("obras");

        }

      }else{

        /*
         * Salva no Supabase
         */

        try{

          await updateRow(
            "obras",
            o.id,
            {
              progresso: geral
            }
          );

        }catch(e){

          console.warn(
            "Erro salvando progresso da obra:",
            e
          );

        }

      }

    }


    /*
     * ATUALIZA AS TELAS
     */

    renderChecklistModal(
      item.obra_id
    );


    if(
      typeof renderObras ===
      "function"
    ){

      renderObras();

    }


    if(
      typeof renderDashboard ===
      "function"
    ){

      renderDashboard();

    }


  }catch(e){

    console.error(e);

    toast(
      "Erro ao salvar progresso: " +
      (
        e?.message ||
        e
      )
    );

  }

}


/* =========================================================
   MARCAR / DESMARCAR CONCLUÍDO
   ========================================================= */

async function toggleCheck(id){

  const item =
    D.checklist.find(
      x =>
        String(x.id) ===
        String(id)
    );

  if(!item){
    return;
  }


  const atual =
    checklistPercent(item);


  const novo =
    atual >= 100
      ? 0
      : 100;


  await updateCheckProgress(
    id,
    novo
  );


  toast(
    novo === 100
      ? "Serviço concluído em 100%."
      : "Serviço reaberto em 0%."
  );

}


/* =========================================================
   ADICIONAR / EDITAR ITEM
   ========================================================= */

async function saveCheck(){

  const campoObra =
    $("checkObra");

  const obraId =
    campoObra
      ? campoObra.value
      : "";


  const campoTarefa =
    $("checkTarefa");

  const tarefa =
    campoTarefa
      ? campoTarefa.value.trim()
      : checklistEditTarefa.trim();


  if(!obraId){

    toast(
      "Obra não encontrada."
    );

    return;

  }


  if(!tarefa){

    toast(
      "Digite o nome do serviço."
    );

    return;

  }


  try{

    /*
     * EDITAR
     */

    if(checklistEditId){

      await updateRow(
        "checklist",
        checklistEditId,
        {
          tarefa: tarefa
        }
      );


      const item =
        D.checklist.find(
          x =>
            String(x.id) ===
            String(checklistEditId)
        );


      if(item){

        item.tarefa =
          tarefa;

      }


      toast(
        "Item do checklist alterado."
      );


    }else{

      /*
       * NOVO ITEM
       */

      const ordem =
        checklistForObra(
          obraId
        ).length;


      const novo =
        await insertRow(
          "checklist",
          {
            obra_id: obraId,
            tarefa: tarefa,
            concluida: false,
            progresso: 0,
            ordem: ordem
          }
        );


      if(novo){

        const existe =
          D.checklist.some(
            x =>
              String(x.id) ===
              String(novo.id)
          );


        if(!existe){

          D.checklist.push(
            novo
          );

        }

      }


      toast(
        "Novo item adicionado ao checklist."
      );

    }


    /*
     * LIMPA EDIÇÃO
     */

    checklistEditId = "";
    checklistEditTarefa = "";


    /*
     * RENDERIZA NOVAMENTE
     */

    renderChecklistModal(
      obraId
    );


    if(
      typeof renderObras ===
      "function"
    ){

      renderObras();

    }


    if(
      typeof renderDashboard ===
      "function"
    ){

      renderDashboard();

    }


  }catch(e){

    console.error(e);

    toast(
      "Erro ao salvar item: " +
      (
        e?.message ||
        e
      )
    );

  }

}


/* =========================================================
   EDITAR ITEM
   ========================================================= */

function editCheck(id){

  const item =
    D.checklist.find(
      x =>
        String(x.id) ===
        String(id)
    );

  if(!item){
    return;
  }


  checklistEditId =
    item.id;


  checklistEditTarefa =
    item.tarefa || "";


  renderChecklistModal(
    item.obra_id
  );


  setTimeout(()=>{

    const campo =
      $("checkTarefa");

    if(campo){

      campo.focus();

      campo.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    }

  },50);

}


/* =========================================================
   EXCLUIR ITEM
   ========================================================= */

async function deleteCheck(id){

  const item =
    D.checklist.find(
      x =>
        String(x.id) ===
        String(id)
    );

  if(!item){
    return;
  }


  if(
    !confirm(
      "Excluir este serviço do checklist?"
    )
  ){

    return;

  }


  try{

    await removeRow(
      "checklist",
      id
    );


    D.checklist =
      D.checklist.filter(
        x =>
          String(x.id) !==
          String(id)
      );


    /*
     * Recalcula progresso
     */

    const o =
      obra(item.obra_id);


    if(o){

      const geral =
        progressForObra(o);


      o.progresso =
        geral;


      if(
        typeof localMode !== "undefined" &&
        localMode
      ){

        if(
          typeof saveLocal === "function"
        ){

          saveLocal("obras");

        }

      }else{

        try{

          await updateRow(
            "obras",
            o.id,
            {
              progresso: geral
            }
          );

        }catch(e){

          console.warn(
            "Erro atualizando obra:",
            e
          );

        }

      }

    }


    toast(
      "Item excluído."
    );


    renderChecklistModal(
      item.obra_id
    );


    if(
      typeof renderObras ===
      "function"
    ){

      renderObras();

    }


    if(
      typeof renderDashboard ===
      "function"
    ){

      renderDashboard();

    }


  }catch(e){

    console.error(e);

    toast(
      "Erro ao excluir: " +
      (
        e?.message ||
        e
      )
    );

  }

}

   CSS DO CHECKLIST
   ========================================================= */

  document.createElement("style");


styleChecklist.textContent = `

/* =========================================================
   DISPONIBILIZA PARA OS BOTÕES
   ========================================================= */

Object.assign(
  window,
  {

    openChecklist,

    renderChecklistModal,

    previewCheckProgress,

    updateCheckProgress,

    toggleCheck,

    saveCheck,

    editCheck,

    deleteCheck,

    ensureChecklist,

    criarChecklistPadraoDaObra,

    progressForObra,

    checklistForObra

  }
);

</script>
