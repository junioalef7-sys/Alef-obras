<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EDIFIQ</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
:root {
  --fundo: #000000;
  --card: #1C1C1E;
  --dourado: #E6C200;
  --verde: #34C759;
  --vermelho: #FF3B30;
  --cinza-input: #2C2C2E;
  --texto: #FFFFFF;
  --texto-cinza: #8E8E93;
}
body { background: var(--fundo); color: var(--texto); min-height: 100vh; padding: 20px 16px; }

/* CABEÇALHO — IGUAL SUA TELA */
.header { display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 32px; padding-top: 10px; }
.logo { display: flex; align-items: center; gap: 10px; font-size: 34px; font-weight: 800; color: var(--dourado); }
.btn-sair { position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: var(--vermelho); color: white; border: none; padding: 12px 28px; border-radius: 10px; font-size: 18px; font-weight: 600; cursor: pointer; }

/* CARDS — IGUAL SUA TELA */
.card { background: var(--card); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
.card h2 { font-size: 32px; font-weight: 700; margin-bottom: 20px; }
.input { width: 100%; background: var(--cinza-input); border: none; border-radius: 10px; padding: 18px 16px; font-size: 19px; color: var(--texto); margin-bottom: 16px; }
.input::placeholder { color: var(--texto-cinza); }

/* BOTÕES — IGUAL SUA TELA */
.btn-salvar { width: 100%; background: var(--verde); color: white; border: none; border-radius: 10px; padding: 18px; font-size: 20px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px; }
.btn-teste { width: 100%; background: var(--dourado); color: #000; border: none; border-radius: 10px; padding: 18px; font-size: 20px; font-weight: 600; cursor: pointer; margin-top: 12px; }

/* LISTA OBRAS */
.lista-obras { margin-top: 10px; }
.obra-item { background: var(--cinza-input); border-radius: 12px; padding: 16px; margin-bottom: 12px; border-left: 4px solid var(--dourado); }
.obra-nome { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.obra-dados { font-size: 15px; color: #E0E0E0; line-height: 1.6; }
.btn-excluir { background: var(--vermelho); color: white; border: none; border-radius: 8px; padding: 8px 14px; font-size: 14px; margin-top: 10px; cursor: pointer; }
.vazio { color: var(--texto-cinza); font-size: 17px; }

/* MENSAGENS */
.msg-sucesso { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--verde); color: white; padding: 14px 24px; border-radius: 10px; font-weight: 600; font-size: 17px; z-index: 9999; display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.msg-erro { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--vermelho); color: white; padding: 14px 24px; border-radius: 10px; font-weight: 600; font-size: 17px; z-index: 9999; display: none; }
.resultado-teste { margin-top: 14px; font-weight: 600; font-size: 16px; }
.ok { color: var(--verde); }
.erro { color: var(--vermelho); }
</style>
</head>
<body>

<!-- MENSAGENS -->
<div class="msg-sucesso" id="msgOk">✅ OBRA SALVA COM SUCESSO!</div>
<div class="msg-erro" id="msgErro">❌ ERRO AO SALVAR!</div>

<!-- CABEÇALHO EXATO DA SUA TELA -->
<header class="header">
  <div class="logo">
    <span>🏗️</span> EDIFIQ
  </div>
  <button class="btn-sair" onclick="sair()">SAIR</button>
</header>

<!-- NOVA OBRA EXATO DA SUA TELA -->
<div class="card">
  <h2>Nova Obra</h2>
  <input type="text" class="input" id="nomeObra" placeholder="Nome da Obra">
  <input type="text" class="input" id="clienteObra" placeholder="Cliente">
  <input type="number" step="0.01" class="input" id="valorObra" placeholder="Valor R$">
  <button class="btn-salvar" onclick="salvarObra()">
    <span>💾</span> SALVAR OBRA
  </button>
</div>

<!-- OBRAS CADASTRADAS EXATO DA SUA TELA -->
<div class="card">
  <h2>Obras Cadastradas</h2>
  <div class="lista-obras" id="listaObras">
    <p class="vazio">Nenhuma obra cadastrada.</p>
  </div>
</div>

<!-- TESTE DE SALVAMENTO EXATO DA SUA TELA -->
<div class="card">
  <h2 style="font-size:26px;">🔧 Teste de Salvamento</h2>
  <button class="btn-teste" onclick="testarSalvamento()">Clique para testar se salva</button>
  <div class="resultado-teste" id="resultadoTeste"></div>
</div>

<script>
// CHAVE DE SALVAMENTO — DADOS FICAM SALVOS NO SEU CELULAR
const CHAVE_EDIFIQ = "EDIFIQ_DADOS_OBRAS";
let obras = [];

// CARREGAR OBRAS QUANDO ABRIR
function carregarObras() {
  const salvas = localStorage.getItem(CHAVE_EDIFIQ);
  if (salvas) {
    obras = JSON.parse(salvas);
  }
  renderizarLista();
}

// SALVAR OBRAS NO CELULAR
function salvarNoDispositivo() {
  localStorage.setItem(CHAVE_EDIFIQ, JSON.stringify(obras));
}

// SALVAR NOVA OBRA
function salvarObra() {
  const nome = document.getElementById("nomeObra").value.trim();
  const cliente = document.getElementById("clienteObra").value.trim();
  const valor = parseFloat(document.getElementById("valorObra").value);

  // VALIDAÇÃO
  if (!nome) {
    alert("⚠️ Digite o nome da obra!");
    return;
  }
  if (!valor || valor <= 0) {
    alert("⚠️ Digite o valor da obra!");
    return;
  }

  // CRIAR OBRA
  const novaObra = {
    id: Date.now(),
    nome: nome,
    cliente: cliente,
    valor: valor.toFixed(2),
    data: new Date().toLocaleDateString("pt-BR")
  };

  // ADICIONAR E SALVAR
  obras.unshift(novaObra);
  salvarNoDispositivo();

  // LIMPAR CAMPOS
  document.getElementById("nomeObra").value = "";
  document.getElementById("clienteObra").value = "";
  document.getElementById("valorObra").value = "";

  // MOSTRAR MENSAGEM DE SUCESSO
  const msg = document.getElementById("msgOk");
  msg.style.display = "block";
  setTimeout(() => msg.style.display = "none", 2500);

  // ATUALIZAR LISTA
  renderizarLista();
}

// RENDERIZAR LISTA DE OBRAS
function renderizarLista() {
  const lista = document.getElementById("listaObras");

  if (obras.length === 0) {
    lista.innerHTML = `<p class="vazio">Nenhuma obra cadastrada.</p>`;
    return;
  }

  lista.innerHTML = obras.map(obra => `
    <div class="obra-item">
      <div class="obra-nome">${obra.nome}</div>
      <div class="obra-dados">
        Cliente: ${obra.cliente || "Não informado"}<br>
        Valor: R$ ${obra.valor.replace('.', ',')}<br>
        Data: ${obra.data}
      </div>
      <button class="btn-excluir" onclick="excluirObra(${obra.id})">🗑️ Excluir</button>
    </div>
  `).join("");
}

// EXCLUIR OBRA
function excluirObra(id) {
  if (!confirm("Tem certeza que deseja excluir esta obra?")) return;
  obras = obras.filter(o => o.id !== id);
  salvarNoDispositivo();
  renderizarLista();
}

// TESTE DE SALVAMENTO — CONFIRMA SE FUNCIONA
function testarSalvamento() {
  const teste = { hora: new Date().toLocaleTimeString("pt-BR") };
  localStorage.setItem("TESTE_EDIFIQ", JSON.stringify(teste));
  const lido = localStorage.getItem("TESTE_EDIFIQ");
  const resultado = document.getElementById("resultadoTeste");

  if (lido) {
    resultado.innerHTML = "✅ SALVA PERFEITAMENTE! ✅<br>Seus dados ficam salvos no celular mesmo fechando o app.";
    resultado.className = "resultado-teste ok";
  } else {
    resultado.innerHTML = "❌ NÃO ESTÁ SALVANDO ❌<br>Use navegador normal (não modo anônimo/oculto).";
    resultado.className = "resultado-teste erro";
  }
}

// SAIR
function sair() {
  if (confirm("Deseja sair do EDIFIQ?")) {
    alert("Você saiu. Seus dados continuam salvos!");
  }
}

// INICIAR — CARREGAR OBRAS AO ABRIR
carregarObras();
</script>

</body>
</html>
