/* =========================================================
   EDIFIQ — CONEXÃO SUPABASE CORRIGIDA
   ========================================================= */

const SUPA_URL="https://lwqntzwajjgkvtynwdjg.supabase.co";
const SUPA_KEY="sb_publishable_yAGQ6P0-43ia5EiLcR8rJQ_VEOf-mjn";

let sb=null;

function $(id){
  return document.getElementById(id);
}

function setConnection(text,kind=""){
  const el=$("connectionStatus");
  if(!el)return;
  el.textContent=text;
  el.className="connection"+(kind?" "+kind:"");
}

function timeoutPromise(ms,message){
  return new Promise((_,reject)=>{
    setTimeout(()=>reject(new Error(message)),ms);
  });
}

function loadScript(src,timeout=10000){
  return new Promise((resolve,reject)=>{
    let finished=false;

    const script=document.createElement("script");
    script.src=src;
    script.async=true;

    const timer=setTimeout(()=>{
      if(finished)return;
      finished=true;
      script.remove();
      reject(new Error("Tempo limite ao carregar o Supabase."));
    },timeout);

    script.onload=()=>{
      if(finished)return;
      finished=true;
      clearTimeout(timer);

      if(
        window.supabase &&
        typeof window.supabase.createClient==="function"
      ){
        resolve(window.supabase);
      }else{
        reject(new Error("Biblioteca do Supabase indisponível."));
      }
    };

    script.onerror=()=>{
      if(finished)return;
      finished=true;
      clearTimeout(timer);
      script.remove();
      reject(new Error("Falha ao carregar o Supabase."));
    };

    document.head.appendChild(script);
  });
}

async function initSupabase(){

  setConnection("Verificando conexão...","");

  try{

    if(
      !window.supabase ||
      typeof window.supabase.createClient!=="function"
    ){

      try{
        await loadScript(
          "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
          10000
        );
      }catch(e){

        console.warn("CDN principal falhou:",e);

        await loadScript(
          "https://unpkg.com/@supabase/supabase-js@2",
          10000
        );
      }
    }

    if(
      !window.supabase ||
      typeof window.supabase.createClient!=="function"
    ){
      throw new Error("Biblioteca do Supabase não carregou.");
    }

    sb=window.supabase.createClient(
      SUPA_URL,
      SUPA_KEY,
      {
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:true
        }
      }
    );

    const result=await Promise.race([
      sb.auth.getSession(),
      timeoutPromise(
        10000,
        "Tempo limite da conexão com o Supabase."
      )
    ]);

    if(result && result.error){
      throw result.error;
    }

    setConnection("● Sistema conectado","ok");

    return true;

  }catch(e){

    console.error("Supabase:",e);

    sb=null;

    setConnection(
      "● Erro de conexão",
      "error"
    );

    const msg=$("authMsg");

    if(msg){
      msg.textContent=
        "Não foi possível conectar ao sistema. " +
        "Verifique sua internet e recarregue a página.";
    }

    return false;
  }
}

async function checkConnection(){

  if(!sb){
    setConnection(
      "● Supabase não inicializado",
      "error"
    );
    return false;
  }

  try{

    setConnection(
      "Verificando conexão...",
      ""
    );

    const result=await Promise.race([
      sb.auth.getSession(),
      timeoutPromise(
        10000,
        "Tempo limite da conexão."
      )
    ]);

    if(result && result.error){
      throw result.error;
    }

    setConnection(
      "● Sistema conectado",
      "ok"
    );

    return true;

  }catch(e){

    console.error("Conexão:",e);

    setConnection(
      "● Erro de conexão",
      "error"
    );

    return false;
  }
}

const today=()=>{
  const d=new Date();

  return `${d.getFullYear()}-${
    String(d.getMonth()+1).padStart(2,"0")
  }-${
    String(d.getDate()).padStart(2,"0")
  }`;
};

const esc=s=>
  String(s??"").replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );


function toast(s){
  const x=$("toast");
  if(!x)return;

  x.textContent=s;
  x.classList.add("show");

  setTimeout(()=>{
    x.classList.remove("show");
  },3500);
}

function authMsg(s){
  const el=$("authMsg");
  if(el)el.textContent=s||"";
}

function go(p){

  document
    .querySelectorAll(".page")
    .forEach(x=>x.classList.remove("active"));

  if($(p)){
    $(p).classList.add("active");
  }

  document
    .querySelectorAll(".nav")
    .forEach(x=>{
      x.classList.toggle(
        "active",
        x.dataset.p===p
      );
    });

  if(typeof renderAll==="function"){
    renderAll();
  }
}

function openM(id){
  if($(id)){
    $(id).classList.add("open");
  }

  if(typeof fillSelectors==="function"){
    fillSelectors();
  }
}

function closeM(id){
  if($(id)){
    $(id).classList.remove("open");
  }
}


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

async function bootEDIFIQ(){

  setConnection(
    "Verificando conexão...",
    ""
  );

  const ok=await initSupabase();

  if(!ok){
    return;
  }

  const connected=await checkConnection();

  if(!connected){
    return;
  }

  if(typeof startAuth==="function"){
    try{
      await startAuth();
    }catch(e){
      console.error("Erro ao iniciar autenticação:",e);
      authMsg(
        "Conexão estabelecida, mas não foi possível iniciar o login."
      );
    }
  }
}


/* =========================================================
   INÍCIO
   ========================================================= */

if(document.readyState==="loading"){

  document.addEventListener(
    "DOMContentLoaded",
    bootEDIFIQ,
    {once:true}
  );

}else{

  bootEDIFIQ();

}
