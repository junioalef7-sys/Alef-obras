<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDIFIQ - Relatório de Vistoria</title>
  <style>
    /* Reset e Estilos Gerais */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    /* Cabeçalho */
    header {
      border-bottom: 3px solid #0056b3;
      padding-bottom: 15px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 {
      color: #0056b3;
      font-size: 1.8rem;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    /* Botões */
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: #0056b3;
      color: white;
    }

    .btn-primary:hover {
      background-color: #004085;
    }

    .btn-danger {
      background-color: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background-color: #c82333;
    }

    /* Formulário */
    .section-title {
      font-size: 1.2rem;
      color: #495057;
      margin-top: 20px;
      margin-bottom: 15px;
      border-left: 4px solid #0056b3;
      padding-left: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media (max-width: 600px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: #495057;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #0056b3;
      box-shadow: 0 0 0 3px rgba(0,86,179,0.15);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* Regras de Impressão (Exportar PDF / Nuvem) */
    @media print {
      body {
        background: white;
        padding: 0;
      }

      .container {
        box-shadow: none;
        padding: 0;
        max-width: 100%;
      }

      .no-print {
        display: none !important;
      }

      input, select, textarea {
        border: none !important;
        border-bottom: 1px solid #999 !important;
        border-radius: 0 !important;
        background: transparent !important;
        padding: 4px 0 !important;
      }

      .section-title {
        border-left: 3px solid #000;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>EDIFIQ</h1>
      <div class="actions no-print">
        <button type="button" class="btn btn-primary" onclick="exportarPDF()">
          📄 Exportar PDF / Salvar na Nuvem
        </button>
        <button type="button" class="btn btn-danger" onclick="limparDados()">
          🗑️ Limpar
        </button>
      </div>
    </header>

    <form id="edifiqForm">
      <!-- Dados Gerais -->
      <div class="section-title">Dados Gerais da Vistoria</div>
      
      <div class="grid-2">
        <div class="form-group">
          <label for="cliente">Cliente / Condomínio:</label>
          <input type="text" id="cliente" name="cliente" placeholder="Nome do cliente ou condomínio">
        </div>

        <div class="form-group">
          <label for="data">Data da Vistoria:</label>
          <input type="date" id="data" name="data">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="vistor">Responsável Técnico / Vistor:</label>
          <input type="text" id="vistor" name="vistor" placeholder="Seu nome ou empresa">
        </div>

        <div class="form-group">
          <label for="local">Local / Endereço:</label>
          <input type="text" id="local" name="local" placeholder="Endereço ou setor vistoriado">
        </div>
      </div>

      <!-- Detalhes do Edifício -->
      <div class="section-title">Detalhes e Inspeção</div>

      <div class="grid-2">
        <div class="form-group">
          <label for="elemento">Elemento Analisado:</label>
          <select id="elemento" name="elemento">
            <option value="">Selecione...</option>
            <option value="Estrutura">Estrutura</option>
            <option value="Fachada">Fachada</option>
            <option value="Cobertura / Telhado">Cobertura / Telhado</option>
            <option value="Instalações Elétricas">Instalações Elétricas</option>
            <option value="Instalações Hidráulicas">Instalações Hidráulicas</option>
            <option value="Sistemas de Incêndio">Sistemas de Incêndio</option>
            <option value="Outro">Outro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="status">Status da Inspeção:</label>
          <select id="status" name="status">
            <option value="">Selecione...</option>
            <option value="Conforme">Conforme</option>
            <option value="Não Conforme">Não Conforme</option>
            <option value="Atenção / Regular">Atenção / Regular</option>
            <option value="Não Aplicável">Não Aplicável</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="observacoes">Descrição das Anomalias / Observações:</label>
        <textarea id="observacoes" name="observacoes" placeholder="Descreva os achados da vistoria..."></textarea>
      </div>

      <div class="form-group">
        <label for="recomendacoes">Recomendações de Ação:</label>
        <textarea id="recomendacoes" name="recomendacoes" placeholder="Insira as ações corretivas recomendadas..."></textarea>
      </div>
    </form>
  </div>

  <script>
    const FORM_KEY = 'EDIFIQ_FORM_DATA';
    const form = document.getElementById('edifiqForm');

    // Salvar dados no localStorage
    function salvarDados() {
      const formData = new FormData(form);
      const data = {};
      formData.forEach((value, key) => {
        data[key] = value;
      });
      localStorage.setItem(FORM_KEY, JSON.stringify(data));
    }

    // Carregar dados salvos
    function carregarDados() {
      const savedData = localStorage.getItem(FORM_KEY);
      if (savedData) {
        const data = JSON.parse(savedData);
        Object.keys(data).forEach(key => {
          const field = form.elements[key];
          if (field) {
            field.value = data[key];
          }
        });
      }
    }

    // Função para acionar o salvamento em PDF / Nuvem
    function exportarPDF() {
      salvarDados();
      window.print();
    }

    // Limpar o formulário e o localStorage
    function limparDados() {
      if (confirm("Tem certeza que deseja limpar todos os dados preenchidos?")) {
        form.reset();
        localStorage.removeItem(FORM_KEY);
      }
    }

    // Eventos para auto-salvamento a cada alteração
    form.addEventListener('input', salvarDados);

    // Carrega os dados ao abrir a página
    document.addEventListener('DOMContentLoaded', carregarDados);
  </script>

</body>
</html>
