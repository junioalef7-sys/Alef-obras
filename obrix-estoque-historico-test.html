<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OBRIX — Histórico do Estoque</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#111}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:#fafafa;border:1px solid #e3e3e3;border-radius:12px;padding:12px}.kpi b{font-size:24px}input,select,button{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid #bbb;font-size:15px}button{background:#111;color:#fff;font-weight:700}.secondary{background:#e9edf3;color:#111}.muted{color:#666}.hidden{display:none!important}.row{padding:12px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.tipo{font-weight:800;text-transform:uppercase}.entrada{color:#166534}.saida{color:#9f1d20}.transferencia{color:#1d4ed8}.ajuste{color:#92400e}.top{display:flex;gap:8px;align-items:center;justify-content:space-between}.top a{text-decoration:none;background:#e9edf3;color:#111;font-weight:700;padding:10px 13px;border-radius:10px}@media(max-width:760px){.grid,.kpis{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.kpis{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="card" id="login"><h2>OBRIX — Histórico do Estoque</h2><p class="muted">Entre para consultar todas as movimentações.</p><input id="email" type="email" placeholder="E-mail"><br><br><input id="senha" type="password" placeholder="Senha"><br><br><button id="entrar" type="button">Entrar</button><p id="loginStatus"></p></div><div id="app" class="hidden"><div class="card"><div class="top"><div><h2 style="margin:0">Histórico de Movimentações</h2><p class="muted">Entradas, saídas, transferências e ajustes do estoque.</p></div><a href="./obrix-estoque-test.html?v=246">Voltar à Central</a></div><div class="kpis"><div class="kpi"><span>Movimentações</span><br><b id="kMov">0</b></div><div class="kpi"><span>Entradas</span><br><b id="kEnt">0</b></div><div class="kpi"><span>Saídas</span><br><b id="kSai">0</b></div><div class="kpi"><span>Transferências/Ajustes</span><br><b id="kOut">0</b></div></div></div><div class="card"><h3>Filtros</h3><div class="grid"><select id="fMaterial"><option value="">Todos os materiais</option></select><select id="fEstoque"><option value="">Todos os locais</option></select><select id="fTipo"><option value="">Todos os tipos</option><option value="entrada">Entrada</option><option value="saida">Saída</option><option value="transferencia">Transferência</option><option value="ajuste">Ajuste</option><option value="devolucao">Devolução</option></select><input id="fBusca" placeholder="Documento ou observação"><input id="fInicio" type="date"><input id="fFim" type="date"><button id="filtrar" type="button">Aplicar filtros</button><button id="limpar" class="secondary" type="button">Limpar filtros</button></div></div><div class="card"><h3>Movimentações</h3><div id="lista">Carregando...</div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./obrix-backend-adapter.js?v=217"></script><script src="./obrix-estoque-historico-test.js?v=246"></script></body></html>
