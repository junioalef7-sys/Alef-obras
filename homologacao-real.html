<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172a46"><title>EDIFIQ • Nova base</title><style>:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#172033;background:#eef2f7}*{box-sizing:border-box}body{margin:0;background:#eef2f7;min-height:100vh}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#fff;border:1px solid #d8e0ea;border-radius:18px;padding:16px}.login .card{width:min(420px,100%);padding:24px}.brand{font-size:30px;font-weight:950;color:#173b68}.muted{color:#637083;font-size:13px;line-height:1.45}.field{width:100%;padding:13px;margin:6px 0;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}.btn{border:0;border-radius:12px;padding:12px 14px;background:#173b68;color:#fff;font-weight:850}.btn:disabled{opacity:.55}.top{background:#172a46;color:#fff;padding:15px 17px}.top b{font-size:21px}.wrap{max-width:1050px;margin:auto;padding:14px 12px 90px}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:9px}.kpi span{display:block;color:#637083;font-size:11px;font-weight:800;text-transform:uppercase}.kpi b{display:block;font-size:20px;margin-top:5px}.section{margin-top:16px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #d8e0ea;padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:transparent;padding:10px 2px;font-weight:800;color:#657386}.nav button.active{color:#173b68}.notice{margin-bottom:12px}.error{color:#b42318;font-weight:700}.ok{color:#18794e;font-weight:700}</style></head><body>
<section id="login" class="login"><div class="card"><div class="brand">EDIFIQ</div><p class="muted">Nova base limpa • login real • dados reais somente leitura.</p><input id="email" class="field" type="email" autocomplete="username" placeholder="E-mail"><input id="senha" class="field" type="password" autocomplete="current-password" placeholder="Senha"><button id="entrar" class="btn" style="width:100%;margin-top:8px">Entrar</button><p id="loginMsg" class="muted"></p></div></section>
<div id="app" class="hidden"><header class="top"><b>EDIFIQ</b><div id="userLine" style="font-size:12px;opacity:.78"></div></header><main class="wrap"><div class="card notice"><b>Homologação protegida</b><div id="status" class="muted">Carregando seus dados...</div></div><section class="page active" data-page="inicio"><div id="home" class="grid"></div></section><section class="page" data-page="financeiro"><h2>Financeiro</h2><div id="finance" class="grid"></div><div id="financeRows" class="section"></div></section><section class="page" data-page="equipe"><h2>Equipe</h2><div id="team" class="grid"></div></section><section class="page" data-page="menu"><div class="card"><h2>Menu</h2><button id="obrasBtn" class="btn">Obras</button> <button id="sair" class="btn">Sair</button><p class="muted">Sem relatório fotográfico. Nenhuma gravação no banco está habilitada nesta etapa.</p></div><div id="works" class="section grid"></div></section></main><nav class="nav"><button data-nav="inicio" class="active">Início</button><button data-nav="financeiro">Financeiro</button><button data-nav="equipe">Equipe</button><button data-nav="menu">Menu</button></nav></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script><script src="./src/core/money-core.js"></script><script src="./src/core/team-finance-core.js"></script><script src="./src/adapters/supabase-readonly.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0)),n=v=>Number(v||0)||0,same=(a,b)=>String(a??'')===String(b??'');const sb=supabase.createClient('https://lwqntzwajjgkvtynwdjg.supabase.co','sb_publishable_yAGQ6P0-43ia5EiLcR8rJQ_VEOf-mjn',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let snap=null;
function show(p){document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===p))}document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.nav)));$('obrasBtn').addEventListener('click',()=>{$('works').scrollIntoView({behavior:'smooth'})});
function revenue(p){const t=String(p.tipo||'').toLowerCase();return !p.funcionario_id&&(!t||/entrada|receita|receb/.test(t))}function render(){const o=snap.obras||[],f=snap.funcionarios||[],p=snap.pagamentos||[],g=snap.gastos||[],e=snap.servicos_adicionais||[],d=snap.diarias||[],v=snap.adiantamentos||[];const contracts=o.reduce((a,x)=>a+n(x.valor)+e.filter(y=>same(y.obra_id,x.id)).reduce((s,y)=>s+n(y.valor),0),0),received=p.filter(revenue).reduce((a,x)=>a+n(x.valor),0),expenses=g.reduce((a,x)=>a+n(x.valor),0);$('home').innerHTML=`<div class="card kpi"><span>Total contratado</span><b>${money(contracts)}</b></div><div class="card kpi"><span>A receber</span><b>${money(contracts-received)}</b></div><div class="card kpi"><span>Obras ativas</span><b>${o.filter(x=>!['concluida','concluída'].includes(String(x.status).toLowerCase())).length}</b></div><div class="card kpi"><span>Funcionários</span><b>${f.filter(x=>x.ativo!==false).length}</b></div>`;$('finance').innerHTML=`<div class="card kpi"><span>Receitas</span><b>${money(received)}</b></div><div class="card kpi"><span>Despesas</span><b>${money(expenses)}</b></div><div class="card kpi"><span>Resultado</span><b>${money(received-expenses)}</b></div>`;$('financeRows').innerHTML=[...p.filter(revenue).map(x=>['Receita',x.valor,x.obra_id]),...g.map(x=>['Despesa',x.valor,x.obra_id])].slice(0,40).map(x=>`<div class="card row"><div><b>${x[0]}</b></div><b>${money(x[1])}</b></div>`).join('');$('team').innerHTML=f.map(x=>{const bruto=d.filter(y=>same(y.funcionario_id,x.id)&&String(y.status||'pendente').toLowerCase()!=='pago').reduce((a,y)=>a+n(y.valor_diaria)*n(y.qtd||1),0),vale=v.filter(y=>same(y.funcionario_id,x.id)).reduce((a,y)=>a+n(y.valor),0);return `<div class="card"><b>${x.nome||'Funcionário'}</b><div class="muted">${x.funcao||''}</div><p>Líquido em aberto: <b>${money(bruto-vale)}</b></p></div>`}).join('')||'<div class="card">Nenhum funcionário.</div>';$('works').innerHTML=o.map(x=>`<div class="card"><b>${x.nome||'Obra'}</b><div class="muted">${x.cliente||''}</div><p>${money(x.valor)} • ${x.status||'—'}</p></div>`).join('')||'<div class="card">Nenhuma obra.</div>';$('status').textContent=`Dados reais carregados: ${o.length} obras, ${f.length} funcionários. Modo somente leitura.`;$('status').className='ok'}
async function enterApp(session){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userLine').textContent=session.user.email||'';$('status').textContent='Carregando dados reais...';try{snap=await EDIFIQReadonlySupabase.createReadonlyAdapter(sb).loadSnapshot();render()}catch(e){console.error(e);$('status').textContent='Erro ao carregar dados: '+(e.message||e);$('status').className='error'}}
$('entrar').addEventListener('click',async()=>{const btn=$('entrar');btn.disabled=true;$('loginMsg').textContent='Entrando...';try{const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('senha').value});if(error)throw error;await enterApp(data.session)}catch(e){$('loginMsg').textContent='Não foi possível entrar: '+(e.message||e);$('loginMsg').className='error'}finally{btn.disabled=false}});$('sair').addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});sb.auth.getSession().then(({data})=>{if(data.session)enterApp(data.session)});
})();</script></body></html>
