<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBRIX — Relatórios</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#111}.wrap{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #bbb;font-size:16px}button{background:#111;color:#fff;font-weight:700}.hidden{display:none}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.k{border:1px solid #ddd;border-radius:12px;padding:12px}.k small{display:block;color:#666}.k strong{font-size:21px}.report{background:#fff}.muted{color:#666}.ok{color:#166534}.err{color:#b42318}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left;font-size:14px}@media(max-width:700px){.row,.kpis{grid-template-columns:1fr 1fr}}@media print{body{background:#fff}.noprint{display:none!important}.wrap{max-width:none;padding:0}.card{border:0;box-shadow:none}.report{display:block!important}}</style></head><body><div class="wrap"><div class="card noprint" id="login"><h2>OBRIX — Relatórios</h2><input id="email" type="email" placeholder="E-mail"><br><br><input id="senha" type="password" placeholder="Senha"><br><br><button id="entrar">Entrar</button><p id="ls"></p></div><div id="app" class="hidden"><div class="card noprint"><h2>Relatório Geral da Obra</h2><div class="row"><select id="obra"></select><button id="gerar">Gerar prévia</button></div><br><button id="imprimir">Imprimir / Salvar PDF</button><p id="status"></p></div><div id="relatorio" class="card report"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./obrix-backend-adapter.js?v=171"></script><script src="./obrix-relatorios-test.js?v=171"></script></body></html>
