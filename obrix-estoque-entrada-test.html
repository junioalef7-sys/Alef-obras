<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OBRIX — Entrada de Estoque</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#111}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi{background:#fafafa;border:1px solid #e2e2e2;border-radius:12px;padding:12px;margin-top:10px}.kpi b{font-size:24px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #bbb;font-size:16px}textarea{min-height:80px;resize:vertical}button{background:#111;color:#fff;font-weight:700}.muted{color:#666}.hidden{display:none!important}.row{padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card" id="login"><h2>OBRIX — Entrada de estoque</h2><p class="muted">Teste isolado de entrada de material.</p><input id="email" type="email" placeholder="E-mail"><br><br><input id="senha" type="password" placeholder="Senha"><br><br><button id="entrar" type="button">Entrar</button><p id="loginStatus"></p></div><div id="app" class="hidden"><div class="card"><h2>Registrar entrada</h2><div class="grid"><div><label>Material</label><select id="material"></select></div><div><label>Local de estoque</label><select id="estoque"></select></div><div><label>Quantidade</label><input id="quantidade" inputmode="decimal" placeholder="Ex.: 10"></div><div><label>Custo unitário</label><input id="custo" inputmode="decimal" value="0"></div><div><label>Data</label><input id="data" type="date"></div><div><label>Documento / nota</label><input id="documento" placeholder="Opcional"></div></div><br><label>Observações</label><textarea id="observacoes" placeholder="Opcional"></textarea><br><br><button id="registrar" type="button">Registrar entrada</button><p id="status"></p><div class="kpi"><span>Saldo atual selecionado</span><br><b id="saldoAtual">0</b></div></div><div class="card"><h3>Saldos atuais</h3><div id="saldos"></div></div><div class="card"><h3>Últimas entradas</h3><div id="movimentos"></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./obrix-backend-adapter.js?v=207"></script><script src="./obrix-estoque-entrada-test.js?v=207"></script></body></html>
