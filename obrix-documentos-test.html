<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OBRIX — Documentos</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#111}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #bbb;font-size:16px}textarea{min-height:90px;resize:vertical}button{background:#111;color:#fff;font-weight:700}.tabs button{background:#e9edf3;color:#111}.tabs button.active{background:#111;color:#fff}.hidden{display:none!important}.muted{color:#666}.preview{min-height:160px}.preview h1{text-align:center;font-size:22px}.sig{margin-top:55px;border-top:1px solid #333;padding-top:7px;text-align:center}.history-item{padding:12px 0;border-bottom:1px solid #eee}.history-item:last-child{border-bottom:0}.history-actions{display:flex;gap:8px;margin-top:8px}.history-actions button{width:auto;padding:8px 12px;font-size:14px}.secondary{background:#e9edf3;color:#111}.danger{background:#9f1d20}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.filebox{border:1px dashed #bbb;border-radius:12px;padding:12px;background:#fafafa}.file-note{font-size:13px;color:#666;margin:8px 0 0}@media(max-width:680px){.grid,.actions{grid-template-columns:1fr}.history-actions{flex-wrap:wrap}.history-actions button{flex:1;min-width:110px}}@media print{.noprint{display:none!important}.card{border:0}.wrap{padding:0}}</style></head><body><div class="wrap"><div class="card noprint" id="login"><h2>OBRIX — Documentos</h2><p class="muted">Entre para criar e guardar documentos das obras.</p><input id="email" type="email" placeholder="E-mail"><br><br><input id="senha" type="password" placeholder="Senha"><br><br><button id="entrar" type="button">Entrar</button><p id="loginStatus"></p></div><div id="app" class="hidden"><div class="card noprint"><h2>Gerar documentos</h2><div class="tabs"><button id="tabRecibo" class="active" type="button">Recibo</button><button id="tabContrato" type="button">Contrato</button></div><div id="formRecibo"><div class="grid"><div><label>Obra</label><select id="recObra"></select></div><div><label>Destinatário</label><select id="recDestinatario"></select></div><div><label>Nome</label><input id="recNome" placeholder="Nome de quem recebe"></div><div><label>Valor</label><input id="recValor" inputmode="decimal" placeholder="0,00"></div><div><label>Data</label><input id="recData" type="date"></div><div><label>Emitente</label><input id="recEmitente" value="OBRIX"></div></div><br><label>Descrição</label><textarea id="recDescricao" placeholder="Referente a..."></textarea></div><div id="formContrato" class="hidden"><div class="grid"><div><label>Obra</label><select id="conObra"></select></div><div><label>Cliente</label><input id="conCliente" placeholder="Cliente"></div><div><label>Valor</label><input id="conValor" inputmode="decimal" placeholder="0,00"></div><div><label>Início</label><input id="conInicio" type="date"></div></div><br><label>Serviço</label><textarea id="conServico" placeholder="Descrição dos serviços"></textarea><br><label>Condições</label><textarea id="conCondicoes" placeholder="Condições do contrato"></textarea></div><br><div class="actions"><button id="gerar" type="button">Gerar prévia</button><button id="pdf" type="button">Salvar / Compartilhar PDF</button><button id="registrar" type="button">Guardar PDF no OBRIX</button></div><p id="status"></p></div><div id="preview" class="card preview"></div><div class="card noprint"><h2>Guardar arquivo da obra</h2><div class="filebox"><div class="grid"><div><label>Obra</label><select id="arqObra"></select></div><div><label>Tipo de documento</label><select id="arqCategoria"><option value="obra">Projeto / Planta / Documento da obra</option><option value="contrato">Contrato</option><option value="orcamento">Orçamento</option><option value="recibo">Recibo</option><option value="comprovante">Comprovante</option><option value="financeiro">Financeiro</option><option value="relatorio">Relatório</option><option value="cliente">Documento do cliente</option><option value="funcionario">Documento de funcionário</option><option value="outros">Outros</option></select></div><div><label>Título</label><input id="arqTitulo" placeholder="Ex.: Projeto estrutural"></div><div><label>Arquivo</label><input id="arqArquivo" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,.webp,.heic,.heif,.dwg,.dxf,.txt,.csv,.zip"></div></div><br><button id="guardarArquivo" type="button">Guardar documento</button><p id="arquivoStatus"></p><p class="file-note">Aceita PDF, Word, Excel, PowerPoint, imagens, DWG/DXF, TXT, CSV e ZIP. Limite atual: 50 MB por arquivo.</p></div></div><div class="card noprint"><h3>Documentos guardados</h3><div id="historico"></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script src="./obrix-backend-adapter.js?v=192"></script><script src="./obrix-documentos-test.js?v=192"></script><script src="./obrix-documentos-pdf.js?v=192"></script></body></html>
