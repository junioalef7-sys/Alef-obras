<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>OBRIX — Recuperação</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0b1118;color:#f8fafc;font-family:Inter,Arial,sans-serif;padding:24px}.box{width:min(430px,100%);background:#101820;border:1px solid #2a3948;border-radius:20px;padding:24px}.brand{font-size:32px;font-weight:950;margin-bottom:12px}.brand b{color:#ff5a00}.msg{color:#cbd5e1;line-height:1.5}.ok{margin-top:14px;font-weight:800}</style></head><body><div class="box"><div class="brand">OBRI<b>X</b></div><div class="msg">Recuperando a inicialização do aplicativo sem apagar seus dados locais.</div><div id="status" class="ok">Limpando apenas o cache do aplicativo…</div></div><script>(async()=>{const st=document.getElementById('status');try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.allSettled(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.allSettled(ks.filter(k=>/^obrix-offline-/i.test(k)).map(k=>caches.delete(k)))}st.textContent='Cache corrigido. Reabrindo o OBRIX…';setTimeout(()=>location.replace('./obrix.html?recovery=43'),350)}catch(e){st.textContent='Não foi possível limpar automaticamente. Feche esta tela e abra o OBRIX novamente com internet.'}})();</script></body></html>
