<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>OBRIX — Gestão de Obras</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f8;color:#0f172a}.wrap{max-width:1100px;margin:auto;padding:16px}.top,.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.brand{font-size:28px;font-weight:900}.muted{color:#64748b}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;margin-bottom:12px}.login{max-width:440px;margin:45px auto}.login input,.form input,.form select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px;margin:6px 0 10px}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:800;background:#0f172a;color:#fff}.login .btn{width:100%}.hidden{display:none!important}.status{padding:10px;border-radius:10px;margin-top:12px;background:#fee2e2;color:#991b1b}.hero{background:#0f172a;color:#fff;border-radius:18px;padding:22px;margin-bottom:14px}.hero h1{margin:0 0 5px}.hero p{margin:0;color:#cbd5e1}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.kpi{background:#fff;border:1px solid #e2e8f0;border-radius:17px;padding:18px}.kpi small,.mini small{display:block;color:#64748b;font-weight:700}.kpi strong{display:block;font-size:25px;margin-top:7px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.nav button{text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:18px 8px;color:#0f172a;font-weight:900;font-size:17px}.nav span{display:block;font-size:12px;color:#64748b;font-weight:600;margin-top:5px}.bottom{margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bottom button{border:0;border-radius:999px;padding:11px 7px;font-weight:800;background:#e2e8f0}.bottom button.active{background:#0f172a;color:#fff}.item{margin-bottom:10px}.item h3{margin:0 0 5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.mini{background:#f8fafc;border-radius:11px;padding:10px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.actions button{flex:1;min-width:90px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:9px;font-weight:800}.form{margin:12px 0}.formActions{display:flex;gap:8px}.formActions .btn{flex:1}@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}.nav{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.wrap{padding:12px}}@media(max-width:420px){.kpis{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section id="login" class="card login"><div class="brand">OBRIX</div><p class="muted">Sua obra. Sob controle.</p><h2>Entrar</h2><input id="email" type="email" placeholder="E-mail"><input id="senha" type="password" placeholder="Senha"><button class="btn" id="entrar">Entrar</button><div id="erro" class="status hidden"></div></section><section id="app" class="hidden"><div class="top"><div><div class="brand">OBRIX</div><div id="usuario" class="muted"></div></div><button class="btn" id="sair">Sair</button></div><main id="inicio"><div class="hero"><h1>Visão Geral</h1><p>Resumo atualizado das suas obras</p></div><div class="kpis"><div class="kpi"><small>Total contratado</small><strong id="contratado">R$ 0,00</strong></div><div class="kpi"><small>A receber</small><strong id="receber">R$ 0,00</strong></div><div class="kpi"><small>Obras ativas</small><strong id="ativas">0</strong></div><div class="kpi"><small>Funcionários ativos</small><strong id="funcs">0</strong></div></div><div class="nav"><button onclick="abrir('obras')">Obras<span>Cadastro e resumo</span></button><button onclick="abrir('equipe')">Equipe<span>Diárias, vale, bônus e pagamentos</span></button><button onclick="window.OBRIX_FIN&&window.OBRIX_FIN.open()">Financeiro<span>Receitas, despesas e resultado</span></button><button onclick="OBRIX_EST.open()">Estoque<span>Materiais e movimentações</span></button></div></main><main id="obras" class="hidden"><div class="hero"><h1>Obras</h1><p>Cadastro, contratos e resumo financeiro</p></div><div class="sectionHead"><strong>Suas obras</strong><button class="btn">+ Nova obra</button></div><div id="listaObras"></div></main><main id="equipe" class="hidden"><div class="hero"><h1>Equipe</h1><p>Diárias, vales, bônus, extras e pagamentos</p></div><div class="sectionHead"><strong>Funcionários</strong><button class="btn">+ Funcionário</button></div><div id="listaEquipe"></div></main><div class="bottom"><button id="bInicio" class="active" onclick="abrir('inicio')">Início</button><button onclick="window.OBRIX_FIN&&window.OBRIX_FIN.open()">Financeiro</button><button id="bEquipe" onclick="abrir('equipe')">Equipe</button><button>Menu</button></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script><script src="./obrix-backend-adapter.js"></script><script src="./obrix-core-main.js?v=330"></script><script src="./obrix-financeiro-main.js?v=341"></script><script src="./obrix-estoque-main.js?v=325"></script><script src="./obrix-equipe-main.js?v=325"></script><script src="./obrix-obras-main.js?v=342"></script><script src="./obrix-estoque-saida-obra.js?v=339"></script><script src="./obrix-estoque-operacoes-main.js?v=340"></script><script src="./obrix-menu-main.js?v=325"></script><script src="./obrix-theme-main.js?v=325"></script></body></html>
