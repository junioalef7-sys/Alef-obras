<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>OBRIX — Gestão de Obras</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f8;color:#0f172a}.wrap{max-width:1100px;margin:auto;padding:16px}.top,.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.brand{font-size:28px;font-weight:900}.muted{color:#64748b}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px}.login{max-width:440px;margin:45px auto}.login input,.form input,.form select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px;margin:6px 0 10px}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:800;background:#0f172a;color:#fff}.login .btn{width:100%}.hidden{display:none!important}.status{padding:10px;border-radius:10px;margin-top:12px;background:#fee2e2;color:#991b1b}.hero{background:#0f172a;color:#fff;border-radius:18px;padding:22px;margin-bottom:14px}.hero h1{margin:0 0 5px}.hero p{margin:0;color:#cbd5e1}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.kpi{background:#fff;border:1px solid #e2e8f0;border-radius:17px;padding:18px}.kpi small,.mini small{display:block;color:#64748b;font-weight:700}.kpi strong{display:block;font-size:25px;margin-top:7px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.nav button{text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:18px 8px;color:#0f172a;font-weight:900;font-size:17px}.nav span{display:block;font-size:12px;color:#64748b;font-weight:600;margin-top:5px}.bottom{margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bottom button{border:0;border-radius:999px;padding:11px 7px;font-weight:800;background:#e2e8f0}.bottom button.active{background:#0f172a;color:#fff}.item{margin-bottom:10px}.item h3{margin:0 0 5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.mini{background:#f8fafc;border-radius:11px;padding:10px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.actions button{flex:1;min-width:90px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:9px;font-weight:800}.form{margin:12px 0}.formActions{display:flex;gap:8px}.formActions .btn{flex:1}@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}.nav{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.wrap{padding:12px}}@media(max-width:420px){.kpis{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section id="login" class="card login"><div class="brand">OBRIX</div><p class="muted">Sua obra. Sob controle.</p><h2>Entrar</h2><input id="email" type="email" placeholder="E-mail"><input id="senha" type="password" placeholder="Senha"><button class="btn" id="entrar">Entrar</button><div id="erro" class="status hidden"></div></section><section id="app" class="hidden"><div class="top"><div><div class="brand">OBRIX</div><div id="usuario" class="muted"></div></div><button class="btn" id="sair">Sair</button></div><main id="inicio"><div class="hero"><h1>Visão Geral</h1><p>Resumo atualizado das suas obras</p></div><div class="kpis"><div class="kpi"><small>Total contratado</small><strong id="contratado">R$ 0,00</strong></div><div class="kpi"><small>A receber</small><strong id="receber">R$ 0,00</strong></div><div class="kpi"><small>Obras ativas</small><strong id="ativas">0</strong></div><div class="kpi"><small>Funcionários ativos</small><strong id="funcs">0</strong></div></div><div class="nav"><button onclick="abrir('obras')">Obras<span>Cadastro e resumo</span></button><button onclick="abrir('equipe')">Equipe<span>Diárias, vale, bônus e pagamentos</span></button><button onclick="location.href='./obrix-financeiro-test.html?v=285'">Financeiro<span>Receitas, despesas e resultado</span></button><button onclick="location.href='./obrix-estoque-test.html?v=285'">Estoque<span>Materiais e movimentações</span></button></div></main><main id="obras" class="hidden"><div class="hero"><h1>Obras</h1><p>Cadastro, contratos e resumo financeiro</p></div><div class="sectionHead"><strong>Suas obras</strong><button class="btn" onclick="location.href='./obrix-app-test.html?v=285'">Gerenciar obras</button></div><div id="listaObras"></div></main><main id="equipe" class="hidden"><div class="hero"><h1>Equipe</h1><p>Diárias, vales, bônus, extras e pagamentos</p></div><div class="sectionHead"><strong>Funcionários</strong><button class="btn" onclick="location.href='./obrix-app-test.html?v=285#equipe'">+ Funcionário</button></div><div id="listaEquipe"></div></main><div class="bottom"><button id="bInicio" class="active" onclick="abrir('inicio')">Início</button><button onclick="location.href='./obrix-financeiro-test.html?v=285'">Financeiro</button><button id="bEquipe" onclick="abrir('equipe')">Equipe</button><button onclick="location.href='./obrix-estoque-test.html?v=285'">Menu</button></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script><script src="./obrix-backend-adapter.js"></script><script>const $=id=>document.getElementById(id),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let profile=null,obras=[],funcionarios=[],financeiro=[],extras=[],diarias=[],vales=[],bonus=[];async function carregar(){try{profile=await OBRIX_BACKEND.profile();const [ow,fn,fi]=await Promise.all([OBRIX_BACKEND.readTable('obras','criado_em'),OBRIX_BACKEND.readTable('funcionarios','criado_em'),OBRIX_BACKEND.readTable('financeiro','data')]);obras=ow||[];funcionarios=fn||[];financeiro=fi||[];const sb=await OBRIX_BACKEND.init(),eid=profile.empresa_id;const [ex,di,va,bo]=await Promise.all([sb.from('servicos_extras').select('*').eq('empresa_id',eid),sb.from('diarias').select('*').eq('empresa_id',eid),sb.from('vales').select('*').eq('empresa_id',eid),sb.from('bonus_extras').select('*').eq('empresa_id',eid)]);extras=ex.data||[];diarias=di.data||[];vales=va.data||[];bonus=bo.data||[];const total=obras.reduce((s,o)=>s+Number(o.valor_contrato||0),0)+extras.reduce((s,x)=>s+Number(x.valor||0),0),recebido=financeiro.filter(x=>x.tipo==='receita'&&(!x.status_lancamento||x.status_lancamento==='ativo')).reduce((s,x)=>s+Number(x.valor||0),0);$('contratado').textContent=money(total);$('receber').textContent=money(Math.max(0,total-recebido));$('ativas').textContent=String(obras.filter(o=>['andamento','em_andamento'].includes(o.status)).length);$('funcs').textContent=String(funcionarios.filter(f=>f.ativo!==false).length);$('usuario').textContent=profile.nome||profile.email||'';renderObras();renderEquipe();$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch(e){$('erro').textContent=e.message||'Não foi possível entrar.';$('erro').classList.remove('hidden')}}function abrir(id){['inicio','obras','equipe'].forEach(x=>$(x).classList.toggle('hidden',x!==id));$('bInicio').classList.toggle('active',id==='inicio');$('bEquipe').classList.toggle('active',id==='equipe');if(id==='equipe')renderEquipe();if(id==='obras')renderObras();scrollTo({top:0,behavior:'smooth'})}function renderObras(){const box=$('listaObras');box.innerHTML=obras.length?obras.map(o=>{const ex=extras.filter(x=>x.obra_id===o.id).reduce((s,x)=>s+Number(x.valor||0),0),rec=financeiro.filter(x=>x.obra_id===o.id&&x.tipo==='receita'&&(!x.status_lancamento||x.status_lancamento==='ativo')).reduce((s,x)=>s+Number(x.valor||0),0),desp=financeiro.filter(x=>x.obra_id===o.id&&x.tipo==='despesa'&&(!x.status_lancamento||x.status_lancamento==='ativo')).reduce((s,x)=>s+Number(x.valor||0),0),tot=Number(o.valor_contrato||0)+ex;return `<div class="card item"><h3>${esc(o.nome||'Obra')}</h3><div class="muted">${esc(o.cliente||'')} • ${esc(o.status||'')}</div><div class="grid"><div class="mini"><small>Total atualizado</small><b>${money(tot)}</b></div><div class="mini"><small>Recebido</small><b>${money(rec)}</b></div><div class="mini"><small>A receber</small><b>${money(Math.max(0,tot-rec))}</b></div><div class="mini"><small>Despesas</small><b>${money(desp)}</b></div></div></div>`}).join(''):'<div class="card muted">Nenhuma obra cadastrada.</div>'}function renderEquipe(){const box=$('listaEquipe');box.innerHTML=funcionarios.length?funcionarios.map(f=>{const ds=diarias.filter(x=>x.funcionario_id===f.id&&!x.paga),vs=vales.filter(x=>x.funcionario_id===f.id&&!x.quitado),bs=bonus.filter(x=>x.funcionario_id===f.id&&!x.pago),vd=ds.reduce((s,x)=>s+Number(x.valor_total||0),0),vv=vs.reduce((s,x)=>s+Number(x.valor||0),0),vb=bs.reduce((s,x)=>s+Number(x.valor||0),0),liq=vd+vb-vv;return `<div class="card item"><h3>${esc(f.nome||'Funcionário')}</h3><div class="muted">${esc(f.cargo||'')} • ${f.ativo===false?'Inativo':'Ativo'}</div><div class="grid"><div class="mini"><small>Diárias em aberto</small><b>${ds.length}</b></div><div class="mini"><small>Total pendente</small><b>${money(vd)}</b></div><div class="mini"><small>Vale</small><b>${money(vv)}</b></div><div class="mini"><small>Bônus e Extras</small><b>${money(vb)}</b></div><div class="mini"><small>Líquido</small><b>${money(liq)}</b></div></div><div class="actions"><button onclick="equipeAcao('${f.id}','diaria')">Registrar diária</button><button onclick="equipeAcao('${f.id}','vale')">Vale</button><button onclick="equipeAcao('${f.id}','bonus')">Bônus e Extras</button><button onclick="equipeAcao('${f.id}','pagar')">Pagar</button></div></div>`}).join(''):'<div class="card muted">Nenhum funcionário cadastrado.</div>'}function equipeAcao(id,tipo){sessionStorage.setItem('obrix_funcionario_acao',JSON.stringify({id,tipo}));location.href='./obrix-app-test.html?v=285#equipe'}$('entrar').onclick=async()=>{try{const sb=await OBRIX_BACKEND.init(),r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('senha').value});if(r.error)throw r.error;await carregar()}catch(e){$('erro').textContent=e.message||'Falha no login';$('erro').classList.remove('hidden')}};$('sair').onclick=async()=>{const sb=await OBRIX_BACKEND.init();await sb.auth.signOut();location.reload()};(async()=>{try{const sb=await OBRIX_BACKEND.init(),{data}=await sb.auth.getSession();if(data.session)await carregar()}catch(_){}})();</script></body></html>
