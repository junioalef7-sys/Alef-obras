<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBRIX — PagBank Sandbox</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f5f7fb;color:#111827}.wrap{max-width:760px;margin:32px auto;padding:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;box-shadow:0 8px 28px rgba(0,0,0,.06);margin-bottom:16px}h1{margin:0 0 8px;font-size:24px}h2{font-size:18px;margin:0 0 14px}p{line-height:1.45}label{display:block;font-weight:700;margin-top:12px;margin-bottom:6px}input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #cbd5e1;font-size:16px}button{border:0;background:#111827;color:#fff;font-weight:700;cursor:pointer;margin-top:12px}.secondary{background:#e5e7eb;color:#111827}.verify{background:#0f766e}.status{padding:12px;border-radius:10px;background:#f1f5f9;white-space:pre-wrap;word-break:break-word;margin-top:12px}.ok{background:#ecfdf5;color:#065f46}.err{background:#fef2f2;color:#991b1b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none!important}a.pay{display:block;text-align:center;text-decoration:none;background:#16a34a;color:#fff;font-weight:700;padding:14px;border-radius:10px;margin-top:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card"><h1>OBRIX — PagBank Sandbox</h1><p>Teste de login, checkout e confirmação do pagamento PagBank.</p></div>
  <div class="card" id="loginCard">
    <h2>1. Entrar</h2>
    <label>E-mail</label><input id="email" type="email" autocomplete="username">
    <label>Senha</label><input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn">Entrar</button>
    <div id="loginStatus" class="status hidden"></div>
  </div>
  <div class="card hidden" id="paymentCard">
    <h2>2. Pagamento</h2>
    <div class="grid">
      <div><label>Plano</label><select id="plano"><option value="mensal">Mensal</option><option value="anual">Anual</option></select></div>
      <div><label>Forma de pagamento</label><select id="metodo"><option value="pix">Pix</option><option value="boleto">Boleto</option><option value="cartao">Cartão</option></select></div>
    </div>
    <button id="checkoutBtn">Gerar checkout Sandbox</button>
    <button id="verifyBtn" class="verify">Verificar pagamento aprovado</button>
    <button id="logoutBtn" class="secondary">Sair</button>
    <div id="checkoutStatus" class="status hidden"></div>
    <a id="payLink" class="pay hidden" target="_blank" rel="noopener noreferrer">Abrir checkout PagBank</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let client=null, cfg=null, accessToken='', currentPaymentId='';
const CONFIG_URL='https://gnvclctqnwxnjxydzhwc.supabase.co/functions/v1/obrix-public-config';
const loginCard=document.getElementById('loginCard'),paymentCard=document.getElementById('paymentCard'),loginStatus=document.getElementById('loginStatus'),checkoutStatus=document.getElementById('checkoutStatus'),payLink=document.getElementById('payLink');
function show(el,text,ok=true){el.textContent=text;el.className='status '+(ok?'ok':'err')}
async function init(){
  try{
    const r=await fetch(CONFIG_URL,{cache:'no-store'});cfg=await r.json();
    if(!r.ok||!cfg.url||!cfg.publishableKey)throw new Error(cfg.error||'Configuração indisponível');
    client=window.supabase.createClient(cfg.url,cfg.publishableKey);
  }catch(e){loginStatus.classList.remove('hidden');show(loginStatus,'Erro de configuração: '+e.message,false)}
}
document.getElementById('loginBtn').onclick=async()=>{
  if(!client)return;
  const btn=document.getElementById('loginBtn');btn.disabled=true;loginStatus.classList.remove('hidden');show(loginStatus,'Entrando...');
  const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
  if(error||!data?.session){show(loginStatus,'Erro no login: '+(error?.message||'Sessão não criada'),false);btn.disabled=false;return}
  accessToken=data.session.access_token;
  loginCard.classList.add('hidden');paymentCard.classList.remove('hidden');btn.disabled=false;
};
document.getElementById('checkoutBtn').onclick=async()=>{
  const btn=document.getElementById('checkoutBtn');btn.disabled=true;payLink.classList.add('hidden');checkoutStatus.classList.remove('hidden');show(checkoutStatus,'Criando checkout no PagBank Sandbox...');
  try{
    const r=await fetch(cfg.url+'/functions/v1/pagbank-criar-checkout',{method:'POST',headers:{'apikey':cfg.publishableKey,'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({plano:document.getElementById('plano').value,metodo:document.getElementById('metodo').value,requestId:crypto.randomUUID()})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok||data?.error)throw new Error((data?.error||('HTTP '+r.status))+(data?.detalhes?'\n'+JSON.stringify(data.detalhes,null,2):''));
    currentPaymentId=data?.pagamentoId||'';
    show(checkoutStatus,'Checkout criado com sucesso.\nStatus: '+(data?.status||'-')+'\nMétodo: '+(data?.metodo||'-'));
    if(data?.checkoutUrl){payLink.href=data.checkoutUrl;payLink.classList.remove('hidden')}
  }catch(e){show(checkoutStatus,'Erro: '+e.message,false)}finally{btn.disabled=false}
};
document.getElementById('verifyBtn').onclick=async()=>{
  const btn=document.getElementById('verifyBtn');btn.disabled=true;checkoutStatus.classList.remove('hidden');show(checkoutStatus,'Consultando o pagamento diretamente no PagBank...');
  try{
    const r=await fetch(cfg.url+'/functions/v1/pagbank-reconciliar-pagamento',{method:'POST',headers:{'apikey':cfg.publishableKey,'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify(currentPaymentId?{pagamentoId:currentPaymentId}:{})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok||data?.error)throw new Error(data?.error||('HTTP '+r.status));
    const aprovado=data?.status==='aprovado'&&data?.aplicado;
    show(checkoutStatus,aprovado?'Pagamento confirmado. Assinatura OBRIX ativada com sucesso.':'Status consultado: '+(data?.status||'-')+'\nAssinatura aplicada: '+(data?.aplicado?'sim':'não'),aprovado);
  }catch(e){show(checkoutStatus,'Erro ao verificar pagamento: '+e.message,false)}finally{btn.disabled=false}
};
document.getElementById('logoutBtn').onclick=async()=>{if(client)await client.auth.signOut();accessToken='';currentPaymentId='';paymentCard.classList.add('hidden');loginCard.classList.remove('hidden');payLink.classList.add('hidden')};
init();
</script>
</body>
</html>
