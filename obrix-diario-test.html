<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OBRIX — Diário de Obras</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f8;color:#111827}.hidden{display:none!important}.wrap{max-width:1000px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 28px rgba(0,0,0,.05)}.notice{background:#fff7ed;border-color:#fed7aa;color:#9a3412;font-weight:800}.brand{font-size:27px;font-weight:900}.muted{color:#667085}.login{max-width:460px;margin:30px auto}.login label,.form label{display:block;font-weight:800;margin:12px 0 6px}.login input,.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px}.form textarea{min-height:88px}.btn,.login button{border:0;border-radius:11px;padding:12px 15px;font-weight:800;cursor:pointer;background:#111827;color:#fff}.login button{width:100%;margin-top:15px}.light{background:#e5e7eb;color:#111827}.danger{background:#b42318}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.status{padding:11px 12px;border-radius:10px;margin-top:12px;background:#eef2f7}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.row{padding:14px 0;border-top:1px solid #e5e7eb}.row:first-child{border-top:0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-weight:800;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.itemTitle{font-weight:900;font-size:18px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.kpi{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:15px}.kpi small{display:block;color:#667085;font-weight:700}.kpi strong{display:block;font-size:23px;margin-top:6px}@media(max-width:760px){.grid2,.grid3,.kpis{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.top>div:last-child{display:flex;gap:8px;width:100%}.top .btn{flex:1}}</style></head><body>
<div class="wrap"><div class="card notice">AMBIENTE DE TESTE — Diário de Obras conectado ao backend novo do OBRIX, com sincronização em tempo real.</div>
<section id="loginView" class="card login"><div class="brand">OBRIX</div><p class="muted">Teste do Diário de Obras</p><label>E-mail</label><input id="email" type="email" autocomplete="username"><label>Senha</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Entrar</button><div id="loginStatus" class="status hidden"></div></section>
<section id="appView" class="hidden"><div class="card top"><div><div class="brand">Diário de Obras</div><div id="userLine" class="muted"></div></div><div><button id="refreshBtn" class="btn light">Atualizar</button><button id="logoutBtn" class="btn light">Sair</button></div></div>
<div class="kpis"><div class="kpi"><small>Diários desta obra</small><strong id="kTotal">0</strong></div><div class="kpi"><small>Finalizados</small><strong id="kFinal">0</strong></div><div class="kpi"><small>Rascunhos</small><strong id="kRasc">0</strong></div></div>
<div class="card form"><h2 style="margin-top:0">Novo / editar diário</h2><input id="diarioId" type="hidden"><div class="grid2"><div><label>Obra</label><select id="obra"></select></div><div><label>Data</label><input id="data" type="date"></div></div><div class="grid3"><div><label>Clima</label><select id="clima"><option>Ensolarado</option><option>Nublado</option><option>Chuvoso</option><option>Parcialmente nublado</option></select></div><div><label>Temperatura</label><input id="temperatura" placeholder="Ex.: 28°C"></div><div><label>Status</label><select id="status"><option value="rascunho">Rascunho</option><option value="finalizado">Finalizado</option></select></div></div><label>Serviços executados</label><textarea id="servicos" placeholder="Ex.: Alvenaria do pavimento térreo"></textarea><label>Ocorrências</label><textarea id="ocorrencias" placeholder="Ex.: Sem ocorrências"></textarea><label>Materiais utilizados</label><textarea id="materiais" placeholder="Ex.: Cimento, areia e blocos"></textarea><label>Equipamentos utilizados</label><textarea id="equipamentos" placeholder="Ex.: Betoneira"></textarea><label>Observações</label><textarea id="obs"></textarea><div class="actions"><button id="saveBtn" class="btn">Salvar diário</button><button id="cancelEdit" class="btn light hidden">Cancelar edição</button></div><div id="formStatus" class="status hidden"></div></div>
<div class="card"><h2 style="margin-top:0">Histórico da obra</h2><div class="muted">Uma obra pode ter somente um diário por data.</div><div id="lista"></div></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script><script src="./obrix-backend-adapter.js"></script><script>
const $=id=>document.getElementById(id);let profile=null,obras=[],diarios=[];function show(el,t,ok=true){el.textContent=t;el.className='status '+(ok?'ok':'err');el.classList.remove('hidden')}function today(){return new Date().toISOString().slice(0,10)}function obraId(){return $('obra').value}
function fillObras(){const s=$('obra'),old=s.value;s.innerHTML='';obras.forEach(o=>{const op=document.createElement('option');op.value=o.id;op.textContent=o.nome;s.appendChild(op)});if([...s.options].some(x=>x.value===old))s.value=old;render()}
function currentRows(){return diarios.filter(d=>d.obra_id===obraId()).sort((a,b)=>String(b.data).localeCompare(String(a.data)))}
function render(){const rows=currentRows();$('kTotal').textContent=rows.length;$('kFinal').textContent=rows.filter(x=>x.status==='finalizado').length;$('kRasc').textContent=rows.filter(x=>x.status==='rascunho').length;const h=$('lista');h.innerHTML='';if(!rows.length){h.innerHTML='<div class="row muted">Nenhum diário para esta obra.</div>';return}rows.forEach(d=>{const el=document.createElement('div');el.className='row';el.innerHTML='<div class="itemTitle"></div><div><span class="badge"></span></div><div class="muted resumo"></div><div class="actions"></div>';el.querySelector('.itemTitle').textContent=d.data+' — '+(d.clima||'Sem clima');el.querySelector('.badge').textContent=d.status==='finalizado'?'Finalizado':'Rascunho';el.querySelector('.resumo').textContent=(d.servicos_executados||'Sem serviços informados')+(d.ocorrencias?' • Ocorrências: '+d.ocorrencias:'');const a=el.querySelector('.actions');const e=document.createElement('button');e.className='btn';e.textContent='Editar';e.onclick=()=>edit(d);const del=document.createElement('button');del.className='btn danger';del.textContent='Excluir';del.onclick=()=>removeD(d);a.append(e,del);h.appendChild(el)})}
function resetForm(){$('diarioId').value='';$('data').value=today();$('clima').value='Ensolarado';$('temperatura').value='';$('status').value='rascunho';$('servicos').value='';$('ocorrencias').value='';$('materiais').value='';$('equipamentos').value='';$('obs').value='';$('cancelEdit').classList.add('hidden')}
function edit(d){$('diarioId').value=d.id;$('obra').value=d.obra_id;$('data').value=d.data;$('clima').value=d.clima||'Ensolarado';$('temperatura').value=d.temperatura||'';$('status').value=d.status;$('servicos').value=d.servicos_executados||'';$('ocorrencias').value=d.ocorrencias||'';$('materiais').value=d.materiais_utilizados||'';$('equipamentos').value=d.equipamentos_utilizados||'';$('obs').value=d.observacoes||'';$('cancelEdit').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
async function loadAll(){profile=await OBRIX_BACKEND.profile();[obras,diarios]=await Promise.all([OBRIX_BACKEND.readTable('obras','criado_em'),OBRIX_BACKEND.readTable('diarios_obra','data')]);$('userLine').textContent=profile?.nome||profile?.email||'Usuário';fillObras();if(!$('data').value)$('data').value=today()}
async function save(){if(!obraId()||!$('data').value){show($('formStatus'),'Selecione a obra e a data.',false);return}const b=$('saveBtn');b.disabled=true;try{const sb=await OBRIX_BACKEND.init();const id=$('diarioId').value;const payload={obra_id:obraId(),data:$('data').value,clima:$('clima').value,temperatura:$('temperatura').value.trim()||null,servicos_executados:$('servicos').value.trim()||null,ocorrencias:$('ocorrencias').value.trim()||null,materiais_utilizados:$('materiais').value.trim()||null,equipamentos_utilizados:$('equipamentos').value.trim()||null,observacoes:$('obs').value.trim()||null,status:$('status').value,atualizado_em:new Date().toISOString()};let q=id?sb.from('diarios_obra').update(payload).eq('id',id).select('id'):sb.from('diarios_obra').insert({...payload,empresa_id:profile.empresa_id}).select('id');const {data,error}=await q;if(error)throw error;if(!data?.length)throw new Error('Gravação não confirmada.');show($('formStatus'),id?'Diário atualizado com sucesso.':'Diário criado com sucesso.');resetForm();await loadAll()}catch(e){let m=e.message||String(e);if(m.includes('duplicate key'))m='Já existe um diário para esta obra nessa data.';show($('formStatus'),'Erro: '+m,false)}finally{b.disabled=false}}
async function removeD(d){if(!confirm('Excluir o diário de '+d.data+'?'))return;try{const sb=await OBRIX_BACKEND.init();const {error}=await sb.from('diarios_obra').delete().eq('id',d.id);if(error)throw error;show($('formStatus'),'Diário excluído com sucesso.');await loadAll()}catch(e){show($('formStatus'),'Erro ao excluir: '+e.message,false)}}
async function enter(){await loadAll();$('loginView').classList.add('hidden');$('appView').classList.remove('hidden')}
$('loginBtn').onclick=async()=>{const b=$('loginBtn');b.disabled=true;show($('loginStatus'),'Entrando...');try{const sb=await OBRIX_BACKEND.init();const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error||!data?.session)throw error||new Error('Sessão não criada.');await enter()}catch(e){show($('loginStatus'),'Erro: '+e.message,false)}finally{b.disabled=false}};$('logoutBtn').onclick=async()=>{const sb=await OBRIX_BACKEND.init();await sb.auth.signOut();$('appView').classList.add('hidden');$('loginView').classList.remove('hidden')};$('refreshBtn').onclick=loadAll;$('obra').onchange=render;$('saveBtn').onclick=save;$('cancelEdit').onclick=resetForm;(async()=>{try{const sb=await OBRIX_BACKEND.init();const {data}=await sb.auth.getSession();if(data?.session)await enter()}catch(_){}})();window.loadAll=loadAll;
</script><script src="./obrix-realtime-sync.js?v=156"></script></body></html>
